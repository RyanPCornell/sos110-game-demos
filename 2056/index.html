    let state={phase:'idle'}, sliderTouched=false, nameMap={};
    const S = () => CM_SCEN[state.scen] || CM_SCEN.fishing;
    const players = () => state.players || {};
    const nPlayers = () => Object.keys(players()).length;
    const joined = () => !HOST && players()[pk]!==undefined;
    function rebuildNames(){ // players map stores join timestamps -> "Student N" by join order
      const ks=Object.keys(players());
      ks.sort((a,b)=> (players()[a]-players()[b]) || (a<b?-1:1));
      nameMap={}; ks.forEach((k,i)=>{ nameMap[k]='Student '+(i+1); });
    }
    const nameOf = k => nameMap[k] || 'Student ?';
    const roundChoices = r => (state.choices||{})['r'+r] || {};
    const myChoice = r => { const c=roundChoices(r)[pk]; return c===undefined?null:c; };
    const histEntry = r => (state.hist||{})['r'+r];
    function capNow(){ const h=state.health===undefined?1:state.health;
      return {cap:nPlayers()*S().max*h, sust:nPlayers()*S().max*h*0.4}; }
    function earned(who, r){ const e=histEntry(r); if(!e) return 0;
      const amt=roundChoices(r)[who]; return amt===undefined?0:amt*S().unitValue*e.mult; }
    function totalEarned(who){ let t=0; for(let r=1;r<=(state.round||0);r++) t+=earned(who,r); return t; }

    /* The arithmetic that ends a round lives here rather than inside the host
       button, so the self-running demo plays the real game instead of an
       imitation of it. */
    function roundVerdict(r){
      const ch=roundChoices(r), n=nPlayers();
      if(!n) return null;
      let total=0; Object.keys(ch).forEach(k=>{ total+=ch[k]; });
      const h=state.health===undefined?1:state.health;
      const cap=n*S().max*h, sust=cap*0.4;
      let mult, zone, h2;
      if(total<=sust){ mult=1; zone='green'; h2=Math.min(1, h*1.08); }
      else if(total<=cap){
        const raw=(cap-total)/(cap-sust);
        mult=Math.round(Math.max(0,Math.pow(raw,1.5))*1000)/1000;
        zone= mult>0.4 ? 'yellow' : 'orange';
        const overshoot=(total-sust)/Math.max(1e-9,cap-sust);
        h2=Math.max(0.05, h*(1-overshoot*0.35));
      } else { mult=0; zone='red'; h2=Math.max(0.05, h*0.35); }
      h2=Math.round(h2*10000)/10000;
      const coopPer=Math.floor(sust/n), coopEarn=Math.round(coopPer*S().unitValue*100)/100;
      return {collapsed:h2<=0.05, health:h2,
        entry:{total:total, cap:Math.round(cap*10)/10, sust:Math.round(sust*10)/10,
               mult:mult, zone:zone, health:h2, coopPer:coopPer, coopEarn:coopEarn}};
    }

    function theme(){
      sec.style.setProperty('--cm-color', S().color);
      water.style.background = S().grad;
    }
    function renderMeter(){
      const ph=state.phase||'idle';
      const h = ph==='idle' ? null : (state.health===undefined?1:state.health);
      water.style.height = h===null ? '0%' : (Math.max(0,Math.min(1,h))*86)+'%';
      poolNum.textContent = h===null ? '—' : Math.round(h*100)+'%';
      poolLbl.textContent = S().resName;
      const c=capNow();
      capEl.textContent = (ph==='open'||ph==='reveal') && nPlayers()
        ? ('sustainable ≤ '+Math.floor(c.sust)+' · capacity '+Math.round(c.cap)+' '+S().unit) : '';
      const nIcons = h===null ? 0 : (h>0.02 ? Math.max(1, Math.round(h*36)) : 0);
      const iconKey = S().res+':'+nIcons;
      if(fishBox.dataset.k!==iconKey){
        fishBox.dataset.k=iconKey; fishBox.innerHTML='';
        for(let i=0;i<nIcons;i++){ const s=document.createElement('span'); s.innerHTML=CM_SPRITE[S().res]||'';
          s.style.animationDelay=(-Math.random()*2.6).toFixed(2)+'s'; fishBox.appendChild(s); }
      }
      sec.classList.toggle('dead', !!state.collapsed);
    }
    function renderHist(){
      const rounds=[]; for(let r=1;r<=(state.round||0);r++){ if(histEntry(r)) rounds.push([r,histEntry(r)]); }
      hist.hidden=!rounds.length || (state.phase||'idle')==='final';
      histTitle.textContent=S().resName+', round by round';
      if(!rounds.length){ histBars.innerHTML=''; return; }
      histBars.innerHTML='';
      function bar(lbl,frac,cls){ const w=document.createElement('div'); w.className='cm-hbar'+(cls?' '+cls:'');
        const pct=Math.max(frac>0?4:0, frac*100);
        w.innerHTML='<div class="cm-hbar-col"><div class="cm-hbar-fill" style="height:'+pct+'%"></div></div>'
          +'<div class="cm-hbar-lbl">'+lbl+'</div><div class="cm-hbar-val">'+Math.round(frac*100)+'%</div>';
        histBars.appendChild(w); }
      bar('start',1);
      rounds.forEach(e=>bar('R'+e[0], e[1].health, e[1].health<=0.05?'dead':''));
    }
    // How many people chose each amount in the last revealed round. The choices
    // are integers on a 0..max slider, so every possible answer gets its own
    // column — including the ones nobody picked, which is itself the finding.
    // Only a REVEALED round is ever drawn: the round in play stays secret.
    function lastRevealed(){ let last=0;
      for(let r=1;r<=(state.round||0);r++){ if(histEntry(r)) last=r; }
      return last; }
    function renderPicks(){
      const r=lastRevealed();
      if(!r || (state.phase||'idle')==='final'){ picks.hidden=true; picksSvg.innerHTML=''; return; }
      picks.hidden=false;
      const ch=roundChoices(r), e=histEntry(r), MX=S().max;
      const counts=new Array(MX+1).fill(0);
      let n=0, sum=0;
      Object.keys(ch).forEach(function(k){
        const v=Math.max(0, Math.min(MX, Math.round(ch[k])));
        counts[v]++; n++; sum+=ch[k];
      });
      const safeMax = (e && e.coopPer!==undefined) ? e.coopPer : null;   // per-person sustainable share
      const mine = (!HOST) ? myChoice(r) : null;
      const myV = (mine===null) ? -1 : Math.max(0, Math.min(MX, Math.round(mine)));

      picksTitle.textContent = 'What the class chose · Round '+r;

      const W=400, PADL=16, PADR=16, BASE=112, TOP=34;
      const nb=MX+1, plotW=W-PADL-PADR, slot=plotW/nb,
            bw=Math.min(slot*0.74, 42), peak=Math.max.apply(null, counts.concat([1]));
      let sv='<defs><filter id="cmPk-'+id+'" x="-4%" y="-4%" width="108%" height="108%">'
        +'<feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="5" result="n"/>'
        +'<feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>'
        +'</filter></defs><g filter="url(#cmPk-'+id+')">';
      counts.forEach(function(c,i){
        const h=c ? Math.max((c/peak)*(BASE-TOP), 3) : 2.5,
              x=PADL+i*slot+(slot-bw)/2, y=BASE-h;
        const cls = !c ? 'empty' : ((safeMax!==null && i>safeMax) ? 'over' : '');
        sv+='<rect class="cm-pk-bar'+(cls?' '+cls:'')+(i===myV?' me':'')+'" x="'+x.toFixed(1)
          +'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"/>';
        if(c) sv+='<text class="cm-pk-cnt" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'">'+c+'</text>';
      });
      sv+='<path class="cm-pk-axis" d="M'+PADL+' '+BASE+' H'+(W-PADR)+'"/></g>';
      // one tick per possible answer
      counts.forEach(function(c,i){
        sv+='<text class="cm-pk-x" x="'+(PADL+i*slot+slot/2).toFixed(1)+'" y="'+(BASE+15)+'">'+i+'</text>';
      });
      // the line between "kept it alive" and "took more than it could give"
      if(safeMax!==null && safeMax<MX){
        const lx=PADL+(safeMax+1)*slot;
        sv+='<path class="cm-pk-line" d="M'+lx.toFixed(1)+' 16 V'+BASE+'"/>';
        const right = lx < W*0.62;
        sv+='<text class="cm-pk-lbl" x="'+(right?lx+4:lx-4).toFixed(1)+'" y="13" text-anchor="'
          +(right?'start':'end')+'">sustainable share: '+safeMax+' or less</text>';
      }
      if(myV>=0) sv+='<text class="cm-pk-you" x="'+(PADL+myV*slot+slot/2).toFixed(1)+'" y="'+(BASE+29)+'">you</text>';
      picksSvg.innerHTML=sv;
      picksSub.textContent = n + (n===1?' player':' players')
        + (n ? ' · average ' + (sum/n).toFixed(1) + ' ' + S().unit + ' each' : '');
    }

    // ── end-of-game debrief ───────────────────────────────────────────────────
    // Per-round behaviour, which is what the class can actually argue about
    // afterwards: what people took, whether the safe level moved under them,
    // and how many stayed inside it.
    function roundStats(){
      const out=[];
      for(let r=1;r<=(state.round||0);r++){
        const e=histEntry(r); if(!e) continue;
        const ch=roundChoices(r), ks=Object.keys(ch);
        let sum=0, within=0;
        ks.forEach(function(k){ sum+=ch[k]; if(e.coopPer!==undefined && ch[k]<=e.coopPer) within++; });
        out.push({r:r, n:ks.length, avg:ks.length?sum/ks.length:0,
                  coop:(e.coopPer===undefined?null:e.coopPer),
                  within:ks.length?within/ks.length:null, health:e.health});
      }
      return out;
    }
    function playedKeys(){
      const seen={};
      for(let r=1;r<=(state.round||0);r++){
        const c=roundChoices(r); Object.keys(c).forEach(function(k){ seen[k]=1; });
      }
      let ks=Object.keys(players()).filter(function(k){ return seen[k]; });
      return ks.length ? ks : Object.keys(players());
    }
    function takeTotal(who){ let t=0;
      for(let r=1;r<=(state.round||0);r++){ const v=roundChoices(r)[who]; if(v!==undefined) t+=v; }
      return t; }
    function renderSummary(){
      const R=roundStats();
      if((state.phase||'idle')!=='final' || !R.length){ summary.hidden=true; return; }
      summary.hidden=false;

      const W=640, PADL=44, PADR=18, BASE=112, TOP=32, nR=R.length;
      const plotW=W-PADL-PADR, slot=plotW/nR, bw=Math.min(slot*0.42, 38);
      let top=0; R.forEach(function(d){ top=Math.max(top, d.avg, d.coop||0); });
      const ymax=Math.max(1, top)*1.2, sy=function(v){ return BASE-(v/ymax)*(BASE-TOP); };
      const cx=function(i){ return PADL+i*slot+slot/2; };

      let sv='<defs><filter id="cmSm-'+id+'" x="-3%" y="-3%" width="106%" height="106%">'
        +'<feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n"/>'
        +'<feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>'
        +'</filter></defs>';
      // legend, above the plot
      sv+='<rect class="cm-sm-bar" x="'+PADL+'" y="6" width="14" height="9" rx="2"/>'
        + '<text class="cm-sm-leg" x="'+(PADL+20)+'" y="14">average taken</text>'
        + '<path class="cm-sm-line" d="M'+(PADL+128)+' 11 H'+(PADL+150)+'"/>'
        + '<text class="cm-sm-leg" x="'+(PADL+156)+'" y="14">what the resource could sustain</text>';
      // y gridlines
      [0, ymax/2, ymax].forEach(function(v){
        sv+='<path class="cm-sm-grid" d="M'+PADL+' '+sy(v).toFixed(1)+' H'+(W-PADR)+'"/>'
          + '<text class="cm-sm-y" x="'+(PADL-7)+'" y="'+(sy(v)+3.5).toFixed(1)+'" text-anchor="end">'
          + v.toFixed(v<10?1:0)+'</text>';
      });
      sv+='<g filter="url(#cmSm-'+id+')">';
      R.forEach(function(d,i){
        const y=sy(d.avg), h=Math.max(BASE-y, 2);
        sv+='<rect class="cm-sm-bar" x="'+(cx(i)-bw/2).toFixed(1)+'" y="'+y.toFixed(1)
          +'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"/>';
      });
      sv+='<path class="cm-sm-axis" d="M'+PADL+' '+BASE+' H'+(W-PADR)+'"/></g>';
      // the safe level, which shrinks as the resource is damaged
      const pts=R.filter(function(d){ return d.coop!==null; });
      if(pts.length){
        let dPath='';
        R.forEach(function(d,i){ if(d.coop===null) return;
          dPath += (dPath?' L':'M')+cx(i).toFixed(1)+' '+sy(d.coop).toFixed(1); });
        sv+='<path class="cm-sm-line" d="'+dPath+'"/>';
        R.forEach(function(d,i){ if(d.coop===null) return;
          sv+='<circle class="cm-sm-dot" cx="'+cx(i).toFixed(1)+'" cy="'+sy(d.coop).toFixed(1)+'" r="2.6"/>'; });
      }
      R.forEach(function(d,i){
        sv+='<text class="cm-sm-val" x="'+cx(i).toFixed(1)+'" y="'+(sy(d.avg)-5).toFixed(1)+'">'
          + d.avg.toFixed(1)+'</text>'
          + '<text class="cm-sm-x" x="'+cx(i).toFixed(1)+'" y="'+(BASE+16)+'">Round '+d.r+'</text>'
          + '<text class="cm-sm-h" x="'+cx(i).toFixed(1)+'" y="'+(BASE+31)+'">'
          + Math.round(d.health*100)+'% left</text>';
      });
      sv+='<text class="cm-sm-note" x="'+(W-PADR)+'" y="'+(BASE+43)+'">'
        + '% = '+S().resName.toLowerCase()+' still left</text>';
      sumSvg.innerHTML=sv;

      // ── the chips ───────────────────────────────────────────────────────────
      const uv=S().unitValue, ks=playedKeys(), nP=ks.length;
      function chip(k,v,c){ return '<div class="cm-sum-chip"><span class="k">'+k+'</span>'
        + '<span class="v">'+v+'</span><span class="c">'+c+'</span></div>'; }
      let chips='';

      // 1 — did restraint hold, or erode?
      const w0=R[0].within, wN=R[nR-1].within;
      if(w0!==null && wN!==null){
        chips += (nR===1)
          ? chip('Stayed within the limit', Math.round(w0*100)+'%', 'of players, in the one round played')
          : chip('Stayed within the limit', Math.round(w0*100)+'% → '+Math.round(wN*100)+'%',
              'of players, round 1 → round '+R[nR-1].r);
      }
      // 2 — the cost of the trap. If everyone had held to the share the resource
      // could carry at full health, health never falls, so that share holds all
      // game and the counterfactual is just share x value x rounds x players.
      const idealPer=Math.floor(S().max*0.4);
      const idealTotal=idealPer*uv*nR*nP;
      let actualTotal=0; ks.forEach(function(k){ actualTotal+=totalEarned(k); });
      const gap=idealTotal-actualTotal;
      chips+=chip(gap>0?'Left on the table':'Earned above the safe path',
        CM_FMT(Math.abs(gap)),
        CM_FMT(actualTotal)+' earned vs '+CM_FMT(idealTotal)+' if everyone had held to '
        + idealPer+' '+S().unit+' a round');
      // 3 — did taking more actually pay? Thirds need enough players to mean much.
      if(nP>=6){
        const arr=ks.map(function(k){ return {take:takeTotal(k), earn:totalEarned(k)}; });
        arr.sort(function(a,b){ return b.take-a.take; });
        const q=Math.max(1, Math.floor(arr.length/3));
        const mean=function(list){ let t=0; list.forEach(function(o){ t+=o.earn; }); return t/list.length; };
        const hi=mean(arr.slice(0,q)), lo=mean(arr.slice(-q));
        chips+=chip('Did taking more pay?', CM_FMT(hi)+' vs '+CM_FMT(lo),
          'average earnings of the top third of takers vs the bottom third');
      }
      // 4 — students only: where you sat against the room
      if(!HOST && players()[pk]!==undefined){
        const myTake=takeTotal(pk), rPlayed=nR||1;
        let allTake=0; ks.forEach(function(k){ allTake+=takeTotal(k); });
        chips+=chip('You took', (myTake/rPlayed).toFixed(1)+' a round',
          'the class averaged '+(nP?(allTake/nP/rPlayed).toFixed(1):'—')+' '+S().unit);
      }
      sumChips.innerHTML=chips;
    }
    function renderBoard(){
      const ph=state.phase||'idle';
      const show = (ph==='lobby') || ((ph==='open'||ph==='reveal'||ph==='final') && (state.hist&&Object.keys(state.hist).length));
      board.hidden=!show; if(!show) return;
      if(ph==='lobby'){
        boardTitle.textContent='In the lobby — '+nPlayers()+' player'+(nPlayers()===1?'':'s');
        const ks=Object.keys(players()).sort((a,b)=> (players()[a]-players()[b]) || (a<b?-1:1));
        let roster=ks.slice(0,14).map(k=>'<div class="cm-brow'+(k===pk?' me':'')+'"><span class="nm">'
          +nameOf(k)+'</span></div>').join('');
        if(ks.length>14) roster+='<div class="cm-brow"><span class="nm" style="color:var(--muted)">…and '+(ks.length-14)+' more</span></div>';
        boardRows.innerHTML = roster || '<div class="cm-brow"><span class="nm" style="color:var(--muted)">No one yet…</span></div>';
        boardRows.hidden=false; dist.hidden=true;
        return;
      }
      // No ranking table: a leaderboard invites "who won", when the point is that
      // the class as a whole did worse than it could have. Show where YOU sit
      // against the class average, and how the whole class is spread.
      boardTitle.textContent = ph==='final' ? 'Final results' : 'Where the class stands';
      boardRows.hidden=true; dist.hidden=false;
      // Count only students who actually submitted a choice in a played round.
      // Someone sitting in the roster without ever playing would otherwise sit at
      // $0 and drag the class average down — and it keeps the figure honest if a
      // stale entry ever lingers in the roster.
      const playedSet={};
      for(let rr=1; rr<=(state.round||0); rr++){
        const c=roundChoices(rr); Object.keys(c).forEach(function(k){ playedSet[k]=1; });
      }
      let ks=Object.keys(players()).filter(function(k){ return playedSet[k]; });
      if(!ks.length) ks=Object.keys(players());
      const vals=ks.map(function(k){ return totalEarned(k); });
      const nP=vals.length;
      const sum=vals.reduce((a,b)=>a+b,0);
      const avg=nP? sum/nP : 0;
      const mine=(!HOST && pk && players()[pk]!==undefined) ? totalEarned(pk) : null;
      youLbl.textContent = (mine===null) ? 'Class total' : 'You earned';
      youVal.textContent = (mine===null) ? CM_FMT(sum) : CM_FMT(mine);
      avgVal.textContent = CM_FMT(avg);

      // histogram of earnings — a pie can't show a spread, so this buckets the
      // class into columns, tints your own bucket, and marks the average.
      // Bins span the OBSERVED range rather than 0..max: earnings cluster in a
      // narrow band well above zero, so anchoring at 0 crushed the whole class
      // into two or three columns. Empty buckets keep a faint stub so the axis
      // still reads as eight buckets rather than a handful of floating bars.
      const W=640, PADL=14, PADR=14, BASE=58, TOP=18, BINS=8;   // TOP leaves headroom for the count above the tallest bar;
      // the box is deliberately wide and short so eight buckets plus two label
      // rows fit without the panel growing taller than the column it sits in
      let lo = vals.length ? Math.min.apply(null, vals) : 0;
      let hi = vals.length ? Math.max.apply(null, vals) : 1;
      if(!(hi>lo)){ const pad=Math.max(1, Math.abs(hi)*0.15); lo=Math.max(0, hi-pad); hi=hi+pad; }
      const span=hi-lo, step=span/BINS;
      const binOf=function(v){ return Math.max(0, Math.min(BINS-1, Math.floor((v-lo)/step))); };
      const counts=new Array(BINS).fill(0);
      vals.forEach(function(v){ counts[binOf(v)]++; });
      const myBin = (mine===null) ? -1 : binOf(mine);
      const peak=Math.max.apply(null, counts.concat([1]));
      const plotW=W-PADL-PADR, bw=plotW/BINS;
      let sv='<defs><filter id="cmRough-'+id+'" x="-6%" y="-6%" width="112%" height="112%">'
        +'<feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="n"/>'
        +'<feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>'
        +'</filter></defs><g filter="url(#cmRough-'+id+')">';
      counts.forEach(function(c,i){
        const h=c ? Math.max((c/peak)*(BASE-TOP), 2.5) : 2,
              x=PADL+i*bw+2, y=BASE-h;
        sv+='<rect class="cm-hbar2'+(c?'':' ghost')+(i===myBin?' me':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)
          +'" width="'+(bw-4).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2"/>';
        if(c) sv+='<text class="cm-hcount" x="'+(x+(bw-4)/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'">'+c+'</text>';
      });
      sv+='<path class="cm-haxis" d="M'+PADL+' '+BASE+' H'+(W-PADR)+'"/></g>';
      // average marker — nudged sideways if it would sit on top of "you"
      const ax=PADL+((avg-lo)/span)*plotW;
      const axc=Math.min(W-PADR-8, Math.max(PADL+12, ax));
      const youX=(myBin>=0) ? PADL+myBin*bw+bw/2 : null;
      let avgLblX=axc;
      if(youX!==null && Math.abs(axc-youX)<26) avgLblX = (axc>=youX) ? Math.min(W-PADR-8, youX+26) : Math.max(PADL+12, youX-26);
      sv+='<path class="cm-havg" d="M'+ax.toFixed(1)+' '+TOP+' V'+BASE+'"/>'
        + '<text class="cm-havglbl" x="'+avgLblX.toFixed(1)+'" y="'+(BASE+13)+'" text-anchor="middle">avg</text>';
      if(youX!==null) sv+='<text class="cm-hyou" x="'+youX.toFixed(1)+'" y="'+(BASE+13)+'" text-anchor="middle">you</text>';
      // range labels: inset from the edges so they can't clip out of the viewBox
      sv+='<text class="cm-hend" x="'+PADL+'" y="'+(BASE+28)+'">'+CM_FMT(lo)+'</text>'
        + '<text class="cm-hend mid" x="'+(W/2)+'" y="'+(BASE+28)+'" text-anchor="middle">lowest → highest in the class</text>'
        + '<text class="cm-hend" x="'+(W-PADR)+'" y="'+(BASE+28)+'" text-anchor="end">'+CM_FMT(hi)+'</text>';
      histo.innerHTML=sv;
    }
    function renderReveal(){
      const ph=state.phase||'idle', r=state.round||0, e=histEntry(r);
      const showRev = (ph==='reveal'||ph==='final') && e;
      revealBox.hidden = !(showRev || ph==='final');
      if(!revealBox.hidden && showRev){
        const zoneTxt={green:'Sustainable — everyone sold at full price, and the '+S().resName.toLowerCase()+' recovered.',
          yellow:'Strained — overharvest cut everyone’s payout to '+Math.round(e.mult*100)+'% of full price.',
          orange:'Badly strained — the payout multiplier crashed to '+Math.round(e.mult*100)+'%.',
          red:'Beyond capacity — the '+S().resName.toLowerCase()+' crashed. This round paid $0.'};
        zoneEl.className='cm-zone '+e.zone; zoneEl.textContent=zoneTxt[e.zone]||'';
        let lines='Round '+r+': the class took <strong>'+e.total+' '+S().unit+'</strong> — sustainable threshold was <strong>'
          +Math.floor(e.sust)+'</strong>, capacity <strong>'+e.cap+'</strong>.';
        lines+='<span class="coop">If everyone had taken '+e.coopPer+' or less, each player would have earned '
          +CM_FMT(e.coopEarn)+' this round.</span>';
        if(ph==='final'){
          let classTot=0; Object.keys(players()).forEach(k=>{ classTot+=totalEarned(k); });
          /* The benchmark has to be the counterfactual, not this round's ceiling.
             A class that cooperates from round one never damages the stock, so
             its sustainable share stays at the undamaged level every round —
             measuring against the wrecked resource the defectors produced makes
             cooperation look worse than it was, which is the opposite lesson. */
          const coopPerFull=Math.floor(S().max*0.4);
          const coopTot=coopPerFull*S().unitValue*nPlayers()*(state.round||0);
          lines+='<span class="coop"><strong>Game over.</strong> The class earned '+CM_FMT(classTot)
            +' in total. Taking '+coopPerFull+' '+S().unit+' each from round one would have earned about '
            +CM_FMT(coopTot)+' — and left the '+S().resName.toLowerCase()+' untouched.</span>';
        }
        revLines.innerHTML=lines;
      } else if(!revealBox.hidden){ zoneEl.className='cm-zone'; zoneEl.textContent='Game over.'; revLines.innerHTML=''; }
    }
    function renderMe(){
      if(HOST || !joined() || !(state.hist&&Object.keys(state.hist).length)){ meEl.hidden=true; return; }
      meEl.hidden=false;
      const r=state.round||0, e=histEntry(r);
      meEl.innerHTML='Your earnings: '+(e?'<strong>'+CM_FMT(earned(pk,r))+'</strong> this round · ':'')
        +'<strong>'+CM_FMT(totalEarned(pk))+'</strong> total';
    }
    function payoutMult(total, n, h){ // same payoff model the host uses at reveal
      const cap=n*S().max*h, sust=cap*0.4;
      if(total<=sust) return 1;
      if(total<=cap) return Math.max(0, Math.pow((cap-total)/(cap-sust), 1.5));
      return 0;
    }
    function renderExamples(){
      // three live what-ifs, computed from THIS round's context (players, health, prices):
      // temptation (defect while others cooperate), sucker (cooperate while others defect),
      // and full cooperation — the classic social-dilemma payoffs, made concrete.
      const n=nPlayers(), h=state.health===undefined?1:state.health, uv=S().unitValue;
      if(n<2){ examplesEl.innerHTML=''; return; }
      const cap=n*S().max*h, sust=cap*0.4;
      const mid=Math.max(0, Math.floor(sust/n));         // the sustainable per-person share
      const hi=S().max;                                   // aiming high
      const lo=Math.max(1, Math.floor(mid/2)) || 1;       // aiming low
      const oHigh=Math.max(mid+1, Math.round(S().max*0.8)); // others averaging unsustainably high
      const mA=payoutMult(hi+(n-1)*mid, n, h);            // you defect, others sustainable
      const mB=payoutMult(lo+(n-1)*oHigh, n, h);          // you hold back, others defect
      const row=(color,txt)=>'<div class="cm-ex" style="border-left-color:'+color+'">'+txt+'</div>';
      examplesEl.innerHTML =
        row('#b8860b','If you take <b>'+hi+'</b> and the other '+(n-1)+' average '+mid+' each → <strong>you earn '
          +CM_FMT(hi*uv*mA)+'</strong>, they get '+CM_FMT(mid*uv*mA)+' each.')
        +row('#a4373a','If you take <b>'+lo+'</b> and the others average '+oHigh+' each → <strong>you earn '
          +CM_FMT(lo*uv*mB)+'</strong>'+(mB===0?' — the '+S().resName.toLowerCase()+' crashes.':'.'))
        +row('#2f6b4f','If <b>everyone</b> takes '+mid+' → <strong>everyone earns '+CM_FMT(mid*uv)
          +'</strong> at full price, every round — and the '+S().resName.toLowerCase()+' recovers.');
    }
    function render(){
      const ph=state.phase||'idle', r=state.round||0;
      rebuildNames();
      sec.classList.toggle('is-final', ph==='final');
      theme(); renderMeter(); renderHist(); renderPicks(); renderSummary(); renderBoard(); renderReveal(); renderMe();
      // scenario story card
      scenCard.hidden = !(ph==='lobby' || (ph!=='idle' && !joined() && !HOST && ph!=='final'));
      if(!scenCard.hidden){ scenName.textContent=S().name;
        scenDesc.textContent=S().desc; }
      // banner
      if(state.collapsed){ banner.hidden=false; banner.className='cm-banner bad';
        banner.innerHTML='<span>The commons collapsed</span>'; }
      else if(ph==='final'){ banner.hidden=false; banner.className='cm-banner good';
        banner.innerHTML='<span>The commons survived '+r+' round'+(r===1?'':'s')+'</span>'; }
      else banner.hidden=true;
      // join + decide visibility (students only)
      joinForm.hidden = HOST || !(ph==='lobby'||ph==='open') || joined();
      const mine = ph==='open' ? myChoice(r) : null;
      decideBox.hidden = HOST || ph!=='open' || !joined();
      if(!decideBox.hidden){
        promptEl.textContent=S().prompt;
        range.max=S().max; rangeUnit.textContent=S().unit;
        renderExamples();
        const locked = mine!==null;
        range.disabled=locked; submitBtn.disabled=locked;
        if(locked){ range.value=mine; rangeNum.textContent=mine; submitBtn.textContent='Locked in: '+mine+' '+S().unit; }
        else { if(!sliderTouched){ rangeNum.textContent=range.value; } submitBtn.textContent='Lock in my choice'; }
      } else { sliderTouched=false; }
      // host buttons + status
      const decided=Object.keys(roundChoices(r)).length;
      if(HOST){
        el('[data-cm-setup]').hidden = !(ph==='idle'||ph==='lobby'||ph==='final');
        startBtn.hidden = !(ph==='idle'||ph==='lobby'||ph==='final');
        startBtn.textContent = ph==='idle' ? 'Open the lobby' : (ph==='lobby' ? 'Start round 1' : 'Start a new game');
        endRoundBtn.hidden = ph!=='open';
        nextBtn.hidden = ph!=='reveal';
        if(ph==='reveal') nextBtn.textContent = r>=(state.rounds||1) ? 'Show final results ▸' : 'Next round ▸';
        finishBtn.hidden = !(ph==='open'||ph==='reveal');
        if(ph==='idle') statusEl.textContent='Pick a scenario and open the lobby once everyone has the deck open.';
        else if(ph==='lobby') statusEl.textContent=nPlayers()+' player'+(nPlayers()===1?'':'s')+' in the lobby. Start round 1 when everyone has joined.';
        else if(ph==='open') statusEl.textContent='Round '+r+' of '+(state.rounds||'?')+' — '+decided+' of '+nPlayers()+' have locked in. Reveal when ready.';
        else if(ph==='reveal') statusEl.textContent='Round '+r+' revealed on every screen. Continue when ready.';
        else statusEl.textContent='Game over. Start a new game to play again.';
      } else {
        if(ph==='idle') statusEl.textContent='Waiting for the instructor to open the game…';
        else if(ph==='lobby') statusEl.textContent= joined()
          ? 'You’re in as '+nameOf(pk)+'! Waiting for the game to start… ('+nPlayers()+' joined)'
          : 'Tap below to join — you’ll play as an anonymous Student number.';
        else if(ph==='open') statusEl.textContent= !joined()
          ? 'Round '+r+' is underway — join below to play from this round.'
          : (mine===null ? 'Round '+r+' of '+(state.rounds||'?')+' — make your choice. '+decided+' of '+nPlayers()+' locked in.'
                         : 'Locked in. '+decided+' of '+nPlayers()+' have decided — waiting for the reveal.');
        else if(ph==='reveal') statusEl.textContent='Round '+r+' results are in — see how the class did.';
        else statusEl.textContent = state.collapsed
          ? 'The commons collapsed — everyone shares the cost of an empty commons.'
          : 'Game over — nice work keeping the commons alive.';
      }
    }

    range.addEventListener('input', function(){ sliderTouched=true; rangeNum.textContent=range.value; });

    if(HOST){
      scenSel.addEventListener('change', function(){
        if(state.phase==='lobby') backend.mergeDoc('polls', id, {scen:scenSel.value});
      });
      startBtn.addEventListener('click', function(){
        const ph=state.phase||'idle';
        const rounds=Math.max(1,Math.min(10,parseInt(roundsIn.value,10)||3));
        if(ph==='idle'||ph==='final'){
          if(ph==='final' && !confirm('Start a new game? This clears the board for everyone.')) return;
          backend.setDoc('polls', id, {v:2, phase:'lobby', scen:scenSel.value, rounds:rounds,
            round:0, health:1, gameId:Date.now(), collapsed:false, players:{}, choices:{}, hist:{}});
        } else if(ph==='lobby'){
          if(nPlayers()===0 && !confirm('No one has joined yet. Start anyway?')) return;
          backend.mergeDoc('polls', id, {phase:'open', round:1, rounds:rounds});
        }
      });
      endRoundBtn.addEventListener('click', function(){
        if(state.phase!=='open') return;
        const r=state.round||0, v=roundVerdict(r);
        if(!v) return;
        const upd={phase: v.collapsed?'final':'reveal', health:v.health, collapsed:v.collapsed, hist:{}};
        upd.hist['r'+r]=v.entry;
        backend.mergeDoc('polls', id, upd);
      });
      nextBtn.addEventListener('click', function(){
        if(state.phase!=='reveal') return;
        const r=state.round||0;
        if(r>=(state.rounds||1)) backend.mergeDoc('polls', id, {phase:'final'});
        else backend.mergeDoc('polls', id, {phase:'open', round:r+1});
      });
      finishBtn.addEventListener('click', function(){
        if((state.phase==='open'||state.phase==='reveal') && confirm('End the game now for everyone?'))
          backend.mergeDoc('polls', id, {phase:'final'});
      });
    } else {
      joinBtn.addEventListener('click', function(){
        if(!(state.phase==='lobby'||state.phase==='open') || joined()) return;
        // store the join timestamp; every screen derives "Student N" from join order
        backend.mergeDocShard('polls', id, {players:{[pk]:Date.now()}});
      });
      submitBtn.addEventListener('click', function(){
        if(state.phase!=='open' || !joined()) return;
        const r=state.round||0;
        if(myChoice(r)!==null) return;
        const amt=Math.max(0, Math.min(S().max, parseInt(range.value,10)||0));
        backend.mergeDocShard('polls', id, {choices:{['r'+r]:{[pk]:amt}}});
      });
    }
    backend.subscribeDoc('polls', id, function(d){
      state=(d && d.v===2) ? d : {phase:'idle'};  // ignore stale v1 docs
      render();
    });

    /* ══ DEMO MODE ═════════════════════════════════════════════════════════
       ?demo drives the whole game from one browser: a class of 24 joins, plays
       four rounds and walks the arc the game is built to produce — everyone
       holds back and the stock grows, a few notice that taking more paid more,
       the take runs past capacity and the round pays nothing, and the class
       finally pulls back onto a resource whose ceiling is now a third of what
       it was. Nothing is faked: the bots' choices go through the same
       roundVerdict() the instructor's button uses.
       ?freeze=N jumps straight to beat N and stops, for cover images.     ══ */
    function cmDemo(){
      const N=24, ROUNDS=4;
      /* deterministic, so the same walkthrough plays every time */
      const pick=(i,avg)=>Math.max(0,Math.min(S().max, Math.round(avg + ((i*13)%7) - 3)));
      const bar=document.createElement('div');
      bar.className='cm-demobar';
      bar.innerHTML='<span class="cm-demotag">Demo</span><span class="cm-demotxt" data-cmdemo></span>'
        +'<button class="cm-demobtn" type="button" data-cmreplay hidden>Replay</button>';
      sec.querySelector('.cm-root').appendChild(bar);
      const txt=bar.querySelector('[data-cmdemo]');
      let step=0, tid=null;
      bar.querySelector('[data-cmreplay]').addEventListener('click', function(){
        this.hidden=true; step=0; play();
      });
      const doc=o=>backend.mergeDoc('polls', id, o);
      function choices(r, avg){
        const c={};
        for(let i=0;i<N;i++) c['b'+i]=pick(i,avg);
        c[pk]=pick(3,avg);              /* the viewer plays too */
        const u={choices:{}}; u.choices['r'+r]=c; doc(u);
      }
      function endRound(r){
        const v=roundVerdict(r); if(!v) return;
        const u={phase: v.collapsed?'final':'reveal', health:v.health, collapsed:v.collapsed, hist:{}};
        u.hist['r'+r]=v.entry; doc(u);
      }
      const AVG=[null,3.4,6.0,9.6,0.0];
      const script=[
        [200, ()=>backend.setDoc('polls', id, {v:2, phase:'lobby', scen:'fishing', rounds:ROUNDS,
              round:0, health:1, gameId:Date.now(), collapsed:false, players:{}, choices:{}, hist:{}}),
         'The instructor picks a scenario and opens the lobby.'],
        [2400, ()=>{ const pl={}; for(let i=0;i<N;i++) pl['b'+i]=Date.now()+i;
              pl[pk]=Date.now()+N; doc({players:pl}); },
         (N+1)+' fishers join the village — you are one of them. Nobody types a name; everyone is Student N by join order.'],
        [2600, ()=>doc({phase:'open', round:1}),
         'Round one. Everyone secretly chooses a harvest; three payoff examples spell out the dilemma.'],
        [2600, ()=>choices(1,AVG[1]),
         'Choices are locked in and stay hidden. Most people take a modest share this first season.'],
        [2400, ()=>endRound(1),
         'Under the sustainable share, so everyone sells at full price and the fish population grows back.'],
        [3400, ()=>doc({phase:'open', round:2}),
         'Round two. The board is public now, and taking more is visibly what paid best.'],
        [2200, ()=>choices(2,AVG[2]),
         'Here the take climbs. Nobody has broken a rule.'],
        [2400, ()=>endRound(2),
         'Over the threshold. Everyone’s payout multiplier falls — including the people who held back.'],
        [3600, ()=>doc({phase:'open', round:3}),
         'Round three. Holding back now costs you and barely helps the stock.'],
        [2200, ()=>choices(3,AVG[3]),
         'In this run, nearly everyone fishes near the maximum.'],
        [2400, ()=>endRound(3),
         'Past capacity. The round pays nothing at all, and the fish population crashes.'],
        [3800, ()=>doc({phase:'open', round:4}),
         'Round four, on a wrecked resource. Capacity is a third of what it was in round one.'],
        [2200, ()=>choices(4,AVG[4]),
         'This class pulls right back. Another might not.'],
        [2400, ()=>endRound(4),
         'Sustainable again — but the ceiling they are living under is the one they broke.'],
        [3200, ()=>doc({phase:'final'}),
         'The closing summary: what the class took each round against the sustainable share, and what that cost.'],
        [5200, ()=>{ const b=bar.querySelector('[data-cmreplay]'); if(b) b.hidden=false; },
         'Nobody cheated. Each choice made sense on its own — which is the trap.']
      ];
      /* A caption has to stay up long enough to READ, and they run from seven to
         twenty-one words while the beats are all about the same length — so
         scaling the whole script never fixed it, it just made the short ones
         idle. Each caption now holds for at least its own reading time at a
         projector-friendly pace, and the scripted delay is the floor under
         that. A caption that differs from the last one only in its numbers is
         the same sentence ticking over, so it does not restart the clock. */
      const PACE=1.15, WPM=190;
      function readMs(t){
        const w=String(t||'').trim().split(/\s+/).length;
        return Math.round(750 + w*(60000/WPM));
      }
      function sameIdea(a,b){
        return String(a).replace(/\d+/g,'#') === String(b).replace(/\d+/g,'#');
      }
      let lastCap='';
      function play(){
        if(step>=script.length) return;
        const s=script[step++];
        const floor = (lastCap && !sameIdea(lastCap, s[2])) ? readMs(lastCap) : 0;
        tid=setTimeout(function(){
          txt.textContent=s[2]; lastCap=s[2];
          try{ s[1](); }catch(e){}
          play();
        }, Math.max(Math.round(s[0]*PACE), floor));
      }
      const FR=CMQ.has('freeze') ? parseInt(CMQ.get('freeze'),10) : -1;
      if(FR>=0){
        bar.hidden=true;
        for(let i=0;i<=Math.min(FR,script.length-1);i++){ try{ script[i][1](); }catch(e){} }
        return;
      }
      txt.textContent='Tragedy of the Commons — one hypothetical class, played out. A real one varies.';
      lastCap=txt.textContent;   /* so the opening line gets read, not flashed */
      play();
    }
    if(CMQ.has('demo') && !HOST) setTimeout(cmDemo, 400);
  });

  // ---- wire each guess-the-number slide ------------------------------------
  // Sharded counts with composite keys "<catIdx>_<value>" in 'polls'. Students
  // slide a 0-100 guess per category + lock in once; the ?host copy renders a
  // live 10-bin histogram per category with n / median / mean.
  guesses.forEach(function(sec){
    const id = sec.dataset.guId;
    const ranges = Array.from(sec.querySelectorAll('.gu-range, .gu-entry'));
    const nums = Array.from(sec.querySelectorAll('.gu-num'));
    const ENTRY = sec.dataset.guEntry==='1';
    const FMT = function(n){
      n = Math.round(n);
      if(n>=1e6){ const s=(n/1e6).toFixed(2).replace(/\.?0+$/,''); return s+'M'; }
      if(n>=1e4) return (n/1e3)+'k';
      return String(n);
    };
    const studentBox = sec.querySelector('[data-gu-student]');
    const hostBox = sec.querySelector('[data-gu-host]');
    const submitBtn = sec.querySelector('[data-gu-submit]');
    const totalEl = sec.querySelector('[data-gu-total]');
    const hintEl = sec.querySelector('[data-gu-hint]');
    const resetBtn = sec.querySelector('[data-gu-reset]');
    const nCats = ranges.length;
    const GMAX = parseInt(sec.dataset.guMax||'100',10) || 100;   // slider ceiling (values stored raw)
    const GBIN = GMAX/10;                                        // histogram bin width
    const BUDGET = parseInt(sec.dataset.guBudget||'',10) || 0;
    const allocEl = sec.querySelector('[data-gu-alloc]');
    const remainEl = sec.querySelector('[data-gu-remain]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });
    // ENTRY mode (typed answers) auto-scales the host axis to the class's data.
    // CEIL caps a single stored answer; the axis rounds up to 2 significant figures.
    const CAP = 1e9;
    const CEIL = ENTRY ? CAP : GMAX;
    const FIXEDMAX = parseInt(sec.dataset.guFixed||'0',10) || 0;   // optional fixed-axis value
    const ANSWERS = (sec.dataset.guAnswers||'').split(',')
      .map(function(s){ return parseInt(s,10); }).filter(function(v){ return !isNaN(v); });
    function niceCeil(x){ if(x<=0) return 0;
      const mag=Math.pow(10, Math.floor(Math.log10(x))-1); return Math.ceil(x/mag)*mag; }
    let revealed=false;      // host reveal state, shared with render()
    let lastCounts={};       // remember last data so a reveal toggle can re-scale
    let scaleMode = localStorage.getItem('gu-scale:'+id);   // 'auto' | 'fixed' (entry + fixed_max)
    if(scaleMode!=='auto' && scaleMode!=='fixed') scaleMode='auto';

    const doneKey='guess-done:'+id;
    let mine=null; try{ mine=JSON.parse(localStorage.getItem(doneKey)); }catch(e){ mine=null; }

    function sumRanges(){ let t=0; ranges.forEach(r=>{ t+=(parseInt(r.value,10)||0); }); return t; }
    function updateBudget(){
      if(!BUDGET) return;
      const t=sumRanges();
      if(allocEl) allocEl.textContent=t;
      if(remainEl) remainEl.textContent=Math.max(0, BUDGET-t);
      if(!mine) submitBtn.disabled = t<=0;   // nothing allocated yet -> nothing to lock in
    }
    const allFilled = () => ranges.every(r => String(r.value).trim()!=='');
    ranges.forEach(function(r,i){
      r.addEventListener('input', function(){
        if(BUDGET){ // this is a distribution: cap so the four sliders never exceed the budget
          let others=0; ranges.forEach(function(o){ if(o!==r) others+=(parseInt(o.value,10)||0); });
          const maxAllowed=Math.max(0, BUDGET-others);
          if((parseInt(r.value,10)||0) > maxAllowed) r.value=maxAllowed;
        }
        if(nums[i]) nums[i].textContent=r.value;
        updateBudget();
        if(ENTRY && !mine) submitBtn.disabled = !allFilled();
      });
    });
    if(ENTRY && !mine) submitBtn.disabled = true;   // type every answer before locking in

    function lockIfDone(){
      if(!mine) return;
      ranges.forEach(function(r,i){ if(mine[i]!==undefined){ r.value=mine[i]; if(nums[i]) nums[i].textContent=mine[i]; } r.disabled=true; });
      submitBtn.disabled=true; submitBtn.textContent='Locked in ✓';
      hintEl.textContent='Your guesses are in — the class distribution is on the instructor’s screen.';
      updateBudget();
    }
    updateBudget();

    function render(counts){
      lastCounts = counts;
      // counts keys are "<cat>_<value>"; a student contributes one key per category
      const perCat=[]; for(let c=0;c<nCats;c++) perCat.push({n:0, sum:0, bins:new Array(10).fill(0), vals:[]});
      Object.keys(counts).forEach(function(k){
        const m=k.match(/^(\d+)_(\d+)$/); if(!m) return;
        const c=parseInt(m[1],10), v=parseInt(m[2],10), cnt=counts[k]||0;
        if(c>=nCats || v>CEIL || cnt<=0) return;
        const cat=perCat[c];
        cat.n+=cnt; cat.sum+=v*cnt; cat.vals.push([v,cnt]);
      });
      totalEl.textContent = perCat[0] ? perCat[0].n : 0;
      if(!HOST) return;
      // AX = axis maximum, BINW = histogram bin width. Fixed at GMAX for sliders;
      // for ENTRY mode it grows/shrinks to fit the largest guess (and, once the
      // instructor releases them, the true answers), rounded up to 2 sig figs.
      let AX=GMAX;
      if(ENTRY){
        if(FIXEDMAX && scaleMode==='fixed'){
          AX = Math.min(CAP, FIXEDMAX);          // host chose a fixed axis
        } else {
          let rawMax=0;
          perCat.forEach(function(cat){ cat.vals.forEach(function(e){ if(e[0]>rawMax) rawMax=e[0]; }); });
          if(revealed) ANSWERS.forEach(function(a){ if(a>rawMax) rawMax=a; });
          AX = rawMax>0 ? Math.min(CAP, niceCeil(rawMax)) : GMAX;
        }
        // update the shared axis tick labels (0 … AX) live
        sec.querySelectorAll('.gu-ticks').forEach(function(t){
          const sp=t.querySelectorAll('span');
          if(sp.length>=5){ sp[0].textContent='0'; sp[1].textContent=FMT(AX/4);
            sp[2].textContent=FMT(AX/2); sp[3].textContent=FMT(AX*3/4); sp[4].textContent=FMT(AX); }
        });
        // reposition the true-answer markers to the current scale
        sec.querySelectorAll('[data-gu-ans]').forEach(function(m){
          const ci=parseInt(m.getAttribute('data-gu-ans'),10);
          if(!isNaN(ci) && ANSWERS[ci]!==undefined) m.style.left=(Math.min(AX,ANSWERS[ci])/AX*100)+'%';
        });
      }
      const BINW = AX/10;
      perCat.forEach(function(cat){ cat.vals.forEach(function(e){ cat.bins[Math.min(9,Math.floor(e[0]/BINW))]+=e[1]; }); });
      perCat.forEach(function(cat,c){
        // stats line appears in both the strip header and the histogram card header
        let statsTxt='no guesses yet';
        if(cat.n){
          cat.vals.sort(function(a,b){return a[0]-b[0];});
          let med=0, seen=0, half=(cat.n+1)/2;
          for(const [v,cnt] of cat.vals){ seen+=cnt; if(seen>=half){ med=v; break; } }
          statsTxt='n='+cat.n+' · median '+FMT(med)+' · mean '+FMT(cat.sum/cat.n);
        }
        sec.querySelectorAll('[data-gu-stats="'+c+'"]').forEach(function(e){ e.textContent=statsTxt; });
        // Expanded view: 10-bin histogram
        const binsEl=sec.querySelector('[data-gu-bins="'+c+'"]');
        if(!binsEl.querySelector('.gu-bin')){ // build the 10 bin columns once
          for(let b=0;b<10;b++){
            const w=document.createElement('div'); w.className='gu-bin';
            w.innerHTML='<div class="gu-bin-col"><div class="gu-bin-fill" style="height:0%"></div></div>'
              +'<div class="gu-bin-lbl"></div>';
            binsEl.appendChild(w);
          }
        }
        const maxBin=Math.max.apply(null, cat.bins.concat([1]));
        Array.from(binsEl.querySelectorAll('.gu-bin-fill')).forEach(function(f,b){
          const h=cat.bins[b]/maxBin*100;
          f.style.height=(cat.bins[b]>0?Math.max(6,h):0)+'%';
          f.parentElement.parentElement.title=FMT(b*BINW)+'–'+(b===9?FMT(AX):FMT((b+1)*BINW-1))+': '+cat.bins[b]+(cat.bins[b]===1?' guess':' guesses');
        });
        // bin labels track the (possibly rescaled) bin width
        Array.from(binsEl.querySelectorAll('.gu-bin-lbl')).forEach(function(l,b){ l.textContent=FMT(b*BINW); });
        // Standard view: dot plot with class-size-adaptive scaling — when any
        // value's stack would exceed the strip, one dot represents k students
        // (k = smallest divisor that fits); a fainter small dot shows a remainder.
        const dotsEl=sec.querySelector('[data-gu-dots="'+c+'"]');
        const meanEl=sec.querySelector('[data-gu-mean="'+c+'"]');
        const scaleEl=sec.querySelector('[data-gu-scale="'+c+'"]');
        const MAXSTACK=7;
        let maxCnt=0; cat.vals.forEach(function(e){ if(e[1]>maxCnt) maxCnt=e[1]; });
        const k=Math.max(1, Math.ceil(maxCnt/MAXSTACK));
        if(scaleEl) scaleEl.textContent = k>1 ? ('⬤ = '+k+' students') : '';
        let dh='';
        cat.vals.forEach(function(e){
          const v=e[0], cnt=e[1];
          const full=Math.floor(cnt/k), rem=cnt%k;
          const title=' title="'+FMT(v)+': '+cnt+(cnt===1?' guess':' guesses')+'"';
          const pct=Math.min(100, v/AX*100);
          for(let i=0;i<full;i++){
            dh+='<span class="gu-dot" style="left:'+pct+'%; bottom:'+(i*9)+'px"'+title+'></span>';
          }
          if(rem>0){ // remainder: a smaller, fainter dot on top of the stack
            dh+='<span class="gu-dot part" style="left:'+pct+'%; bottom:'+(full*9)+'px"'+title+'></span>';
          }
        });
        dotsEl.innerHTML=dh;
        if(cat.n){
          meanEl.hidden=false;
          const mean=cat.sum/cat.n;
          meanEl.style.left=Math.min(100, mean/AX*100)+'%';
          meanEl.querySelector('.gu-mean-lbl').textContent=FMT(mean);
        } else meanEl.hidden=true;
      });
    }

    if(HOST){
      sec.classList.add('host');
      studentBox.hidden=true; hostBox.hidden=false;
      hintEl.textContent='Live distributions — students guess on their own screens.';
      resetBtn.hidden=false;
      resetBtn.addEventListener('click', function(){
        if(confirm('Reset all guesses for this question?')) backend.reset('polls', id);
      });
      // Reveal answers: drop the true-value markers onto every chart (host-local)
      const revealBtn=sec.querySelector('[data-gu-revealbtn]');
      if(sec.dataset.guAnswers){
        revealBtn.hidden=false;
        revealBtn.addEventListener('click', function(){
          revealed=!revealed;
          sec.querySelectorAll('[data-gu-ans]').forEach(function(m){ m.hidden=!revealed; });
          revealBtn.textContent = revealed ? 'Hide answers' : 'Reveal answers';
          revealBtn.classList.toggle('on', revealed);
          render(lastCounts);   // rescale the axis to include/exclude the true values
        });
      }
      // Auto-scale vs Fixed axis — a local host preference (entry + fixed_max only)
      const scaleSel=sec.querySelector('[data-gu-scale]');
      if(scaleSel){
        scaleSel.value=scaleMode;
        scaleSel.addEventListener('change', function(){
          scaleMode=scaleSel.value; localStorage.setItem('gu-scale:'+id, scaleMode);
          render(lastCounts);   // redraw at the chosen axis
        });
      }
      // Standard (dot plot) vs Expanded (histograms) — a local host preference
      const viewSel=sec.querySelector('[data-gu-view]');
      const stripsEl=sec.querySelector('[data-gu-strips]');
      const gridEl=sec.querySelector('[data-gu-grid]');
      let view=localStorage.getItem('gu-view:'+id);
      if(view!=='expanded' && view!=='standard') view='standard';
      function applyView(){ stripsEl.hidden=(view!=='standard'); gridEl.hidden=(view!=='expanded'); viewSel.value=view; }
      viewSel.addEventListener('change', function(){
        view=viewSel.value; localStorage.setItem('gu-view:'+id, view); applyView();
      });
      applyView();
    } else {
      lockIfDone();
      submitBtn.addEventListener('click', function(){
        if(mine) return;
        const vals=ranges.map(function(r){ return Math.max(0, Math.min(CEIL, parseInt(r.value,10)||0)); });
        mine=vals; localStorage.setItem(doneKey, JSON.stringify(vals));
        vals.forEach(function(v,c){ backend.bump('polls', id, c+'_'+v); });
        lockIfDone();
      });
    }
    backend.subscribe('polls', id, render);
  });

  // ---- wire each click-the-map heatmap -------------------------------------
  // Clicks quantized to GX×GY grid; sharded counts key "<gx>_<gy>" in 'polls'.
  const HM_GX=100, HM_GY=50;
  heatmaps.forEach(function(sec){
    const id=sec.dataset.hmId;
    const stage=sec.querySelector('[data-hm-stage]');
    const img=sec.querySelector('.hm-img');
    const heat=sec.querySelector('[data-hm-heat]');
    const pinBox=sec.querySelector('[data-hm-pins]');
    const MAXPINS=Math.max(1, parseInt(sec.dataset.hmMax||'1',10)||1);
    const spots=sec.querySelector('[data-hm-spots]');
    const noteEl=sec.querySelector('[data-hm-note]');
    const totalEl=sec.querySelector('[data-hm-total]');
    const hintEl=sec.querySelector('[data-hm-hint]');
    const submitBtn=sec.querySelector('[data-hm-submit]');
    const resetBtn=sec.querySelector('[data-hm-reset]');
    const revealBtn=sec.querySelector('[data-hm-revealbtn]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    const doneKey='hm-done:'+id;
    const basePrompt=hintEl.textContent;
    let mine=null; try{ mine=JSON.parse(localStorage.getItem(doneKey)); }catch(e){ mine=null; }
    if(mine && !Array.isArray(mine)) mine=[mine]; // migrate old single-pin format

    function render(counts){
      let total=0, maxC=0;
      const cells=[];
      Object.keys(counts).forEach(function(k){
        const m=k.match(/^(\d+)_(\d+)$/); if(!m) return;
        const gx=+m[1], gy=+m[2], cnt=counts[k]||0;
        if(gx>=HM_GX||gy>=HM_GY||cnt<=0) return;
        total+=cnt; if(cnt>maxC) maxC=cnt; cells.push([gx,gy,cnt]);
      });
      totalEl.textContent=total;
      if(!HOST) return;
      let hh='';
      cells.forEach(function(e){
        const gx=e[0], gy=e[1], cnt=e[2];
        const op=Math.min(.95, .42 + (cnt/Math.max(1,maxC))*.53);
        hh+='<div class="hm-blob" style="left:'+((gx+0.5)/HM_GX*100).toFixed(2)+'%; top:'
          +((gy+0.5)/HM_GY*100).toFixed(2)+'%; opacity:'+op.toFixed(2)+'"></div>';
      });
      heat.innerHTML=hh;
    }

    if(HOST){
      sec.classList.add('host');
      hintEl.textContent='Live heat map — students tap on their own screens.';
      resetBtn.hidden=false;
      resetBtn.addEventListener('click', function(){ if(confirm('Reset all responses for this question?')) backend.reset('polls', id); });
      if(revealBtn){
        revealBtn.hidden=false; let shown=false;
        const overlayEl=sec.querySelector('[data-hm-overlay]');
        revealBtn.addEventListener('click', function(){
          shown=!shown; spots.hidden=!shown; if(noteEl) noteEl.hidden=!shown;
          if(overlayEl) overlayEl.hidden=!shown;
          revealBtn.textContent=shown?'Hide answer':'Reveal answer'; revealBtn.classList.toggle('on',shown);
        });
      }
    } else {
      let pins=[]; // {gx,gy} placed, not yet locked
      function renderPins(locked){
        pinBox.classList.toggle('locked', !!locked);
        pinBox.innerHTML='';
        pins.forEach(function(p,i){
          const el=document.createElement('div'); el.className='hm-pin'; el.textContent='📍';
          el.style.left=((p.gx+0.5)/HM_GX*100)+'%'; el.style.top=((p.gy+0.5)/HM_GY*100)+'%';
          if(!locked){ el.title='Tap to remove';
            el.addEventListener('click', function(ev){ ev.stopPropagation(); pins.splice(i,1); renderPins(false); updateHint(); }); }
          pinBox.appendChild(el);
        });
      }
      function updateHint(){
        submitBtn.disabled = pins.length===0;
        if(MAXPINS===1){ hintEl.textContent = pins.length? 'Move it if you like, then lock in your pick.' : basePrompt; return; }
        if(pins.length===0) hintEl.textContent = basePrompt;
        else if(pins.length<MAXPINS) hintEl.textContent = pins.length+' of '+MAXPINS+' placed — add more, tap a pin to remove, or lock in.';
        else hintEl.textContent = 'All '+MAXPINS+' placed — tap a pin to remove one, or lock in.';
      }
      function lockedHint(){
        hintEl.textContent = 'Your pick'+(mine.length>1?'s are':' is')+' in — the class heat map is on the instructor’s screen.';
      }
      if(mine){ pins=mine.slice(); renderPins(true); submitBtn.disabled=true; submitBtn.textContent='Locked in ✓'; lockedHint(); }
      else { updateHint(); }
      stage.addEventListener('click', function(ev){
        if(mine) return;
        const r=img.getBoundingClientRect();
        const nx=(ev.clientX-r.left)/r.width, ny=(ev.clientY-r.top)/r.height;
        if(nx<0||nx>1||ny<0||ny>1) return;
        if(pins.length>=MAXPINS){ updateHint(); return; }
        pins.push({gx:Math.min(HM_GX-1,Math.floor(nx*HM_GX)), gy:Math.min(HM_GY-1,Math.floor(ny*HM_GY))});
        renderPins(false); updateHint();
      });
      submitBtn.addEventListener('click', function(){
        if(mine||pins.length===0) return;
        mine=pins.slice(); localStorage.setItem(doneKey, JSON.stringify(mine));
        renderPins(true); submitBtn.disabled=true; submitBtn.textContent='Locked in ✓'; lockedHint();
        mine.forEach(function(p){ backend.bump('polls', id, p.gx+'_'+p.gy); });
      });
    }
    backend.subscribe('polls', id, render);
  });

  // ---- wire each ranking slide ---------------------------------------------
  // Each student contributes one key per item: "<itemIdx>_<rankPos>" (sharded).
  // Rich mode (data-rk-rich): the host's reveal is a broadcast `released` flag on
  // the main doc, and every screen switches to an animated results board.
  rankings.forEach(function(sec){
    const id=sec.dataset.rkId;
    const list=sec.querySelector('[data-rk-list]');
    const totalEl=sec.querySelector('[data-rk-total]');
    const hintEl=sec.querySelector('[data-rk-hint]');
    const submitBtn=sec.querySelector('[data-rk-submit]');
    const resetBtn=sec.querySelector('[data-rk-reset]');
    const revealBtn=sec.querySelector('[data-rk-revealbtn]');
    const replayBtn=sec.querySelector('[data-rk-replay]');
    const noteEl=sec.querySelector('[data-rk-note]');
    const resEl=sec.querySelector('[data-rk-res]');
    let items=Array.from(list.querySelectorAll('.rk-item'));
    const N=items.length;
    const labels=items.map(it=>it.querySelector('.rk-name').textContent);
    const answer = sec.dataset.rkAnswer ? JSON.parse(sec.dataset.rkAnswer) : null;
    const values = sec.dataset.rkValues ? JSON.parse(sec.dataset.rkValues) : null;
    const rich = (sec.dataset.rkRich && answer) ? JSON.parse(sec.dataset.rkRich) : null;
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });
    const WAIT_HOST='Your ranking is in. The class consensus is on the instructor’s screen.';
    const WAIT_RICH='Your ranking is in. The real answer appears when your instructor reveals it.';

    function relabelRanks(){
      Array.from(list.querySelectorAll('.rk-item')).forEach(function(it,p){
        it.querySelector('[data-rk-rank]').textContent=p+1;
        it.querySelector('[data-rk-up]').disabled=(p===0);
        it.querySelector('[data-rk-down]').disabled=(p===N-1);
      });
    }
    function move(it,dir){
      if(dir<0 && it.previousElementSibling) list.insertBefore(it, it.previousElementSibling);
      else if(dir>0 && it.nextElementSibling) list.insertBefore(it.nextElementSibling, it);
      relabelRanks();
    }

    const doneKey='rk-done:'+id, mineKey='rk-mine:'+id;
    let done=false, mine=null;
    try{ done = localStorage.getItem(doneKey)==='1'; }catch(e){}
    try{ const m=JSON.parse(localStorage.getItem(mineKey)||'null'); if(Array.isArray(m)&&m.length===N) mine=m; }catch(e){}

    // per-item tallies: at[i][p] = students who put item i at place p (1-based)
    function tally(counts){
      const at=[]; for(let i=0;i<N;i++) at.push(new Array(N+1).fill(0));
      const sum=new Array(N).fill(0), cnt=new Array(N).fill(0);
      Object.keys(counts||{}).forEach(function(k){
        const m=k.match(/^(\d+)_(\d+)$/); if(!m) return;
        const i=+m[1], p=+m[2], c=counts[k]||0;
        if(i>=N||p<1||p>N||c<=0) return;
        at[i][p]+=c; sum[i]+=p*c; cnt[i]+=c;
      });
      const avg=sum.map((s,i)=>cnt[i]? s/cnt[i] : null);
      const order=[]; for(let i=0;i<N;i++) order.push({i:i, avg: avg[i]===null? 999 : avg[i]});
      order.sort((a,b)=> a.avg-b.avg || a.i-b.i);
      const cons=new Array(N); order.forEach((o,p)=>cons[o.i]=p+1);
      return {at:at, avg:avg, cnt:cnt, n: cnt.length? Math.max.apply(null,cnt) : 0, order:order, cons:cons};
    }

    function render(counts){
      const t=tally(counts);
      totalEl.textContent=t.n;
      if(!HOST) return;
      const byIdx={}; Array.from(list.querySelectorAll('.rk-item')).forEach(it=>byIdx[it.dataset.idx]=it);
      t.order.forEach(function(o){
        const it=byIdx[o.i]; list.appendChild(it);
        let avgEl=it.querySelector('.rk-avg');
        if(!avgEl){ avgEl=document.createElement('span'); avgEl.className='rk-avg';
          it.insertBefore(avgEl, it.querySelector('.rk-val')); }
        avgEl.textContent = t.cnt[o.i] ? ('avg '+ t.avg[o.i].toFixed(1)) : '·';
      });
      relabelRanks();
    }

    // ── rich results board ──────────────────────────────────────────────
    const trueRank=new Array(N); if(answer) answer.forEach((idx,p)=>trueRank[idx]=p+1);
    let unit = rich ? rich.units[0].key : null;
    const escH = s=>String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const fmtN = (v,r)=>{ const x=Math.round(v/r)*r; return x.toLocaleString('en-US',{maximumFractionDigits: r<1? String(r).split('.')[1].length : 0}); };
    function unitOf(){ return rich.units.find(u=>u.key===unit) || rich.units[0]; }
    function shown(i){ const u=unitOf(); return fmtN(rich.amt[i]*u.factor, u.round); }
    const pct = x=> Math.round(x*100)+'%';
    const placeWord = p=> '#'+p;
    let timers=[];
    function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

    function calloutsHtml(t){
      if(!t.n) return '';
      // biggest surprise: the item whose average place is farthest from the truth
      let sI=0, sD=-1;
      for(let i=0;i<N;i++){ if(t.avg[i]===null) continue; const d=Math.abs(t.avg[i]-trueRank[i]); if(d>sD){ sD=d; sI=i; } }
      // best read: the highest share placed exactly right
      let bI=0, bS=-1;
      for(let i=0;i<N;i++){ const s=t.cnt[i]? t.at[i][trueRank[i]]/t.cnt[i] : 0; if(s>bS){ bS=s; bI=i; } }
      let exact=0, near=0;
      for(let i=0;i<N;i++){ const r=trueRank[i]; exact+=t.at[i][r]; near+=t.at[i][r]+(r>1?t.at[i][r-1]:0)+(r<N?t.at[i][r+1]:0); }
      exact/=t.n; near/=t.n;
      const sAvg=t.avg[sI], dir = sAvg>trueRank[sI] ? 'lower' : 'higher';
      const c1 = sD<0.75
        ? '<b>No big surprises.</b> The class put every item within one place of the truth, on average.'
        : '<b>'+escH(labels[sI])+'</b>: the class put it at about #'+sAvg.toFixed(1)+' on average, far '+dir+' than its real place, #'+trueRank[sI]+'.';
      const c2 = '<b>'+pct(bS)+'</b> of the class put <b>'+escH(labels[bI])+'</b> at #'+trueRank[bI]+', exactly right.';
      const c3 = 'A typical student put <b>'+exact.toFixed(1)+' of '+N+'</b> in exactly the right place, and <b>'+near.toFixed(1)+'</b> within one place.';
      return '<div class="rk-calls">'
        +'<div class="rk-call surprise"><div class="rk-call-h">Biggest surprise</div><div>'+c1+'</div></div>'
        +'<div class="rk-call good"><div class="rk-call-h">What the class got right</div><div>'+c2+'</div></div>'
        +'<div class="rk-call score"><div class="rk-call-h">Class score</div><div>'+c3+'</div></div></div>';
    }

    function boardHtml(t){
      const u=unitOf(), maxA=Math.max.apply(null, rich.amt);
      const haveClass=t.n>0, youCol=(!HOST && mine);
      let myExact=0;
      if(youCol) mine.forEach((idx,p)=>{ if(trueRank[idx]===p+1) myExact++; });
      let h='<div class="rk-res-top">';
      if(youCol) h+='<div class="rk-you-head">You put <b>'+myExact+' of '+N+'</b> in exactly the right place.</div>';
      else h+='<div class="rk-res-kicker">The real ranking'+(haveClass?' and how the class did':'')+'</div>';
      if(rich.units.length>1){
        h+='<div class="rk-units" role="group" aria-label="Units">'+rich.units.map(x=>
          '<button type="button" data-rk-unit="'+escH(x.key)+'"'+(x.key===unit?' class="on"':'')+'>'+escH(x.label)+'</button>').join('')+'</div>';
      }
      h+='</div>';
      if(rich.gnames.length){
        h+='<div class="rk-legend">'+rich.gnames.map((g,k)=>'<span><i class="g'+k+'"></i>'+escH(g)+'</span>').join('')+'</div>';
      }
      h+='<div class="rk-grid'+(haveClass?'':' noclass')+(youCol?' you':'')+'">';
      h+='<div class="rk-gh">Real</div><div class="rk-gh">'+escH(u.head)+'</div>';
      if(youCol) h+='<div class="rk-gh c">You</div>';
      if(haveClass) h+='<div class="rk-gh c">Class put it</div><div class="rk-gh">Exactly right <span class="rk-gh-sub">how the class spread it, #1 to #'+N+'</span></div>';
      answer.forEach(function(idx,p){
        const r=p+1, d=((N-r)*0.62 + (r===1?0.9:0)).toFixed(2);
        const w=Math.max(1.5, rich.amt[idx]/maxA*100).toFixed(1);
        const g=rich.grp[idx], tag=rich.tags[idx];
        h+='<div class="rk-r rk-rn" style="--d:'+d+'s"><span>'+r+'</span></div>';
        h+='<div class="rk-r rk-rb" style="--d:'+d+'s"><div class="rk-rname">'+escH(labels[idx])+(tag?' <small>('+escH(tag)+')</small>':'')+'</div>'
          +'<div class="rk-bar"><i class="g'+(g<0?'x':g)+'" style="--w:'+w+'%"></i><b data-rk-num="'+idx+'">'+shown(idx)+'</b><em>'+escH(u.suffix)+'</em></div></div>';
        if(youCol){
          const yp=mine.indexOf(idx)+1, off=Math.abs(yp-r);
          h+='<div class="rk-r rk-rc '+(off===0?'ok':off<=2?'near':'far')+'" style="--d:'+d+'s"><span>#'+yp+'</span>'
            +'<small>'+(off===0?'✓ right':(yp>r?'▼ '+off+' too low':'▲ '+off+' too high'))+'</small></div>';
        }
        if(haveClass){
          const cp=t.cons[idx], off=Math.abs(cp-r);
          h+='<div class="rk-r rk-rc '+(off===0?'ok':off<=2?'near':'far')+'" style="--d:'+d+'s"><span>#'+cp+'</span>'
            +'<small>'+(off===0?'✓ right':(cp>r?'▼ '+off+' too low':'▲ '+off+' too high'))+'</small></div>';
          const n=t.cnt[idx]||0, ex=n? t.at[idx][r]/n : 0;
          let strip='';
          for(let q=1;q<=N;q++){
            const sh=n? t.at[idx][q]/n : 0;
            strip+='<span class="'+(q===r?'hit':'')+'" style="--a:'+Math.min(1, 0.08+sh*1.6).toFixed(2)+'" title="'+pct(sh)+' put it #'+q+'"></span>';
          }
          h+='<div class="rk-r rk-rx" style="--d:'+d+'s"><b>'+pct(ex)+'</b><div class="rk-strip">'+strip+'</div></div>';
        }
      });
      h+='</div>';
      h+='<div class="rk-r rk-callwrap" style="--d:'+((N-1)*0.62+1.6).toFixed(2)+'s">'+calloutsHtml(t)+'</div>';
      return h;
    }

    function countUp(){
      // tick each bar's number up from zero in step with its row's entrance
      const u=unitOf();
      resEl.querySelectorAll('[data-rk-num]').forEach(function(el){
        const idx=+el.dataset.rkNum, target=rich.amt[idx]*u.factor;
        const delay=parseFloat(getComputedStyle(el.closest('.rk-r')).getPropertyValue('--d'))*1000||0;
        el.textContent=fmtN(0,u.round);
        timers.push(setTimeout(function(){
          const t0=performance.now(), dur=900;
          (function step(now){
            const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
            el.textContent=fmtN(target*e, u.round);
            if(k<1) requestAnimationFrame(step); else el.textContent=fmtN(target,u.round);
          })(t0);
        }, delay+120));
      });
    }

    let revealed=false, lastT=null;
    function showBoard(animate){
      clearTimers();
      resEl.innerHTML=boardHtml(lastT||tally({}));
      resEl.classList.toggle('anim', !!animate);
      if(animate) countUp();
      resEl.querySelectorAll('[data-rk-unit]').forEach(b=>b.addEventListener('click', function(){
        unit=b.dataset.rkUnit; showBoard(false);
      }));
    }
    function setRevealed(on, animate){
      revealed=on;
      sec.classList.toggle('rk-revealed', on);
      list.hidden=on; resEl.hidden=!on;
      if(noteEl) noteEl.hidden=!on;
      if(on) showBoard(animate); else { clearTimers(); resEl.innerHTML=''; }
      if(HOST){
        revealBtn.textContent=on?'Hide answer':'Reveal answer'; revealBtn.classList.toggle('on',on);
        if(replayBtn) replayBtn.hidden=!on;
        hintEl.textContent = on ? 'The answer is on every screen.' : 'Live consensus ranking. Students order on their own screens.';
      } else {
        submitBtn.hidden=on;
        if(on) hintEl.textContent = mine ? 'Your placements are in the “You” column.' : (done ? 'Here is the real ranking.' : 'Here is the real ranking.');
        else hintEl.textContent = done ? WAIT_RICH : sec.dataset.rkPrompt;
      }
    }

    if(HOST){
      sec.classList.add('host');
      hintEl.textContent='Live consensus ranking. Students order on their own screens.';
      resetBtn.hidden=false;
      resetBtn.addEventListener('click', function(){
        if(!confirm('Reset all rankings for this question?')) return;
        if(rich) backend.setDoc('polls', id, {counts:{}, released:false}); else backend.reset('polls', id);
      });
      if(revealBtn && answer){
        revealBtn.hidden=false;
        if(rich){
          revealBtn.addEventListener('click', ()=> backend.mergeDoc('polls', id, {released:!revealed}));
          if(replayBtn) replayBtn.addEventListener('click', ()=> showBoard(true));
        } else {
          let shownA=false;
          revealBtn.addEventListener('click', function(){
            shownA=!shownA;
            revealBtn.textContent=shownA?'Hide answer':'Reveal answer'; revealBtn.classList.toggle('on',shownA);
            const byIdx={}; Array.from(list.querySelectorAll('.rk-item')).forEach(it=>byIdx[it.dataset.idx]=it);
            if(shownA){
              answer.forEach(function(idx){ const it=byIdx[idx]; list.appendChild(it); it.classList.add('correct');
                const v=it.querySelector('[data-rk-val]');
                if(values && values[idx]){ v.textContent=values[idx]; v.hidden=false; } });
              relabelRanks();
              if(noteEl) noteEl.hidden=false;
            } else {
              Array.from(list.querySelectorAll('.rk-item')).forEach(function(it){ it.classList.remove('correct');
                const v=it.querySelector('[data-rk-val]'); v.hidden=true; });
              render(lastCounts); if(noteEl) noteEl.hidden=true;
            }
          });
        }
      }
    } else {
      sec.dataset.rkPrompt=hintEl.textContent;
      items.forEach(function(it){
        it.querySelector('[data-rk-up]').addEventListener('click', function(){ if(!done && !revealed) move(it,-1); });
        it.querySelector('[data-rk-down]').addEventListener('click', function(){ if(!done && !revealed) move(it,1); });
      });
      if(mine){ const byIdx={}; items.forEach(it=>byIdx[it.dataset.idx]=it); mine.forEach(i=>{ if(byIdx[i]) list.appendChild(byIdx[i]); }); }
      if(done){ list.classList.add('locked'); submitBtn.disabled=true; submitBtn.textContent='Locked in ✓';
        hintEl.textContent= rich ? WAIT_RICH : WAIT_HOST; }
      submitBtn.addEventListener('click', function(){
        if(done || revealed) return;
        const ord=Array.from(list.querySelectorAll('.rk-item')).map(it=>+it.dataset.idx);
        ord.forEach(function(idx,p){ backend.bump('polls', id, idx+'_'+(p+1)); });
        done=true; mine=ord;
        try{ localStorage.setItem(doneKey,'1'); localStorage.setItem(mineKey, JSON.stringify(ord)); }catch(e){}
        list.classList.add('locked');
        submitBtn.disabled=true; submitBtn.textContent='Locked in ✓';
        hintEl.textContent= rich ? WAIT_RICH : WAIT_HOST;
      });
    }
    let lastCounts={};
    relabelRanks();
    if(rich){
      backend.subscribeDoc('polls', id, function(d){
        d=d||{}; lastCounts=d.counts||{}; lastT=tally(lastCounts);
        render(lastCounts);
        const rel=!!d.released;
        if(rel && !revealed) setRevealed(true, true);
        else if(!rel && revealed) setRevealed(false);
        else if(rel && revealed && !resEl.classList.contains('anim')) showBoard(false);
      });
    } else {
      backend.subscribe('polls', id, function(counts){ lastCounts=counts; render(counts); });
    }
  });

  // ---- wire each opinion-spectrum slide ------------------------------------
  // Sharded counts key "v_<0..100>" + a broadcast `released` flag in 'polls'.
  // Students drag one slider + lock in; on release every copy shows a dot plot
  // of the class with a diamond at the mean.
  spectrums.forEach(function(sec){
    const id = sec.dataset.spId;
    const leftLbl = sec.dataset.spLeft||'Agree', rightLbl = sec.dataset.spRight||'Disagree';
    const range = sec.querySelector('[data-sp-range]');
    const choice = sec.querySelector('[data-sp-choice]');
    const studentBox = sec.querySelector('[data-sp-student]');
    const resultBox = sec.querySelector('[data-sp-result]');
    const submitBtn = sec.querySelector('[data-sp-submit]');
    const dotsEl = sec.querySelector('[data-sp-dots]');
    const meanEl = sec.querySelector('[data-sp-mean]');
    const statsEl = sec.querySelector('[data-sp-stats]');
    const totalEl = sec.querySelector('[data-sp-total]');
    const hintEl = sec.querySelector('[data-sp-hint]');
    const revealBtn = sec.querySelector('[data-sp-reveal]');
    const resetBtn = sec.querySelector('[data-sp-reset]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    // word for a slider position (0 = fully left/agree … 100 = fully right/disagree)
    function wordFor(v){
      if(v<=12) return 'Strongly ' + leftLbl.toLowerCase();
      if(v<40) return leftLbl;
      if(v<=60) return 'Neutral';
      if(v<88) return rightLbl;
      return 'Strongly ' + rightLbl.toLowerCase();
    }
    function paintChoice(){
      const v=parseInt(range.value,10)||0;
      choice.textContent=wordFor(v);
      choice.style.left=v+'%';
    }

    const doneKey='spectrum-done:'+id;
    let mine=null; try{ const v=localStorage.getItem(doneKey); mine=(v===null||v==='')?null:parseInt(v,10); }catch(e){ mine=null; }
    let state={counts:{},released:false};

    function aggregate(counts){
      let n=0, sum=0; const vals=[];
      Object.keys(counts).forEach(function(k){
        const m=k.match(/^v_(\d+)$/); if(!m) return;
        const v=parseInt(m[1],10), c=counts[k]||0; if(v<0||v>100||c<=0) return;
        n+=c; sum+=v*c; vals.push([v,c]);
      });
      return {n:n, sum:sum, vals:vals};
    }
    function renderDist(agg){
      const MAXSTACK=7; let maxCnt=0; agg.vals.forEach(function(e){ if(e[1]>maxCnt) maxCnt=e[1]; });
      const k=Math.max(1, Math.ceil(maxCnt/MAXSTACK));
      let dh='';
      agg.vals.forEach(function(e){
        const v=e[0], cnt=e[1], full=Math.floor(cnt/k), rem=cnt%k;
        const title=' title="'+cnt+' response'+(cnt===1?'':'s')+'"';
        for(let i=0;i<full;i++) dh+='<span class="sp-dot" style="left:'+v+'%; bottom:'+(i*11)+'px"'+title+'></span>';
        if(rem>0) dh+='<span class="sp-dot part" style="left:'+v+'%; bottom:'+(full*11)+'px"'+title+'></span>';
      });
      dotsEl.innerHTML=dh;
      if(agg.n){
        const mean=agg.sum/agg.n; meanEl.hidden=false; meanEl.style.left=mean+'%';
        agg.vals.sort(function(a,b){return a[0]-b[0];});
        let med=0, seen=0, half=(agg.n+1)/2;
        for(const pair of agg.vals){ seen+=pair[1]; if(seen>=half){ med=pair[0]; break; } }
        statsEl.textContent='n='+agg.n+' · class leans '+wordFor(Math.round(mean)).toLowerCase()+' (median '+wordFor(med).toLowerCase()+')';
      } else { meanEl.hidden=true; statsEl.textContent='No responses yet.'; }
    }
    function render(){
      const agg=aggregate(state.counts||{});
      const released=!!state.released;
      totalEl.textContent=agg.n;
      resultBox.hidden=!released;
      if(released) renderDist(agg);
      if(HOST){
        studentBox.hidden=true;
        revealBtn.hidden=false; resetBtn.hidden=false;
        revealBtn.textContent = released ? 'Hide results' : 'Reveal results';
        hintEl.textContent = released ? 'Results are on every screen.'
          : (agg.n+' response'+(agg.n===1?'':'s')+' in — reveal when the class is ready.');
      } else {
        studentBox.hidden=released;
        if(released) hintEl.textContent='The results are in!';
        else if(mine!==null) hintEl.textContent='Your response is locked in. Results appear when your instructor reveals them…';
        else hintEl.textContent='Drag the slider, then lock in your response.';
      }
    }

    function lockIfDone(){
      if(mine===null) return;
      range.value=mine; paintChoice(); range.disabled=true;
      submitBtn.disabled=true; submitBtn.textContent='Locked in ✓';
    }
    paintChoice();

    if(HOST){
      sec.classList.add('host');
      revealBtn.addEventListener('click', ()=> backend.mergeDoc('polls', id, {released:!state.released}));
      resetBtn.addEventListener('click', ()=>{ if(confirm('Reset all responses for this question?')) backend.setDoc('polls', id, {counts:{}, released:false}); });
    } else {
      range.addEventListener('input', paintChoice);

      submitBtn.addEventListener('click', function(){
        if(mine!==null) return;

        mine=v; localStorage.setItem(doneKey, String(v));
        lockIfDone(); backend.bump('polls', id, 'v_'+v);

  // ---- wire each nested guess-a-number poll (guess_embed) ------------------
  // Sharded counts key "g_<value × 10^dec>" plus broadcast `opened`/`released`
  // flags in 'polls'. TWO instructor gates: the whole block is hidden on every
  // screen until the host opens the poll, and the distribution stays hidden
  // until the host releases it. The host copy never shows the input.
  guessembeds.forEach(function(root){
    const id = root.dataset.guessId;
    const unit = root.dataset.geUnit || '';
    const dec = parseInt(root.dataset.geDec||'1', 10);
    const scale = Math.pow(10, dec);
    const MAXV = parseFloat(root.dataset.geMax||'100');
    const launch = root.querySelector('[data-ge-launch]');
    const body = root.querySelector('[data-ge-body]');
    const form = root.querySelector('[data-ge-form]');
    const input = root.querySelector('[data-ge-input]');
