<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2056: self-running demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15201b; --forest:#1A3C34; --forest-mid:#2D6A4F; --green:#40916C;
  --green-light:#74C69D; --pale:#F0F7F4; --line:#dde7e2; --muted:#5b6b63;
  --gold:#B8860B; --amber:#C9722B; --paper:#ffffff;
  --shadow:0 10px 30px rgba(20,40,30,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* Master type scale. Everything in this stylesheet is sized in rem, so this one
   number makes the whole deck bigger or smaller together. It is set above 100%
   so the text carries to the back of a lecture hall; a deck that runs out of
   room on a dense slide can dial it back with `html{font-size:…}` in its own
   EXTRA_CSS. */
html{font-size:112%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--ink); background:#0c1411; overflow:hidden;
}
.deck{position:fixed; inset:0;}
.slide{
  position:absolute; inset:0; opacity:0; visibility:hidden;
  display:flex; flex-direction:column; justify-content:center;
  background:var(--paper); transition:opacity .35s ease;
}
.slide.active{opacity:1; visibility:visible; z-index:2;}
.slide-inner{
  width:100%; max-width:1440px; margin:0 auto;
  padding:clamp(1.1rem,2.8vh,2.2rem) clamp(1.4rem,3vw,2.6rem);
}
.slide-inner.two-col{display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(1.5rem,3.5vw,3.5rem); align-items:center;}
.slide-inner.one-col,.slide-inner.col{display:flex; flex-direction:column; justify-content:center;}

/* typography */
h1,h2,h3,.heading{font-family:'Merriweather',Georgia,serif;}
.eyebrow{font-size:clamp(.72rem,1.35vw,.92rem); font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--accent,var(--green)); margin-bottom:.7rem;}
.eyebrow::before{content:""; display:inline-block; width:.6em; height:.6em; border-radius:2px;
  background:var(--accent,var(--green)); margin-right:.5em; transform:translateY(.02em);}
.eyebrow.light{color:var(--green-light);}
.eyebrow.light::before{display:none;}
.heading{font-size:clamp(1.5rem,3.4vw,2.5rem); line-height:1.12; color:var(--forest); font-weight:800; margin-bottom:1rem;}
.lead{font-size:clamp(.95rem,1.55vw,1.12rem); line-height:1.5; color:#33453d; margin-bottom:1.1rem; max-width:60ch;}
.lead.center{text-align:center; margin:0 auto 1.6rem;}
.bullets{list-style:none; display:flex; flex-direction:column; gap:.7rem;}
.bullets li{position:relative; padding-left:1.5rem; font-size:clamp(.9rem,1.5vw,1.06rem); line-height:1.45; color:#2c3a34;}
.bullets li::before{content:""; position:absolute; left:0; top:.5em; width:.5rem; height:.5rem;
  border-radius:50%; background:var(--accent,var(--green-light));}
.bullets li strong{color:var(--forest);}
/* works-cited small print (content_slide refs=): sits under the content, set
   small and muted with a hairline rule and a hanging indent, so a real citation
   can appear on the slide without competing with the teaching text */
.refs{margin-top:.9rem; padding-top:.5rem; border-top:1px solid var(--line);}
/* a cited slide carries an extra block, so tighten its rhythm to keep the
   citation above the fold on a 16:9 projector */
.slide.has-refs .bullets{gap:.5rem;}
.slide.has-refs .lead{margin-bottom:.8rem;}
.slide.has-refs .heading{margin-bottom:.75rem;}
.refs p{font-size:clamp(.6rem,.92vw,.72rem); line-height:1.4; color:var(--muted);
  padding-left:1.15em; text-indent:-1.15em; margin-top:.3rem;}
.refs p:first-child{margin-top:0;}
.refs em{font-style:italic;}
/* sub-bullet (authored as "- text"): indented under its parent, a shade smaller,
   hollow marker so the hierarchy reads at projector distance */
.bullets li.sub{padding-left:3rem; font-size:clamp(.82rem,1.32vw,.95rem); color:#48594f;
  margin-top:-.25rem;}
.bullets li.sub::before{left:1.55rem; top:.55em; width:.42rem; height:.42rem;
  background:transparent; border:2px solid var(--accent,var(--green-light));}
/* staged reveal (content_slide staged=True): fade each item in on a clicker
   press. Opacity, not display, so the space is reserved up front and nothing
   reflows as items appear. */
.stage-item{opacity:0; transition:opacity .3s ease;}
.stage-item.shown{opacity:1;}
@media (prefers-reduced-motion:reduce){ .stage-item{transition:none;} }
.note{margin-top:.85rem; padding:.62rem .95rem; background:var(--pale); border-left:3px solid var(--green);
  border-radius:0 8px 8px 0; font-size:clamp(.8rem,1.25vw,.92rem); color:#3a4a43; font-style:italic;}
.col-media{height:100%; display:flex; align-items:center;}
.col-media img{width:100%; height:auto; max-height:74vh; object-fit:cover; border-radius:16px; box-shadow:var(--shadow);}

/* pairs */
.pairs{display:flex; flex-direction:column; gap:.5rem;}
.pair{background:var(--pale); border:1px solid var(--line); border-radius:12px; padding:.62rem .95rem;}
.pair-head{font-weight:700; color:var(--forest); font-size:clamp(.86rem,1.4vw,1rem);}
.pair-desc{font-size:clamp(.8rem,1.3vw,.95rem); color:#3a4a43; line-height:1.4; margin-top:.15rem;}

/* grids */
.grid{display:grid; gap:clamp(.8rem,1.6vw,1.3rem); width:100%;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.gcard{background:var(--paper); border:1px solid var(--line); border-top:4px solid var(--accent,var(--green));
  border-radius:14px; padding:clamp(.9rem,1.8vw,1.4rem); box-shadow:0 4px 14px rgba(20,40,30,.06);}
.gcard-head{font-family:'Merriweather',serif; font-weight:700; color:var(--forest);
  font-size:clamp(.95rem,1.5vw,1.12rem); margin-bottom:.45rem;}
.gcard-desc{font-size:clamp(.82rem,1.3vw,.96rem); line-height:1.45; color:#3a4a43;}
.gcard.img img{width:100%; height:clamp(110px,16vh,170px); object-fit:cover; border-radius:10px; margin-bottom:.7rem;}

/* outline & objectives */
.outline-grid{display:grid; grid-template-columns:1fr 1fr; gap:.7rem 2.2rem; margin-top:1rem;}
.ol-item{display:flex; align-items:center; gap:1rem; padding:.7rem .4rem; border-bottom:1px solid var(--line);}
.ol-num{font-family:'Merriweather',serif; font-weight:800; color:var(--accent,var(--green)); font-size:clamp(1.1rem,2vw,1.5rem); min-width:2.4rem;}
.ol-text{font-size:clamp(.92rem,1.5vw,1.1rem); color:var(--forest); font-weight:600;}
.obj-grid{display:grid; grid-template-columns:1fr 1fr; gap:1rem 2rem; margin-top:1.2rem;}
.obj-item{display:flex; gap:1rem; align-items:flex-start;}
.obj-num{flex:none; width:2.4rem; height:2.4rem; border-radius:50%; background:var(--forest-mid); color:#fff;
  font-family:'Merriweather',serif; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:1.1rem;}
.obj-text{font-size:clamp(.9rem,1.45vw,1.05rem); line-height:1.4; color:#2c3a34; padding-top:.35rem;}

/* quote */
.bigquote{font-family:'Merriweather',serif; font-size:clamp(1.4rem,3vw,2.2rem); line-height:1.25;
  color:var(--forest); font-style:italic; margin-bottom:1.2rem;}
.bigquote cite{display:block; font-size:clamp(.9rem,1.4vw,1.05rem); font-style:normal; color:var(--green);
  font-family:'Inter',sans-serif; font-weight:600; margin-top:.6rem;}

/* footer */
.footer{position:absolute; bottom:1rem; right:1.6rem; font-size:.72rem; color:#9bb0a6;}
.footer.light{color:rgba(255,255,255,.7);}

/* title slides */
.title-slide{justify-content:flex-end;}
img.bleed{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.title-slide img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.title-scrim{position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(10,25,18,.86) 0%, rgba(10,25,18,.55) 50%, rgba(10,25,18,.2) 100%);}
.title-content{position:relative; z-index:2; padding:0 clamp(2.5rem,7vw,6rem) clamp(3rem,9vh,6rem); color:#fff; max-width:60rem;}
.chapter-kicker{font-size:clamp(.9rem,1.6vw,1.1rem); font-weight:700; letter-spacing:.22em; text-transform:uppercase;
  color:var(--green-light); margin-bottom:.6rem;}
.mega{font-size:clamp(4rem,13vw,9rem); line-height:.95; font-weight:900; letter-spacing:-.01em;}
.title-sub{font-family:'Merriweather',serif; font-size:clamp(1.3rem,3.2vw,2.4rem); font-weight:400; margin-top:.4rem; color:#eaf5ef;}
.title-tag{margin-top:1.6rem; font-style:italic; font-size:clamp(1rem,1.9vw,1.4rem); color:var(--green-light);
  border-left:3px solid var(--green-light); padding-left:1rem;}

/* sim slides */
.slide.sim{background:#0e1a15; padding:0;}
.sim-bar{display:flex; align-items:center; justify-content:space-between; gap:1.5rem;
  padding:.9rem clamp(1.2rem,3vw,2.2rem); background:linear-gradient(120deg,#143027,#1d4438); color:#fff;}
.sim-bar-text .eyebrow{margin-bottom:.2rem;}
.sim-title{font-size:clamp(1.15rem,2.4vw,1.8rem); color:#fff; font-weight:800; line-height:1;}
.sim-q{font-size:clamp(.78rem,1.3vw,.95rem); color:#bfe3d3; margin-top:.35rem;}
.sim-open{flex:none; background:var(--green-light); color:#0e1a15; font-weight:700; text-decoration:none;
  padding:.6rem 1.1rem; border-radius:10px; font-size:.85rem; white-space:nowrap; transition:background .15s;}
.sim-open:hover{background:#9fe0c0;}
.sim-note{background:#3a2c12; color:#ffe6b8; font-size:.82rem; padding:.5rem clamp(1.2rem,3vw,2.2rem); line-height:1.4;}
.sim-frame-wrap{flex:1; min-height:0; background:#fff;}
.sim-frame{width:100%; height:100%; border:0; display:block; background:#fff;}

/* embed slides (interactive chart / app under a slim light header) */
.slide.embed{background:#fff; padding:0;}
.embed-head{display:flex; align-items:flex-end; justify-content:space-between; gap:1.5rem;
  padding:.85rem clamp(1.3rem,3vw,2.4rem) .8rem; border-bottom:1px solid var(--line); background:#fff;}
.embed-head .eyebrow{margin-bottom:.25rem;}
.embed-title{font-size:clamp(1.1rem,2.4vw,1.7rem); color:var(--forest); font-weight:800; line-height:1.05;}
.embed-sub{font-size:clamp(.72rem,1.2vw,.86rem); color:var(--muted); margin-top:.3rem; max-width:80ch;}
.embed-open{flex:none; align-self:center; background:var(--accent,var(--green)); color:#fff; font-weight:700;
  text-decoration:none; padding:.5rem 1rem; border-radius:9px; font-size:.82rem; white-space:nowrap;
  transition:filter .15s;}
.embed-open:hover{filter:brightness(1.08);}
.embed-wrap{flex:1; min-height:0; background:#fff;}
.embed-frame{width:100%; height:100%; border:0; display:block; background:#fff;}

/* nav chrome */
.nav-btn{position:fixed; top:50%; transform:translateY(-50%); z-index:30;
  width:clamp(40px,5vw,56px); height:clamp(40px,5vw,56px); border-radius:50%;
  border:none; background:rgba(20,40,30,.32); color:#fff; font-size:1.4rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background .15s; backdrop-filter:blur(4px);}
.nav-btn:hover{background:rgba(20,40,30,.6);}
.nav-btn.prev{left:14px;} .nav-btn.next{right:14px;}
.topbar{position:fixed; top:0; left:0; right:0; height:4px; background:rgba(255,255,255,.12); z-index:40;}
.progress{height:100%; background:var(--green-light); width:0; transition:width .3s;}
.hud{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40;
  display:flex; align-items:center; gap:.5rem; background:rgba(14,26,21,.72); backdrop-filter:blur(6px);
  padding:.4rem .55rem; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.25);}
.hud button{background:none; border:none; color:#dbeee5; cursor:pointer; font-size:.95rem; padding:.3rem .55rem; border-radius:8px; line-height:1;}
.hud button:hover{background:rgba(255,255,255,.12);}
.hud .counter{color:#fff; font-size:.82rem; font-weight:600; min-width:3.2rem; text-align:center; font-variant-numeric:tabular-nums;}

/* menu overlay */
.menu{position:fixed; inset:0; z-index:60; background:rgba(8,16,12,.92); backdrop-filter:blur(8px);
  display:none; padding:clamp(1.5rem,4vh,3rem); overflow:auto;}
.menu.open{display:block;}
.menu h3{color:#fff; font-family:'Merriweather',serif; margin-bottom:1.2rem; font-size:1.3rem;}
.menu-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.5rem; max-width:1100px; margin:0 auto;}
.menu-item{display:flex; align-items:center; gap:.7rem; text-align:left; background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1); color:#e6f3ec; padding:.6rem .8rem; border-radius:10px; cursor:pointer;
  font-size:.86rem; transition:background .15s;}
.menu-item:hover{background:rgba(116,198,157,.22);}
.menu-num{flex:none; width:1.7rem; height:1.7rem; border-radius:6px; background:var(--forest-mid); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700;}
.menu-close{position:fixed; top:18px; right:22px; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; z-index:61;}

/* half-bleed content layout (text left, edge-to-edge image right) */
.bleed-grid{position:absolute; inset:0; display:grid; grid-template-columns:1.04fr .96fr;}
.bleed-text{padding:clamp(1.4rem,4vh,2.8rem) clamp(1.5rem,3.4vw,3.2rem);
  display:flex; flex-direction:column; justify-content:center; min-width:0; overflow:auto;}
.bleed-media{position:relative; overflow:hidden; background:var(--pale);}
.bleed-media::before{content:""; position:absolute; left:0; top:0; bottom:0; width:34px; z-index:3;
  background:linear-gradient(90deg, rgba(20,40,30,.13), transparent); pointer-events:none;}
.bleed-media.cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.bleed-media.contain{display:flex; align-items:center; justify-content:center;
  padding:clamp(1.4rem,3.2vw,3rem); background:linear-gradient(155deg,#eef6f1,#dfeee6);}
.bleed-media.contain img{max-width:100%; max-height:100%; object-fit:contain; background:#fff;
  border-radius:12px; box-shadow:0 10px 30px rgba(20,40,30,.18); padding:6px;}

/* stacked layout (text on top, wide image full-width below) */
.stack-grid{position:absolute; inset:0; display:flex; flex-direction:column;}
.stack-top{display:grid; grid-template-columns:minmax(240px,34%) 1fr;
  gap:clamp(1.2rem,3vw,2.8rem); align-items:start;
  padding:clamp(1.1rem,2.8vh,2rem) clamp(1.6rem,3.4vw,3.4rem) clamp(.7rem,1.6vh,1.1rem);}
.stack-head .heading{margin-bottom:0;}
.stack-body{min-width:0;}
.stack-body .lead{margin-bottom:.7rem;}
.stack-body .bullets{display:block; columns:2; column-gap:1.9rem;}
.stack-body .bullets li{break-inside:avoid; margin-bottom:.5rem;}
.stack-body .pairs{display:block; columns:2; column-gap:1.2rem;}
.stack-body .pairs .pair{break-inside:avoid; margin-bottom:.55rem;}
.stack-body .note{margin-top:.7rem;}
.stack-media{flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center;
  padding:clamp(.7rem,1.8vh,1.2rem) clamp(1.6rem,3.4vw,3.4rem) clamp(2.2rem,4.5vh,3rem);
  background:linear-gradient(180deg,#eef6f1,#dfeee6);}
.stack-media::before{content:""; position:absolute; left:0; right:0; top:0; height:24px; z-index:2;
  background:linear-gradient(180deg,rgba(20,40,30,.11),transparent); pointer-events:none;}
.stack-media.contain img,.stack-media img{max-width:100%; max-height:100%; object-fit:contain;
  background:#fff; border-radius:12px; box-shadow:0 10px 30px rgba(20,40,30,.18); padding:6px;}

/* stat callouts */
.stat-row{display:flex; flex-wrap:wrap; gap:.7rem; margin:.2rem 0 1.1rem;}
.stat-box{flex:1 1 0; min-width:92px; background:#fff; border:1px solid var(--line);
  border-top:3px solid var(--accent,var(--green)); border-radius:12px;
  padding:.6rem .7rem .65rem; box-shadow:0 4px 14px rgba(20,40,30,.06);}
.stat-num{font-family:'Merriweather',serif; font-weight:800; color:var(--accent,var(--forest));
  font-size:clamp(1.35rem,2.9vw,2.1rem); line-height:1;}
.stat-lbl{font-size:clamp(.66rem,1.05vw,.8rem); color:var(--muted); line-height:1.25; margin-top:.3rem;}

@media (max-width:820px){
  .slide-inner.two-col{grid-template-columns:1fr; gap:1.2rem;}
  .col-media{order:-1;} .col-media img{max-height:34vh;}
  .bleed-grid{position:static; display:flex; flex-direction:column; height:100%;}
  .bleed-media{min-height:34vh;} .bleed-media.contain{min-height:30vh;}
  .bleed-media::before{display:none;}
  .stack-grid{position:static;}
  .stack-top{grid-template-columns:1fr; gap:.4rem;}
  .stack-body .bullets,.stack-body .pairs{grid-template-columns:1fr;}
  .stack-media{min-height:34vh;}
  .grid.cols-2{grid-template-columns:1fr;}
  .grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}
  .outline-grid,.obj-grid{grid-template-columns:1fr;}
  .slide{justify-content:flex-start; overflow-y:auto;}
}

.c56 .v-wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.c56 .v-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 18px rgba(60,45,20,.18));}
.c56 .v-tag{font:800 10px Inter;letter-spacing:.16em;fill:var(--gold);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.c56 .v-tag.lg{font-size:12.5px;fill:#4a3d28}
.c56 .v-tiny{font:600 9.5px Inter;letter-spacing:.08em;fill:#5e5340;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
.c56 .v-axis{font:500 8.5px Inter;fill:#8a7d60}
.c56 .v-big{font:900 21px Merriweather,serif;fill:var(--ink)}
.c56 .v-cart{font:italic 900 13px Merriweather,serif;fill:var(--ink)}
.c56 .v-unit{font:600 11px Inter;fill:#8a7d60}
.c56 .panel{background:var(--paper);border:1px solid #d9c9a3;border-radius:12px;padding:12px 14px;box-shadow:0 3px 10px rgba(60,45,20,.08)}
.c56 .panel h3{margin:0 0 .5rem;font:800 .7rem Inter;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.c56 .yr{font:900 2.6rem Merriweather,serif;line-height:1;margin:.1rem 0 .3rem}
.c56 .metric{display:flex;justify-content:space-between;align-items:baseline;padding:.32rem 0;border-bottom:1px dashed #e2d5b6}
.c56 .metric:last-child{border:0}
.c56 .metric span{font-size:.78rem;color:var(--muted)}
.c56 .metric b{font:900 1.02rem Merriweather,serif}
.c56 .ctl{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.c56 .ctl label{font:700 .72rem Inter;color:var(--muted)}
.c56 .btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:.45rem .7rem;border-radius:8px;font:700 .8rem Inter;cursor:pointer}
.c56 .btn.ghost{background:var(--paper);color:var(--ink);border-color:#cdb98d}
.c56 .row{display:flex;gap:6px;flex-wrap:wrap}
.c56 select,.c56 input[type=range]{width:100%}
.c56 select{padding:.35rem;border-radius:8px;border:1px solid #cdb98d;background:#fffaf0;font:600 .8rem Inter;color:var(--ink)}
.c56 .log{font-size:.74rem;color:var(--muted);margin-top:.4rem;line-height:1.4}
.c56 .note{font-size:.72rem;color:#8a7d60;line-height:1.45;margin-top:10px}
.c56 .fps{position:fixed;right:8px;bottom:6px;font:600 .66rem Inter;color:#a99a78}
.c56 .h-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.c56 .h-stage{position:relative}
.c56 .h-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 18px rgba(60,45,20,.18))}
.c56 .h-card{position:absolute;left:46px;top:42px;z-index:2;background:var(--paper);border:1px solid var(--gold);border-radius:8px;padding:.5rem .8rem;box-shadow:0 3px 10px rgba(60,45,20,.15);max-width:46%}
.c56 .h-card b{display:block;font:italic 900 1.05rem Merriweather,serif}
.c56 .h-card span{font-size:.74rem;color:var(--muted)}
.c56 .h-dealt{font:800 .6rem Inter;letter-spacing:.18em;color:var(--gold)}
.c56 .h-panel{background:var(--paper);border:1px solid #d9c9a3;border-radius:12px;padding:10px 12px;max-height:calc(100vh - 120px);overflow:auto}
.c56 .h-grp{margin-bottom:.5rem}

  <script>(function(){

if(!window.__cg){
/* the deck's shared script may not have run yet — whoever is first creates it */
if(!window.__deckLiveReady){
  window.__deckLiveReady = new Promise(function(res){ window.__deckLiveResolve = res; });
}
window.__cg = (function(){
  /* deterministic [0,1) from a string — every client agrees with no write */
  function rnd(s){
    var h=2166136261;
    for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    h^=h>>>15; h=Math.imul(h,2246822507); h^=h>>>13; h^=h>>>16;
    return (h>>>0)/4294967296;
  }
  function pick(s,n){ return Math.floor(rnd(s)*n)%n; }
  /* a stable per-browser player key, one per game id */
  function pid(gid){
    var k='cg-pid:'+gid, v=null;
    try{ v=localStorage.getItem(k); }catch(e){}
    if(!v){ v=Math.random().toString(36).slice(2,9);
            try{ localStorage.setItem(k,v); }catch(e){} }
    return v;
  }
  function clock(ms){
    if(ms==null) return '';
    var t=Math.max(0,Math.ceil(ms/1000)), m=Math.floor(t/60), s=t%60;
    return m+':'+(s<10?'0':'')+s;
  }
  /* keyboard inside a game must not drive the deck */
  function trapKeys(el){
    var NAV=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','PageUp','PageDown','Home','End'];
    el.addEventListener('keydown', function(e){ if(NAV.indexOf(e.key)>-1) e.stopPropagation(); });
  }
  return {rnd:rnd, pick:pick, pid:pid, clock:clock, trapKeys:trapKeys};
})();
}

// Shared drawing kit for the climate-game prototype: ink-and-watercolor helpers in the
// register of _deck-builder/plate_kit.py (cream paper, rough ink, watercolor washes, gold frame).
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const INK = '#3b3222', GOLD = '#8a6a2f', PAPER = '#fbf5e6';

function rng(seed) {
  let s = seed | 0;
  return () => {
    s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (cur, tgt, k) => cur + (tgt - cur) * k;

function hex(c) { c = c.replace('#', ''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) {
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t))).toString(16).padStart(2, '0')).join('');
}
function mixN(stops, t) {            // stops: [[t,color],...]
  t = clamp(t, stops[0][0], stops[stops.length - 1][0]);
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
      return mix(c0, c1, (t - t0) / (t1 - t0 || 1));
    }
  }
  return stops[stops.length - 1][1];
}

// Smooth closed "ridge" path through jittered points, closed down to yBottom.
function ridge(r, x0, x1, yBase, amp, step, yBottom, peaks) {
  const pts = [];
  for (let x = x0; x <= x1 + step; x += step) {
    let y = yBase - amp * (0.35 + 0.65 * r());
    if (peaks) for (const [px, ph, pw] of peaks) y -= ph * Math.exp(-((x - px) ** 2) / (2 * pw * pw));
    pts.push([Math.min(x, x1), y]);
  }
  let d = `M${x0},${yBottom} L${pts[0][0]},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
    d += ` Q${ax.toFixed(1)},${ay.toFixed(1)} ${((ax + bx) / 2).toFixed(1)},${((ay + by) / 2).toFixed(1)}`;
  }
  const l = pts[pts.length - 1];
  d += ` T${l[0]},${l[1].toFixed(1)} L${x1},${yBottom} Z`;
  return { d, pts };
}
function ridgeY(pts, x) {
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
    return lerp(ay, by, (x - ax) / (bx - ax || 1));
  }
  return pts[pts.length - 1][1];
}

// Filters and patterns (prefix p keeps ids unique per plate).
function defs(p, extra = '') {
  return `<defs>
  <filter id="${p}r" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
  <filter id="${p}w" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="3" seed="13"/><feDisplacementMap in="SourceGraphic" scale="10"/><feGaussianBlur stdDeviation=".8"/></filter>
  <filter id="${p}ws" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="5"/><feGaussianBlur stdDeviation=".5"/></filter>
  <filter id="${p}bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="${p}glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="${p}g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .36  0 0 0 0 .29  0 0 0 0 .18  0 0 0 .09 0"/></filter>
  <filter id="${p}pg" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="21"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .22  0 0 0 .07 0"/></filter>
  <pattern id="${p}h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 0 V5" stroke="${INK}" stroke-width=".8" opacity=".3"/></pattern>
  <pattern id="${p}hx" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><path d="M0 0 V7" stroke="${INK}" stroke-width=".7" opacity=".22"/></pattern>
  <pattern id="${p}d" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="${INK}" opacity=".35"/><circle cx="6.5" cy="6" r=".7" fill="${INK}" opacity=".3"/></pattern>
  ${extra}</defs>`;
}
function frame(p, w, h) {
  let o = `<path d="M0 0 H${w} V${h} H0 Z M35 26 H${w - 35} A9 9 0 0 1 ${w - 26} 35 V${h - 35} A9 9 0 0 1 ${w - 35} ${h - 26} H35 A9 9 0 0 1 26 ${h - 35} V35 A9 9 0 0 1 35 26 Z" fill="${PAPER}" fill-rule="evenodd"/>`;
  o += `<rect width="${w}" height="${h}" fill="#000" filter="url(#${p}g)" pointer-events="none"/>`;
  o += `<rect x="5" y="5" width="${w - 10}" height="${h - 10}" rx="17" fill="none" stroke="${INK}" stroke-width="2.2" filter="url(#${p}r)"/>`;
  o += `<rect x="15" y="15" width="${w - 30}" height="${h - 30}" rx="12" fill="none" stroke="${GOLD}" stroke-width="1.3"/>`;
  o += `<rect x="26" y="26" width="${w - 52}" height="${h - 52}" rx="9" fill="none" stroke="${GOLD}" stroke-width=".6"/>`;
  for (const [x, y] of [[15, 15], [w - 15, 15], [15, h - 15], [w - 15, h - 15]])
    o += `<path d="M${x},${y - 6} L${x + 6},${y} L${x},${y + 6} L${x - 6},${y} Z" fill="${GOLD}"/>`;
  return o;
}
// wash (watercolor fill) and ink (rough line) groups
const Wg = (p, s, op = 1) => `<g filter="url(#${p}w)"${op !== 1 ? ` opacity="${op}"` : ''}>${s}</g>`;
const Ws = (p, s, op = 1) => `<g filter="url(#${p}ws)"${op !== 1 ? ` opacity="${op}"` : ''}>${s}</g>`;
const Kg = (p, s, w = 1.6, col = INK) => `<g filter="url(#${p}r)" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${s}</g>`;

function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return [...root.querySelectorAll(sel)]; }
function setT(el, x, y, extra = '') { el.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})${extra}`); }

// Particle pool (smoke, steam, exhaust) drawn as SVG circles.
class Particles {
  constructor(g, n) {
    this.g = g; this.ps = [];
    for (let i = 0; i < n; i++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('r', 0); g.appendChild(c);
      this.ps.push({ c, life: 1, max: 1 });
    }
    this.i = 0;
  }
  emit(x, y, o) {
    const p = this.ps[this.i]; this.i = (this.i + 1) % this.ps.length;
    Object.assign(p, { x, y, vx: o.vx || 0, vy: o.vy || -20, r0: o.r0 || 3, r1: o.r1 || 14, life: 0, max: o.life || 3, op: o.op || .5, col: o.col || '#888', drift: o.drift || 0 });
    p.c.setAttribute('fill', p.col);
  }
  step(dt, wind = 0) {
    for (const p of this.ps) {
      if (p.life >= p.max) continue;
      p.life += dt;
      const t = p.life / p.max;
      p.x += (p.vx + wind * t + p.drift * Math.sin(p.life * 2)) * dt;
      p.y += p.vy * dt * (1 - t * .5);
      if (t >= 1) { p.c.setAttribute('r', 0); continue; }
      p.c.setAttribute('cx', p.x.toFixed(1)); p.c.setAttribute('cy', p.y.toFixed(1));
      p.c.setAttribute('r', lerp(p.r0, p.r1, Math.sqrt(t)).toFixed(1));
      p.c.setAttribute('opacity', (p.op * (t < .1 ? t / .1 : 1 - (t - .1) / .9)).toFixed(3));
    }
  }
}

// 1960–2025 Mauna Loa annual means (NOAA GML, rounded to the ppm).
const KEELING = { 1960: 317, 1965: 320, 1970: 326, 1975: 331, 1980: 339, 1985: 346, 1990: 354, 1995: 361, 2000: 369, 2005: 380, 2010: 390, 2015: 401, 2020: 414, 2025: 427 };
function keeling(y) {
  const ks = Object.keys(KEELING).map(Number);
  for (let i = 1; i < ks.length; i++) if (y <= ks[i]) return lerp(KEELING[ks[i - 1]], KEELING[ks[i]], (y - ks[i - 1]) / (ks[i] - ks[i - 1]));
  return KEELING[2025] + (y - 2025) * 2.5;
}
// Approximate global temperature anomaly vs 1850–1900 (smoothed decadal shape after HadCRUT5;
// prototype only — the real build should read the published annual series).
const ANOM = [[1880, -.05], [1900, -.05], [1910, -.15], [1920, -.05], [1930, .05], [1940, .2], [1950, .05], [1960, .1], [1970, .08], [1980, .3], [1990, .5], [2000, .65], [2010, .85], [2015, 1.1], [2020, 1.25], [2023, 1.45], [2024, 1.55], [2025, 1.45]];
function anomaly(y) {
  for (let i = 1; i < ANOM.length; i++) if (y <= ANOM[i][0]) return lerp(ANOM[i - 1][1], ANOM[i][1], (y - ANOM[i - 1][0]) / (ANOM[i][0] - ANOM[i - 1][0]));
  return ANOM[ANOM.length - 1][1];
}

// ── dealt identities (shared by the build screens and the simulation) ──
// Company = place-style prefix + a sector suffix; no real-company look-alikes, never repeated in a class.
const CO_PREFIX = ['Ridgeline', 'Ironbridge', 'Cottonwood', 'Mesa', 'Bluepeak', 'Juniper', 'Saguaro', 'Copper Canyon', 'Sandstone', 'Red Rock',
  'Granite Falls', 'Silverleaf', 'Willow Creek', 'Pinecrest', 'Desert Bloom', 'High Plains', 'Riverbend', 'Clearwater', 'Stonegate', 'Prairie Wind',
  'Canyon Wren', 'Ocotillo', 'Lantern Hill', 'Cedar Hollow', 'Sycamore', 'Kestrel', 'Bluebonnet', 'Palo Verde', 'Quail Run', 'Agave',
  'Thistle Ridge', 'Coyote Hill', 'Mariposa', 'Basalt', 'Ponderosa', 'Hollow Oak', 'Tamarack', 'Starling', 'Indigo Bay', 'Larkspur'];
const CO_SUFFIX = {
  power: ['Power', 'Energy', 'Electric', 'Power & Light', 'Utilities'],
  steel: ['Steel', 'Cement', 'Works', 'Ironworks', 'Materials'],
  farm: ['Farms', 'Ranch', 'Foods', 'Growers', 'Harvest Co.'],
  auto: ['Motors', 'Automotive', 'Auto Works', 'Mobility', 'Motor Co.'],
  data: ['Cloud', 'Data', 'Compute', 'Digital', 'Networks'],
};
function companyName(sec, r, taken = new Set()) {
  taken.pre ||= new Set();
  for (let i = 0; i < 200; i++) {
    const pre = CO_PREFIX[(r() * CO_PREFIX.length) | 0], n = pre + ' ' + CO_SUFFIX[sec][(r() * CO_SUFFIX[sec].length) | 0];
    if (!taken.pre.has(pre)) { taken.add(n); taken.pre.add(pre); return n; }
  }
  return 'Company ' + (taken.size + 1);
}
const FAMILY = ['Okafor', 'Nguyen', 'Garcia', 'Patel', 'Yazzie', 'Kim', 'Johnson', 'Haddad', 'Silva', 'Begay', 'Chen', 'Martinez', 'Williams', 'Rossi',
  'Tanaka', 'Mensah', 'Novak', 'Ibrahim', 'Lopez', 'Andersen', 'Cruz', 'Park', 'Ortiz', 'Khan', 'Bennett', 'Romero', 'Abebe', 'Singh', 'Reyes', 'Murphy'];
function familyName(r, taken = new Set()) {
  for (let i = 0; i < 100; i++) { const n = 'The ' + FAMILY[(r() * FAMILY.length) | 0] + ' household'; if (!taken.has(n)) { taken.add(n); return n; } }
  return 'Household ' + (taken.size + 1);
}

// Grow every label box to fit its text: a <rect> immediately followed by <text> whose centre sits inside it.
// Only ever grows (the drawing's proportions stay), and only measures once the SVG is visible (hidden text has no size).
function fitBoxes(svg) {
  if (!svg || !svg.isConnected || !svg.getBoundingClientRect().width) return false;
  for (const r of svg.querySelectorAll('rect')) {
    const texts = []; let n = r.nextElementSibling;
    while (n && n.tagName === 'text') { texts.push(n); n = n.nextElementSibling; }
    if (!texts.length) continue;
    const x = +r.getAttribute('x') || 0, y = +r.getAttribute('y') || 0, w = +r.getAttribute('width'), h = +r.getAttribute('height');
    if (!w || !h) continue;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, inside = false;
    for (const t of texts) {
      let b; try { b = t.getBBox(); } catch (e) { return false; }
      if (!b.width) continue;
      const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
      if (cx >= x - 2 && cx <= x + w + 2 && cy >= y - 2 && cy <= y + h + 2) inside = true;
      x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.x + b.width); y0 = Math.min(y0, b.y); y1 = Math.max(y1, b.y + b.height);
    }
    if (!inside || x1 < x0) continue;
    const nx0 = Math.min(x, x0 - 5), nx1 = Math.max(x + w, x1 + 5), ny0 = Math.min(y, y0 - 2), ny1 = Math.max(y + h, y1 + 2);
    if (nx0 < x || nx1 > x + w) { r.setAttribute('x', nx0.toFixed(1)); r.setAttribute('width', (nx1 - nx0).toFixed(1)); }
    if (ny0 < y || ny1 > y + h) { r.setAttribute('y', ny0.toFixed(1)); r.setAttribute('height', (ny1 - ny0).toFixed(1)); }
  }
  return true;
}
// fit once per drawing, as soon as it can be measured
function fitWhenVisible(svg) { if (svg && !svg.dataset.fitted && fitBoxes(svg)) svg.dataset.fitted = '1'; }

// THE SIMULATION ENGINE (no drawing). One model shared by the build screens, the run screen and, later, the live game.
//
// The class is the world. Each student household stands for HHSCALE real households and each company for a large firm;
// the class's own emissions, scaled so that the "as built" class matches 2026 world CO2 (about 41 Gt), drive CO2 ppm and
// warming. Households buy electricity from the class's power companies, food from its farms and cars from its automakers,
// so one student's choices move other students' bills and sales. Government laws apply to everyone, every year.
//
// Sources for the main coefficients (prototype values; see the Assumptions panel):
//   grid 0.37 kg CO2/kWh in 2026 (EIA); gasoline 8.89 kg/gal, natural gas 5.3 kg/therm (EPA); diets 2.62/2.07/1.39/1.05 t/person
//   (Scarborough et al. 2014); 2.13 GtC = 1 ppm and ~45% airborne fraction (Global Carbon Budget); TCRE ~0.45 °C per 1000 GtCO2
//   plus non-CO2 forcing (IPCC AR6), used here as 0.6 °C per 1000 GtCO2; heat-pump COP ~2.8; coal plant ~0.95, gas ~0.4 kg/kWh.
'use strict';
const SIM = (function () {
  const Y0 = 2026, YN = 2056, ELECTIONS = [2036, 2046];
  const HHSCALE = 12500;                 // real households per student household
  const WORLD0 = 41;                     // Gt CO2 per year in 2026 (fossil + industry + land use)

  // ───────────────────────── household model ─────────────────────────
  const HH_OPTS = {
    heat: ['gas', 'hp'], ins: ['basic', 'up'], sol: ['none', 'pv', 'pvb'], car: ['none', 'sedan', 'suv', 'hyb', 'ev'],
    diet: ['meat', 'mixed', 'veg', 'vegan'], th: ['68', '72', '76'], fly: ['0', '1', '3'], loc: ['sub', 'city', 'flood']
  };
  const DIET_T = { meat: 2.62, mixed: 2.07, veg: 1.39, vegan: 1.05 };
  const DIET_COST = { meat: 4300, mixed: 3900, veg: 3500, vegan: 3300 };

      `<rect x="${x + w + d * .3}" y="${y - h * .78 - 1.3 * s}" width="${d * .4}" height="${h * .32}" fill="#c9d6d8" transform="skewY(-18) translate(0,${(x + w + d * .3) * Math.tan(18 * Math.PI / 180)})"/>` +

  // city building: front face + side face + roof cap, window grid; returns [shape, lit]
  function building(x, base, w, h, d, col, k, kind) {

      `<path d="M${x},${base - h} l${d},${-d * .45} h${w} l${-d},${d * .45} Z" fill="${top}"/>` +
      `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="${col}"/>`;

    }

    if (kind === 'tank') s += `<path d="M${x + w * .55},${base - h} v-6 M${x + w * .8},${base - h} v-6" stroke="${INK}" stroke-width=".8"/><rect x="${x + w * .5}" y="${base - h - 13}" width="${w * .38}" height="8" rx="3" fill="#8a6a4a" stroke="${INK}" stroke-width=".6"/>`;

      Kg(P, `<rect x="1150" y="570" width="96" height="40"/><path d="M1228,570 v-96 h11 v96 M1206,570 v-66 h8 v66 M1252,610 v-78 h22 v78"/><path d="M1276,604 v-30 a14,6 0 0 1 28,0 v30"/>`, 1) +

  // ── the permit market: buyers' and sellers' staircases, and where they cross ──
  function marketSvg(orders, cleared, W = 640, H = 300) {
    const L = 46, Rm = 16, T = 22, B = 34;
    const buys = orders.filter(o => o.side === 'b').sort((a, b) => b.p - a.p), sells = orders.filter(o => o.side === 's').sort((a, b) => a.p - b.p);
    const qb = buys.reduce((a, o) => a + o.q, 0), qs = sells.reduce((a, o) => a + o.q, 0);
    const QMAX = Math.max(100, Math.ceil(Math.max(qb, qs) * 1.05 / 100) * 100), PMAX = Math.max(40, Math.ceil(Math.max(0, ...orders.map(o => o.p), cleared ? cleared.price : 0) * 1.1 / 40) * 40);   // ticks on round numbers
    const X = v => L + v / QMAX * (W - L - Rm), Y = v => T + (1 - v / PMAX) * (H - T - B);
    const steps = list => { let q0 = 0, d = ''; for (const o of list) { d += (d ? ` L${X(q0)},${Y(o.p)}` : `M${X(q0)},${Y(o.p)}`) + ` L${X(q0 + o.q)},${Y(o.p)}`; q0 += o.q; } return d; };
    let g = `<text x="${L}" y="13" class="r-ct">Price per tonne against permits (kt a year)</text>`;
    for (let k = 0; k <= 4; k++) { const v = PMAX * k / 4; g += `<path d="M${L},${Y(v)} H${W - Rm}" stroke="#e8dcc0"/><text x="${L - 6}" y="${Y(v) + 3}" class="r-ax" text-anchor="end">$${Math.round(v)}</text>`; }
    for (let k = 0; k <= 4; k++) { const v = QMAX * k / 4; g += `<text x="${X(v)}" y="${H - B + 15}" class="r-ax" text-anchor="middle">${Math.round(v)}</text>`; }
    g += `<path d="M${L},${T} V${H - B} H${W - Rm}" stroke="#3b3222" fill="none"/>`;
    if (buys.length) g += `<path d="${steps(buys)}" stroke="#2668a8" stroke-width="3" fill="none" stroke-linejoin="round"/>`;
    if (sells.length) g += `<path d="${steps(sells)}" stroke="#2f8545" stroke-width="3" fill="none" stroke-linejoin="round"/>`;
    if (!orders.length) g += `<text x="${(L + W) / 2}" y="${H / 2}" class="r-empty" text-anchor="middle">Orders will appear here as they come in</text>`;
    if (cleared && cleared.vol > 0) {
      const cx = X(cleared.vol), cy = Y(cleared.price);
      g += `<path d="M${L},${cy} H${cx} V${H - B}" stroke="#b8432f" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><circle cx="${cx}" cy="${cy}" r="7" fill="#b8432f" stroke="#fbf5e6" stroke-width="2.5"/>` +
        `<text x="${Math.min(cx + 12, W - 150)}" y="${cy + 22}" class="r-mkl">$${cleared.price} a tonne · ${Math.round(cleared.vol)} kt</text>`;
    }
    return `<svg class="r-msvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Supply and demand for permits">${g}</svg>`;
  }
  function showTrade(m, o) {
    const orders = m.orders.filter(x => x.side !== 'n'), fill = id => m.fills[id] || 0;
    const rows = orders.slice().sort((a, b) => (fill(b.id) > 0) - (fill(a.id) > 0) || (a.side < b.side ? 1 : -1)).map(x => {

    overlay(head(`YEAR ${m.year} · THE PERMIT MARKET`, m.vol > 0 ? `The market cleared at $${m.price} a tonne` : 'Nobody traded',

    if (ph === 'laws') return 'The laws are being announced.';
    if (ph === 'react') return r === 'gov' ? 'Households and companies are reacting to your laws.' : (m && m.locked ? 'Changes locked in.' : 'The laws are in. Change anything you want, then lock in.');
    if (ph === 'reacted') return 'Here is how the class reacted.';
    if (ph === 'run') return 'The years are passing. Watch your screen and the big screen.';
    if (ph === 'elect') return r === 'gov' ? 'The voters are deciding your fate.' : (m && m.locked ? 'Ballot cast.' : 'Do you approve of the government? Vote now.');

    if (ph === 'midlaws' || ph === 'midtrade' || ph === 'midreact') return 'The midterm results are in.';

  }

  // ── the lobby ──

        <div class="c56-roles">${['hh', 'biz', 'gov'].map(k => `<div>${RUN.glyph(ROLE[k].g, 26)}<b>${ROLE[k].t}</b><span>${ROLE[k].d}</span></div>`).join('')}</div></div>
      <div class="c56-lr"><div class="c56-count"><b>${n}</b><span>${n === 1 ? 'student' : 'students'} joined</span></div><div class="c56-dots">${dots}</div>

        ${!HOST && ph === 'lobby' ? (joined() ? '<div class="c56-in">You are in.</div>' : '<button class="c56-b go big" data-join>Join the game</button>') : ''}</div></div>`;
    box.querySelectorAll('[data-opt]').forEach(c => c.onchange = () => { const o = { ...OPT() }; o[c.dataset.opt] = c.checked; backend.mergeDoc('polls', GID, { opts: { mid: o.mid ? 1 : 0, trade: o.trade ? 1 : 0, polls: o.polls ? 1 : 0 } }); });
    const j = box.querySelector('[data-join]');
    if (j) j.onclick = () => { if (!backend) return; backend.mergeDocShard('polls', GID, { players: { [PK]: { t: Date.now() } } }); j.disabled = true; j.textContent = 'Joining…'; };
  }

  function optsPanel() {
    const o = OPT(), row = (k, t, d) => `<label class="c56-opt"><input type="checkbox" data-opt="${k}"${o[k] ? ' checked' : ''}><span><b>${t}</b><small>${d}</small></span></label>`;

  }
  // ── role card (first time a student sees their role) ──

      : r === 'biz' ? `<b class="c56-rn">${esc(a.name)}</b><span>${RUN.SECN[a.sec]} · ${a.workers} workers · $${a.cap}M to invest</span>`

  // ── household & company builders (build and react rounds) ──

    const W = react ? SIM.worldFor(C, C.year, C.hist.length ? C.hist[C.hist.length - 1].permit : 0) : null;
    const lockLbl = midterm ? 'Lock in my one change' : react ? 'Lock in my changes' : null;
    const status = m.locked ? (react ? 'Changes locked in. You can still edit until time runs out.' : 'Locked in. You can still edit until time runs out.') : '';
    const onLock = (choices, lock) => {

        mode: react ? 'react' : 'build', eyebrow: midterm ? `YEAR ${C.year} · MIDTERM: ONE CHANGE` : react ? `YEAR ${C.year} · THE LAWS ARE IN` : 'DEALT TO YOU', onLock, onChange, locked: !!m.locked, status, lockLabel: lockLbl, maxChanges: midterm ? 1 : 0,

      BUSINESS.configure({ company: { name: a.name, workers: a.workers, cap: a.cap, sec: a.sec }, base: react ? SIM.pickB(a) : a.base, cash: react ? a.cash : a.cap, choices, W, M, pol: react ? C.pol : null, year: C.year,
        mode: react ? 'react' : 'build', eyebrow: midterm ? `YEAR ${C.year} · MIDTERM: ONE CHANGE` : react ? `YEAR ${C.year} · THE LAWS ARE IN` : 'DEALT TO YOU', preview: false, onLock, onChange, locked: !!m.locked, status, lockLabel: lockLbl, maxChanges: midterm ? 1 : 0, visible: () => isOn('business') });

  // ── government ballot (first laws and re-votes) ──
  let govSig = '';
  function paintGov(C) {
    screen('gov');
    const extras = phase() === 'revote', midterm = phase() === 'mid', k = govKey(), m = mine(k) || {};
    const sig = gid() + k + (m.locked ? 1 : 0); if (sig === govSig) return; govSig = sig;
    const v = Object.assign({ tax: 0, cap: 0, evRebate: 0, hpRebate: 0, solarCredit: 0, use: 0 }, extras || midterm ? lawsAsVote(C.pol) : {}, SIM.parseVote(m.draft || m.v || ''));
    const ids = midterm ? SIM.agendaOf(F()['AG' + (win() + 1)]) : ['tax', 'cap', 'evRebate', 'hpRebate', 'solarCredit', 'use', ...(extras ? ['cleanStd', 'fuelStd', 'border', 'methane', 'seaWall', 'nuclear'] : [])];
    const WHY = {
      tax: 'Raises gasoline about 9¢ a gallon for every $10. Everyone who burns fossil fuels pays, so everyone looks for cheaper ways to cut.',
      cap: 'Sets a falling limit on company emissions. Firms that cut cheaply sell permits to those that can’t. The market sets the price.',
      evRebate: 'Makes electric cars cheaper for households. The government pays $7,500 for each one.',
      hpRebate: 'Takes $8,000 off a heat pump and helps with insulation.',

      use: 'A dividend gives every household an equal check. Subsidies cut the price of clean equipment. Paying debt keeps the budget tidy.',
      cleanStd: 'Power companies still burning mostly fossil fuels after 2036 pay a $30M fine every year.',
      fuelStd: 'Automakers that only build SUVs pay $15M a year.',
      border: 'Imports pay for their carbon, so local steel can pass its own carbon costs on to buyers.',
      methane: 'Farms pay the carbon price on cattle methane, which is otherwise exempt.',

      nuclear: 'Lets power companies build nuclear plants: almost no CO₂, a huge upfront cost.',
    };
    const card = id => {
      const B = SIM.BILLS[id], cur = v[id];
      let ctl;
      if (B.kind === 'level') ctl = B.opts.map(o => `<button class="c56-seg${cur === o ? ' on' : ''}" data-b="${id}" data-v="${o}">$${o}</button>`).join('');
      else if (B.kind === 'yn') ctl = [[1, 'Yes'], [0, 'No']].map(([x, l]) => `<button class="c56-seg${(+cur || 0) === x ? ' on' : ''}" data-b="${id}" data-v="${x}">${l}</button>`).join('');
      else ctl = B.labels.map((l, i) => `<button class="c56-seg${(+cur || 0) === i ? ' on' : ''}" data-b="${id}" data-v="${i}">${l}</button>`).join('');
      return `<div class="c56-bill${B.extra ? ' x' : ''}"><div class="c56-bt"><b>${B.title}</b>${B.extra ? '<em>NEW</em>' : ''}<small>${B.q}</small></div><div class="c56-segs">${ctl}</div><p>${WHY[id]}</p></div>`;
    };
    const prev = previewLaws(C, v);
    q('[data-screen=gov]').innerHTML = `<div class="c56-gov"><div class="c56-bills">
        <div class="c56-eb">${midterm ? `YEAR ${C.year} · MIDTERM SESSION` : extras ? `YEAR ${C.year} · YOU WERE VOTED OUT` : 'THE FIRST LAWS'}</div>
        <h3>${midterm ? 'Three laws are back on the table' : extras ? 'Re-vote, with six new options' : 'Vote on every bill'}</h3>
        <p class="c56-gsub">Your votes are secret until the reveal. The carbon tax is set by the middle vote of the ${C.gov.length} members; every other bill needs a majority.</p>
        ${ids.map(card).join('')}</div>
      <aside class="c56-gside"><div class="c56-gcham" data-gcham></div><div class="c56-eb">WHAT YOUR LAWS WOULD DO</div>${prev}${pollPanel()}
        <div class="c56-glock"><div class="h-lockst">${m.locked ? 'Votes cast. You can change them until time runs out.' : ''}</div><button class="c56-b go big" data-cast>${m.locked ? 'Change my votes' : 'Cast my votes'}</button></div></aside></div>`;
    const box = q('[data-screen=gov]');
    gchamSig = ''; paintGcham(C);
    box.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
      if ((mine(k) || {}).locked) return;
      v[b.dataset.b] = +b.dataset.v; setMine(k, { ...(mine(k) || {}), draft: SIM.packVote(v), touched: 1 }); govSig = ''; paintGov(C);
    });
    box.querySelector('[data-cast]').onclick = () => {
      const cur = mine(k) || {};
      if (cur.locked) { setMine(k, { ...cur, locked: 0, draft: cur.v }); } else submit(k, SIM.packVote(v));
      govSig = ''; paintGov(C);
    };
  }
  // the little chamber on a government student's screen: seats light up as members lock in, yours is marked
  let gchamSig = '';
  function paintGcham(C) {
    const el = q('[data-gcham]'); if (!el || !C) return;
    const lit = govLit(C), you = C.gov.findIndex(g => g.id === PK), sig = gid() + phase() + win() + ':' + lit.join(',') + ':' + you;
    if (sig === gchamSig) return; gchamSig = sig;
    el.innerHTML = CHAMBER.mini('cg', C.gov, { lit, you, note: 'How anyone voted stays secret.' }) + `<small>${lit.length} of ${C.gov.length} members have voted. The chamber reveals every vote together.</small>`;
  }
  const lawsAsVote = p => ({ tax: p.tax, cap: p.cap ? 1 : 0, evRebate: p.evRebate ? 1 : 0, hpRebate: p.hpRebate ? 1 : 0, solarCredit: p.solarCredit ? 1 : 0, use: ['dividend', 'subsidies', 'debt'].indexOf(p.use), cleanStd: p.cleanStd ? 1 : 0, fuelStd: p.fuelStd ? 1 : 0, border: p.border ? 1 : 0, methane: p.methane ? 1 : 0, seaWall: p.seaWall ? 1 : 0, nuclear: p.nuclear ? 1 : 0 });
  // a rough preview: a typical household's yearly bills and the government's carbon money under these laws
  function previewLaws(C, v) {
    const pol = { ...SIM.emptyPolicy(), tax: v.tax || 0 }, base = { ...SIM.emptyPolicy() };
    const mk = p => { const tax = p.tax, wholesale = .6 * (.032 + .62 * tax / 1000) + .04; return { year: C.year, T: 1.4, pol: p, grid: C.hist.length ? C.hist[C.hist.length - 1].grid : .37, permit: 0, tax, wholesale, elec: .105 + wholesale, gas: 1.5 + .0053 * tax, fuel: 3.4 + .00889 * tax }; };
    const typ = { people: 3, loc: 'sub', heat: 'gas', ins: 'basic', sol: 'none', car: 'sedan', diet: 'mixed', th: '72', fly: '1' };
    const b0 = SIM.hhYear(typ, mk(base)).bills.total, b1 = SIM.hhYear(typ, mk(pol)).bills.total;
    const kt = C.hist.length ? C.hist[C.hist.length - 1].classKt : C.ref;
    const rev = (v.tax || 0) * kt / 1000, evCost = v.evRebate ? C.hh.length * .3 * 7500 * SIM.HHSCALE / 1e6 / 10 : 0;
    const div = v.use === 0 && rev ? rev * .9 * 1e6 / (Math.max(1, C.hh.length) * SIM.HHSCALE) : 0;
    const row = (l, x, cls = '') => `<div class="r-yrow"><span>${l}</span><b class="${cls}">${x}</b></div>`;
    return `<div class="c56-prev">${row('A typical household’s bills', (b1 - b0 >= 0 ? '+$' : '−$') + Math.abs(Math.round((b1 - b0) / 10) * 10).toLocaleString() + ' a year', b1 > b0 ? 'neg' : '')}
      ${div ? row('Its carbon dividend', '+$' + Math.round(div / 10) * 10 + ' a year') : ''}
      ${row('Carbon money raised', '$' + Math.round(rev) + 'M a year')}
      ${evCost ? row('EV rebates, roughly', '−$' + Math.round(evCost) + 'M a year', 'neg') : ''}
      <small>Rough, before anyone changes what they do. The real effect depends on how households and companies react.</small></div>`;
  }

  // ── election ballot ──
  let ballotSig = '';
  function paintBallot(C) {
    screen('ballot');
    const k = 'B' + win(), m = mine(k) || {}, r = role(), a = myAgent(C);
    const sig = gid() + k + (m.v || '') + (m.locked ? 1 : 0); if (sig === ballotSig) return; ballotSig = sig;
    const h = C.hist, last = h[h.length - 1], prev = h[Math.max(0, h.length - 11)];
    const cur = SIM.parseBallot(m.draft || m.v || '');
    const why = r === 'hh' ? [[3, 'The climate is improving'], [4, 'My bills are under control'], [0, 'My bills are too high'], [2, 'Not enough climate action']]
      : [[5, 'Our profits are holding up'], [3, 'The climate is improving'], [1, 'Carbon costs are too high'], [2, 'Not enough climate action'], [6, 'My company went under']];
    let mineRows = '';
    if (r === 'hh') mineRows = `<div class="r-yrow"><span>Your energy bills</span><b>${(a.last.burden * 100).toFixed(1)}% of income</b></div><div class="r-yrow"><span>Your savings</span><b class="${a.cash < 0 ? 'neg' : ''}">${a.cash < 0 ? '−' : ''}$${Math.abs(Math.round(a.cash)).toLocaleString()}</b></div><div class="r-yrow"><span>Your footprint</span><b>${a.last.t.total.toFixed(1)} t CO₂ a year</b></div>`;
    else if (a.open) mineRows = `<div class="r-yrow"><span>Your profit last year</span><b class="${a.last.profit < 0 ? 'neg' : ''}">${RUN.fmt$(a.last.profit)}</b></div><div class="r-yrow"><span>Carbon costs</span><b>${RUN.fmt$(a.last.taxCost + a.last.permitCost)}</b></div><div class="r-yrow"><span>Cash</span><b class="${a.cash < 0 ? 'neg' : ''}">${RUN.fmt$(a.cash)}</b></div>`;
    else mineRows = `<div class="r-yrow"><span>${esc(a.name)}</span><b class="neg">Closed</b></div>`;
    q('[data-screen=ballot]').innerHTML = `<div class="c56-ballot"><div class="c56-eb">YEAR ${C.year} · ELECTION</div><h3>Do you approve of the government?</h3>
      <div class="c56-bgrid"><div class="c56-bfacts"><div class="c56-eb">THE LAST TEN YEARS</div>
        <div class="r-yrow"><span>Warming</span><b>+${last.T.toFixed(2)} °C</b></div><div class="r-yrow"><span>Class emissions this decade</span><b>${last.index <= prev.index ? '−' : '+'}${Math.abs(Math.round((last.index / prev.index - 1) * 100))}%</b></div>
        <div class="r-yrow"><span>Laws</span><b>${esc(RUN.lawLine(C.pol))}</b></div>${mineRows}</div>
      <div class="c56-bvote"><div class="c56-yn"><button class="c56-yes${cur && cur.approve ? ' on' : ''}" data-yn="y">Approve</button><button class="c56-no${cur && !cur.approve ? ' on' : ''}" data-yn="n">Disapprove</button></div>
        <div class="c56-eb" style="margin-top:.8rem">THE MAIN REASON</div><div class="c56-why">${why.map(([c, l]) => `<button class="c56-seg${cur && SIM.REASONS[c] === cur.why ? ' on' : ''}" data-why="${c}">${l}</button>`).join('')}</div>
        <div class="c56-glock"><div class="h-lockst">${m.locked ? 'Ballot cast. You can change it until time runs out.' : ''}</div><button class="c56-b go big" data-cast${cur ? '' : ' disabled'}>${m.locked ? 'Change my ballot' : 'Cast my ballot'}</button></div></div></div></div>`;
    const box = q('[data-screen=ballot]');
    let pick = cur ? { yn: cur.approve ? 'y' : 'n', why: SIM.REASONS.indexOf(cur.why) } : { yn: null, why: null };
    const save = () => { if (!pick.yn) return; const s = pick.yn + (pick.why == null || pick.why < 0 ? (pick.yn === 'y' ? 3 : 0) : pick.why); setMine(k, { ...(mine(k) || {}), draft: s, touched: 1 }); ballotSig = ''; paintBallot(C); };
    box.querySelectorAll('[data-yn]').forEach(b => b.onclick = () => { if ((mine(k) || {}).locked) return; pick.yn = b.dataset.yn; save(); });
    box.querySelectorAll('[data-why]').forEach(b => b.onclick = () => { if ((mine(k) || {}).locked) return; pick.why = +b.dataset.why; if (!pick.yn) pick.yn = [3, 4, 5].includes(pick.why) ? 'y' : 'n'; save(); });
    box.querySelector('[data-cast]').onclick = () => { const c = mine(k) || {}; if (c.locked) setMine(k, { ...c, locked: 0, draft: c.v }); else if (c.draft) submit(k, c.draft); ballotSig = ''; paintBallot(C); };
  }


  // ═════════════ polls: each year about 10% of households and companies get a quick, optional poll ═════════════
  // The answers go to the news when the poll closes (three years later, or at a stop), and the bills the polls asked
  // about set the midterm agenda. Polls never change the simulation directly: they inform the government.
  const POLLS = [
    { q: 'Do you approve of the way the government is handling things?', o: ['Approve', 'Disapprove'] },
    { q: 'Should the government do more or less to fight climate change?', o: ['More', 'About the same', 'Less'], bill: 'tax' },
    { q: 'Should taxes be lower, even if it means less climate action?', o: ['Yes', 'No'], bill: 'tax' },
    { q: 'Should the government help people buy electric cars?', o: ['Yes', 'No'], bill: 'evRebate' },
    { q: 'Should the government help pay for heat pumps and insulation?', o: ['Yes', 'No'], bill: 'hpRebate' },
    { q: 'Should rooftop solar get a tax credit?', o: ['Yes', 'No'], bill: 'solarCredit' },
    { q: 'Should big polluters face a hard limit on their emissions?', o: ['Yes', 'No'], bill: 'cap' },
    { q: 'Where should carbon tax money go?', o: ['Checks to households', 'Clean energy', 'Paying down debt'], bill: 'use' },
    { q: 'Should the government spend more on flood protection?', o: ['Yes', 'No'], bill: 'seaWall' },
    { q: 'Should power companies be required to switch to clean energy?', o: ['Yes', 'No'], bill: 'cleanStd' },
    { q: 'Are you better off than you were five years ago?', o: ['Better off', 'About the same', 'Worse off'] },
    { q: 'Should farms pay for the methane their cattle produce?', o: ['Yes', 'No'], bill: 'methane' },
  ];
  // poll c is asked when year c is done (c = 1…30); its question rotates through the list in an order dealt per game
  function pollQ(c) {
    const order = POLLS.map((_, i) => i).sort((a, b) => SIM.hash(gid() + ':pq:' + a) - SIM.hash(gid() + ':pq:' + b));
    if (c % 10 === 9) return 0;                       // just before each election: do you approve?
    return order[c % order.length];
  }
  function pollees(c) {
    if (!OPT().polls) return [];
    if (DEMO && DEMO_POLL && c === 4) return role() === 'gov' || !me() ? [] : [PK];     // the demo shows the viewer a poll
    const cit = members().filter(m => m.role !== 'gov'), n = Math.max(1, Math.round(members().length * .1));
    return cit.map(m => m.pk).sort((a, b) => SIM.hash(gid() + ':poll:' + c + ':' + a) - SIM.hash(gid() + ':poll:' + c + ':' + b)).slice(0, n);
  }
  // host: count every poll whose window has closed by `n` years (open for three years)
  function tallyPolls(n) {
    const PR = { ...(state.PR || {}) };
    for (let c = 1; c <= 30; c++) {
      if (PR['p' + c] || c + 3 > n) continue;

  let cntAt = 0, cntSig = '';
  function publishCounts(k, n) {
    const sig = k + n.join(',');
    if (sig === cntSig || Date.now() - cntAt < 2000) return;
    cntSig = sig; cntAt = Date.now(); backend.mergeDoc('polls', GID, { cnt: { k, n } });
  }
  function youPanel(C) {
    const a = myAgent(C), r = role();
    if (!a || !C.hist.length || HOST) return '';
    const last = C.hist[C.hist.length - 1], row = (l, v, cls = '') => `<div class="r-yrow"><span>${l}</span><b class="${cls}">${v}</b></div>`;
    if (r === 'hh') {
      const L = a.last; if (!L) return '';
      const hit = last.events.includes('flood') && a.loc === 'flood' ? `A flood reached your home: $${Math.round(L.dmg).toLocaleString()} in damage.` : L.dmg > 300 ? `Extreme weather cost you $${Math.round(L.dmg).toLocaleString()} this year.` : '';
      return `<h4>You · ${last.year}</h4><b class="nm">${esc(a.name)}</b>${row('Bills this year', '$' + Math.round(L.bills.total).toLocaleString())}${row('Energy and fuel', (L.burden * 100).toFixed(1) + '% of income')}${row('Footprint', L.t.total.toFixed(1) + ' t CO₂')}${row('Savings', (a.cash < 0 ? '−$' : '$') + Math.abs(Math.round(a.cash)).toLocaleString(), a.cash < 0 ? 'neg' : '')}${hit ? `<div class="r-yev">${hit}</div>` : ''}`;
    }
    if (r === 'biz') {
      if (!a.open) return `<h4>You · ${last.year}</h4><b class="nm">${esc(a.name)}</b><div class="r-yev">Your company went bankrupt. ${a.workers} workers lost their jobs.</div>`;
      const L = a.last; if (!L) return '';
      return `<h4>You · ${last.year}</h4><b class="nm">${esc(a.name)}</b>${row('Profit this year', RUN.fmt$(L.profit), L.profit < 0 ? 'neg' : '')}${row('Carbon costs', RUN.fmt$(L.taxCost + L.permitCost))}${row('Emissions', Math.round(L.kt.total) + ' kt CO₂')}${a.share && C.pol.cap && C.free ? row('Permits, free', Math.round(a.share * C.pol.capStart * Math.pow(.97, last.year - C.pol.capYear) + (a.tq || 0)) + ' kt') : ''}${row('Cash', RUN.fmt$(a.cash), a.cash < 0 ? 'neg' : '')}${L.accident ? '<div class="r-yev">An accident at your plant cost $40M.</div>' : ''}`;
    }
    const e = C.elections[C.elections.length - 1];
    return `<h4>You · ${last.year}</h4><b class="nm">${esc(a.name)}, government</b>${row('Your laws', esc(RUN.lawLine(C.pol)))}${row('Budget this year', RUN.fmt$(last.govIn - last.govOut), last.govIn < last.govOut ? 'neg' : '')}${e ? row('Last election', Math.round(e.pct * 100) + '% approved') : ''}`;
  }

  // ═════════════ render ═════════════
  function render() {

    if (ph === 'build') return r === 'gov' ? paintGov(C) : paintBuilder(C);
    if (ph === 'react' && r !== 'gov') return paintBuilder(C);

    if (ph === 'revote' && r === 'gov') return paintGov(C);

  // ═════════════ the clock ═════════════

  }
  setInterval(tick, 250);


  // ═════════════ the self-running demo (game-demos site and the "Sample student screen") ═════════════
  // A class of 23 bots plus one viewer plays a whole game on the browser-local backend: it never touches Firestore.
  // Every beat calls the same host functions a real projector uses. ?freeze=N jumps straight to beat N.
  let DEMO_POLL = true, DEMO_ON = false;     // DEMO_ON: the script owns the clock
  function demoRun() {
    const want = ({ household: 'hh', hh: 'hh', company: 'biz', business: 'biz', biz: 'biz', government: 'gov', gov: 'gov', projector: 'host', host: 'host' })[DQ.get('role') || 'projector'] || 'host';
    const SEED = +(DQ.get('seed') || 2056), FREEZE = DQ.has('freeze') ? +DQ.get('freeze') : -1;
    const bots = Array.from({ length: 23 }, (_, i) => 'bot' + String(i).padStart(2, '0'));
    if (want === 'host') { HOST = true; PK = 'demo-projector'; }
    else for (let i = 0; i < 23; i++) { const pk = bots[i] + 'v',      // sorts into a different seat each try
      m = SIM.deal([...bots, pk], SEED).find(x => x.pk === pk); if (m.role === want) { PK = pk; break; } }
    const all = want === 'host' ? [...bots, 'bot23'] : [...bots, PK];
    const doc = o => backend.mergeDoc('polls', GID, o), shard = o => backend.mergeDocShard('polls', GID, o);
    const mem = () => members(), byRole = r => mem().filter(m => m.role === r && m.pk !== PK);
    const C = () => classNow();
    const mineDraft = (k, v) => setMine(k, { draft: v, touched: 1 });
    const mineSubmit = (k, v) => { setMine('intro', 1); submit(k, v); };
    const viewerRole = () => role();
    // the viewer's own choices for each round, by role
    function viewerPlan(round) {
      const r = viewerRole(), a = C() && myAgent(C());
      if (!a) return null;
      if (r === 'gov') return round === 'D' ? ['V0', SIM.packVote({ tax: 75, cap: 1, evRebate: 1, hpRebate: 1, solarCredit: 0, use: 0 })]
        : round === 'M' ? ['MV' + (win() + 1), SIM.packVote({ ...lawsAsVote(C().pol), tax: 100, evRebate: 1 })]
        : round === 'R' ? ['V' + win(), SIM.packVote({ tax: 75, cap: 1, evRebate: 1, hpRebate: 1, solarCredit: 1, use: 0, cleanStd: 1, fuelStd: 0, border: 1, methane: 0, seaWall: 1, nuclear: 0 })] : null;
      if (r === 'hh') {
        const h = SIM.pickH(a);
        if (round === 'D') return ['D', SIM.packHH({ ...SIM.AS_BUILT_HH, loc: a.loc, fly: a.fly, heat: 'hp', car: 'hyb', diet: 'veg', th: '68' })];
        if (round === 'A') return ['A' + win(), SIM.packHH({ ...h, ins: 'up' })];
        if (round === 'M') return ['MA' + (win() + 1), SIM.packHH({ ...h, sol: h.sol === 'none' ? 'pv' : h.sol, ...(h.sol !== 'none' ? { car: 'ev' } : {}) })];
        if (round === 'B') return ['B' + win(), 'n0'];
      }
      if (r === 'biz') {
        const b = SIM.pickB(a), prods = Object.keys(SIM.SECT[a.sec].prods).filter(p => p !== 'nuc'), green = prods[Math.min(1, prods.length - 1)];
        if (round === 'D') return ['D', SIM.packB({ ...b, prod: green, filt: 'yes', fleet: 'ev' })];
        if (round === 'A') return ['A' + win(), SIM.packB({ ...b, energy: a.sec === 'power' ? 'grid' : 'ppa' })];
        if (round === 'M') {
          if (SIM.tradingNow(C())) { const x = SIM.positions(C()).list.find(z => z.b.id === PK); if (!x) return ['MT' + (win() + 1), 'n'];
            return ['MT' + (win() + 1), x.short > 0 ? `b,${Math.max(10, Math.round(x.short / 10) * 10)},60` : `s,${Math.max(10, Math.round(-x.short / 10) * 10)},30`]; }
          return ['MA' + (win() + 1), SIM.packB({ ...b, safe: 'plus' })];

    }
    const draft = round => { const p = viewerPlan(round); if (p) { setMine('intro', 1); mineDraft(p[0], p[1]); lastBuilderSig = govSig = ballotSig = tradeSig = ''; render(); } };
    const lock = round => { const p = viewerPlan(round); if (p) mineSubmit(p[0], p[1]); };
    // the bots: votes that pass a cap, a few plans and ballots, and orders for the permit market
    function botsVote(key, v) { const o = {}; byRole('gov').forEach((m, i) => o[m.pk] = SIM.packVote({ ...v, tax: [50, 75, 100, 25, 150][i % 5] })); shard({ in: { [key]: o } }); }
    function botsMarket() {
      const P = SIM.positions(C()), o = {};
      for (const x of P.list) { if (x.b.id === PK) continue; const sh = Math.round(x.short / 10) * 10; o[x.b.id] = Math.abs(sh) < 10 ? 'n' : sh > 0 ? `b,${sh},${40 + (x.b.id.charCodeAt(4) % 5) * 9}` : `s,${-sh},${18 + (x.b.id.charCodeAt(4) % 5) * 6}`; }

    }
    function botsHouseholds(key, mod) { const o = {}; byRole('hh').slice(0, 4).forEach(m => { const h = C().hh.find(x => x.id === m.pk); if (h) o[m.pk] = SIM.packHH({ ...SIM.pickH(h), ...mod }); }); shard({ in: { [key]: o } }); }
    function botsBallots(key, no) { const o = {}; [...byRole('hh'), ...byRole('biz')].forEach((m, i) => o[m.pk] = i % 10 < no ? ['n0', 'n1', 'n2'][i % 3] : 'y3'); shard({ in: { [key]: o } }); }
    const years = (n, cap) => { const out = []; for (let i = 0; i < n; i++) out.push([1300, () => advance(), cap]); return out; };
    const toEnd = () => { for (let k = 0; k < 200; k++) { const ph = phase(); if (ph === 'final') return;
      if (ph === 'run' || ph === 'mid' || ph === 'elect' || ph === 'revote' || ph === 'react') advance();
      else if (ph === 'laws') go.laws(); else if (ph === 'reacted') go.reacted(); else if (ph === 'midlaws') go.midlaws(); else if (ph === 'midtrade') go.midtrade(); else if (ph === 'midreact') go.midreact();
      else if (ph === 'elected') go.elected(C().logs['elect' + win()].keep); } };
    const who = { hh: 'You are a household', biz: 'You run a company', gov: 'You are in the government', host: 'This is the projector' }[want];
    const S = [
      [400, () => backend.setDoc('polls', GID, { phase: 'lobby', players: {}, gameId: SEED, pace: 999, opts: { mid: 1, trade: 1, polls: 1 }, hostId: HOSTID }), `2056, one hypothetical class played out. ${who}. A real class will play differently.`],
      [1800, () => doc({ players: Object.fromEntries(all.map((k, i) => [k, { t: i + 1 }])) }), '24 students open the slide and join.'],
      [2200, () => setPhase('build', 360, { roster: all.slice().sort().join(','), win: 0, yr: 0 }), 'Everyone is dealt a role: about a fifth go to the government, the rest are households and companies.'],
      [3600, () => draft('D'), want === 'gov' ? 'The government votes on the first laws. The carbon tax is set by the middle vote.' : want === 'host' ? 'While students build, the projector counts who has finished.' : 'Each household and company builds before anyone knows the laws.'],
      [2200, () => { lock('D'); botsVote('V0', { cap: 1, evRebate: 1, hpRebate: 1, solarCredit: 0, use: 0 }); }, 'Plans lock in. Anyone who doesn’t finish is played by a stand-in.'],
      [2600, () => advance(), 'The laws are announced, vote by vote.'],
      [11000, () => { go.laws(); draft('A'); }, 'Everyone gets one chance to react to the laws, at today’s prices.'],
      [2600, () => { lock('A'); advance(); }, 'What the class changed.'],
      [3000, () => go.reacted(), 'The years begin. The valley changes with the class’s emissions.'],
      ...years(4, 'A year passes.'),
      [2600, () => { DEMO_POLL = true; render(); }, want === 'gov' || want === 'host' ? 'Each year about 10% of students get a short, optional poll.' : 'A quick poll pops up in the corner. It’s optional.'],
      [2400, () => advance(), 'Year 5: the midterm. Three laws reopen; households make one change; companies trade permits.'],
      [2600, () => { draft('M'); botsVote('MV1', { ...lawsAsVote(C().pol), evRebate: 1 }); botsHouseholds('MA1', { car: 'ev' }); if (SIM.tradingNow(C())) botsMarket(); }, want === 'host' ? 'The projector shows all three at once: the vote count, household changes, and the permit market.' : 'Your midterm move.'],
      [2600, () => { lock('M'); advance(); }, 'The midterm laws.'],
      [6500, () => go.midlaws(), 'The permit market clears at one price.'],
      [3800, () => { if (phase() === 'midtrade') go.midtrade(); }, 'Who changed what at the midterm.'],
      [2600, () => go.midreact(), 'The years continue.'],
      ...years(5, 'A year passes.'),
      [2400, () => { draft('B'); botsBallots('B1', 6); }, 'Year 10: the election. Households and companies vote on the government.'],
      [2600, () => { lock('B'); advance(); }, 'The ballots are counted.'],
      [4200, () => { go.elected(C().logs.elect1.keep); draft('R'); botsVote('V1', { cap: 1, evRebate: 1, hpRebate: 1, solarCredit: 1, use: 0, cleanStd: 1, border: 1, seaWall: 1 }); }, 'Voted out: the government re-votes, with six more bills on the table.'],
      [2600, () => { lock('R'); advance(); }, 'The new laws.'],
      [20500, () => { go.laws(); advance(); go.reacted(); }, 'Everyone adjusts, and the second decade runs.'],
      [3000, () => toEnd(), '2056: where did the class land?'],
    ];
    const bar = document.createElement('div'); bar.className = 'c56-demobar';
    bar.innerHTML = `<span class="c56-demotag">Demo</span><span class="c56-demotxt"></span><span class="c56-demoroles">${[['projector', 'Projector'], ['household', 'Household'], ['company', 'Company'], ['government', 'Government']].map(([k, l]) => `<a href="?demo=1&role=${k}" class="${(DQ.get('role') || 'projector') === k ? 'on' : ''}">${l}</a>`).join('')}</span><button class="c56-dpause" data-dpause>❚❚ Pause</button><a href="${location.search}" class="c56-replay">↻ Replay</a>`;
    root.classList.add('c56-demo');
    root.appendChild(bar);
    const txt = bar.querySelector('.c56-demotxt');
    DEMO_POLL = false;
    let step = 0;
    if (FREEZE >= 0) {
      bar.hidden = true;
      for (let i = 0; i <= Math.min(FREEZE, S.length - 1); i++) { try { S[i][1](); } catch (e) { console.error(e); } }
      return;
    }
    root.classList.add('c56-demobarOn');
    // each step stays up long enough to read its caption and look at the screen: 2.6x the old gap, and never
    // less than ~2.6 s plus 70 ms a character. The Pause button stops the clock between steps.
    const dwell = i => Math.max((S[i + 1] ? S[i + 1][0] : 6000) * 2.6, 2600 + 70 * S[i][2].length);
    let left = 1200, paused = false;
    const pb = bar.querySelector('[data-dpause]');
    pb.onclick = () => { paused = !paused; pb.textContent = paused ? '▶ Play' : '❚❚ Pause'; };
    const iv = setInterval(() => {
      if (paused || (left -= 100) > 0) return;
      if (step >= S.length) { clearInterval(iv); pb.hidden = true; return; }

      left = dwell(i);
    }, 100);
  }

  // a handle for testing from the console
  window.__c56 = { SIM, RUN, state: () => state, members, classNow, PK, pollees, pollQ, POLLS };

  // ═════════════ connect ═════════════
  RUN.live({ visible: () => isOn('run') });
  RUN.enter();
  VALLEY.setVisible && VALLEY.setVisible(() => isOn('run'));
  window.__deckLiveReady.then(live => {
    backend = live.backend; HOST = live.HOST;
    const demo = DEMO && backend.kind === 'local';          // never script a class on the real database

    if (demo) {    // a private game per demo page (two demo tabs must not talk), and the leftovers of earlier demos cleared
      try { Object.keys(localStorage).filter(k => k.startsWith('iv:polls:' + GID + '-') || k.startsWith('c56:' + GID + '-')).forEach(k => localStorage.removeItem(k)); } catch (e) { }

      if (mode !== subMode) return;
      d = d || {};
      if (mode === 'full') keepPlayers = d.players || {}; else d.players = { ...keepPlayers, ...(d.players || {}) };
      const was = gid(); state = d;
      if (gid() !== was) { cMemo = { sig: '', C: null }; lastBuilderSig = govSig = ballotSig = ovSig = tradeSig = ''; lastYear = -1; }

      const m = wantMode(); if (m !== subMode) listen(m);
    }

      if (unsub) { try { unsub(); } catch (e) { } }

      unsub = (m === 'main' ? backend.subscribeMain : backend.subscribeDoc).call(backend, 'polls', GID, d => onSnap(m, d));

  });
})();

<script>
// A game slide's inline script runs BEFORE this one (slides are emitted above the
// shared script tag), so whichever gets there first creates the promise and the
// other reuses it. POLL_JS resolves it once the live backend is ready.
if(!window.__deckLiveReady){
  window.__deckLiveReady = new Promise(function(res){ window.__deckLiveResolve = res; });
}
const slides = Array.from(document.querySelectorAll('.slide'));
let cur = 0;
const progress = document.getElementById('progress');
const counter  = document.getElementById('counter');
const menu = document.getElementById('menu');

// ── staged reveals ─────────────────────────────────────────────────────────
// A slide can hold .stage-item elements that the clicker uncovers one at a
// time before moving on. Slides without them are unaffected.
function stageItems(s){ return Array.prototype.slice.call(s.querySelectorAll('.stage-item')); }
function stageShown(s){ return stageItems(s).filter(function(e){ return e.classList.contains('shown'); }).length; }
function setStage(s, n){ stageItems(s).forEach(function(e, i){ e.classList.toggle('shown', i < n); }); }

function hydrate(i){
  if(i < 0 || i >= slides.length) return;
  slides[i].querySelectorAll('img[data-src]').forEach(function(im){
    im.src = im.getAttribute('data-src'); im.removeAttribute('data-src');
  });
}
function show(i, back){
  i = Math.max(0, Math.min(slides.length-1, i));
  slides[cur].classList.remove('active');
  cur = i;
  const s = slides[cur];
  s.classList.add('active');
  const f = s.querySelector('iframe[data-src]');
  if(f && !f.src){ f.src = f.getAttribute('data-src'); }
  // photos arrive with their slide, plus the neighbours so paging stays instant.
  // Every slide is stacked at inset:0, so loading="lazy" alone would still fetch
  // the whole deck's images on load — 23 MB on a phone, for one slide.
  hydrate(cur); hydrate(cur+1); hydrate(cur-1);
  // arriving forward starts a staged slide covered; stepping back into one
  // shows everything, so you don't have to click through it again
  const st = stageItems(s);
  if(st.length){ setStage(s, back ? st.length : 0); }
  progress.style.width = ((cur+1)/slides.length*100)+'%';
  var ac = (getComputedStyle(s).getPropertyValue('--accent') || '').trim();
  progress.style.background = ac || 'var(--green-light)';
  counter.textContent = (cur+1)+' / '+slides.length;
  location.hash = 'slide-'+(cur+1);
}
// A bespoke slide may claim a clicker press by defining s.__deckNext / s.__deckPrev
// and returning true (e.g. a host-run game that reveals and advances on the clicker).
// Slides without them are unaffected.
function next(){
  const s = slides[cur], n = stageItems(s).length;
  if(typeof s.__deckNext === 'function' && s.__deckNext()) return;
  if(n){ const k = stageShown(s); if(k < n){ setStage(s, k + 1); return; } }
  show(cur+1);
}
function prev(){
  const s = slides[cur];
  if(typeof s.__deckPrev === 'function' && s.__deckPrev()) return;
  if(stageItems(s).length){ const k = stageShown(s); if(k > 0){ setStage(s, k - 1); return; } }
  show(cur-1, true);
}

document.addEventListener('keydown', e=>{
  if(menu.classList.contains('open')){ if(e.key==='Escape') toggleMenu(false); return; }
  switch(e.key){
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); next(); break;
    case 'ArrowLeft':  case 'PageUp': e.preventDefault(); prev(); break;
    case 'Home': show(0); break;
    case 'End': show(slides.length-1); break;
    case 'f': case 'F': toggleFs(); break;
    case 'o': case 'O': toggleMenu(); break;
  }
});
function toggleFs(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } }
function toggleMenu(force){ const open = force===undefined ? !menu.classList.contains('open') : force; menu.classList.toggle('open', open); }
document.querySelectorAll('.menu-item').forEach(b=> b.addEventListener('click', ()=>{ show(+b.dataset.go); toggleMenu(false); }));

const m = (location.hash||'').match(/slide-(\d+)/);
const start = m ? (+m[1]-1) : 0;
