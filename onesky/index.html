  // Doc in 'polls': { pv:1, phase:'idle'|'shop'|'run', year, gameId,
  //   players:{pk:lockTs}, buys:{pk:bitmask} }. Net savings are computed on
  //   every client from buys + year; homes auto-named "Home N" by lock order.
  const PB_UP=[
    {name:'LED lighting',           cost:120,  save:65},
    {name:'Smart power strips',     cost:90,   save:55},
    {name:'Smart thermostat',       cost:160,  save:95},
    {name:'Attic insulation',       cost:650,  save:210},
    {name:'Heat-pump water heater', cost:780,  save:175},
    {name:'Rooftop solar (small)',  cost:1500, save:310}];
  const PB_FMT = n => (n<0?'−$':'$')+Math.round(Math.abs(n)).toLocaleString('en-US');
  paybacks.forEach(function(sec){
    const id=sec.dataset.pbId;
    const BUDGET=parseInt(sec.dataset.pbBudget,10)||2000;
    const el=s=>sec.querySelector(s);
    const openBtn=el('[data-pb-open]'), clockBtn=el('[data-pb-clock]'), yearBtn=el('[data-pb-year]'), newBtn=el('[data-pb-new]'),
      statusEl=el('[data-pb-status]'), shop=el('[data-pb-shop]'),
      cards=Array.from(sec.querySelectorAll('.pb-card')),
      bfill=el('[data-pb-bfill]'), btxt=el('[data-pb-btxt]'), lockBtn=el('[data-pb-lock]'),
      meEl=el('[data-pb-me]'), board=el('[data-pb-board]'), boardTitle=el('[data-pb-boardtitle]'), boardRows=el('[data-pb-boardrows]'),
      yearCard=el('[data-pb-yearcard]'), yearNum=el('[data-pb-yearnum]'),
      chartWrap=el('[data-pb-chartwrap]'), chartTitle=el('[data-pb-charttitle]'), chart=el('[data-pb-chart]'),
      pop=el('[data-pb-pop]'), popRows=el('[data-pb-poprows]'), homeLbl=el('[data-pb-home]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });
    if(HOST) sec.classList.add('host');

    let pk=localStorage.getItem('pb-pk:'+id);
    if(!pk){ pk='p'+Math.random().toString(36).slice(2,10); localStorage.setItem('pb-pk:'+id, pk); }

    let state={phase:'idle'}, nameMap={}, myMask=0, lockedMask=null;
    try{ const s=JSON.parse(localStorage.getItem('pb-done:'+id)); if(s&&s.g&&s.m!==undefined){ lockedMask=s; } }catch(e){}
    const players=()=>state.players||{}, buys=()=>state.buys||{};
    const N=()=>Object.keys(players()).length;
    const Y=()=>state.year||0;
    const lockedIn=()=> lockedMask && lockedMask.g===state.gameId;
    function rebuildNames(){ const ks=Object.keys(players()).sort((a,b)=>(players()[a]-players()[b])||(a<b?-1:1));
      nameMap={}; ks.forEach((k,i)=>nameMap[k]='Home '+(i+1)); }
    const nameOf=k=>nameMap[k]||'Home ?';
    const maskCost=m=>PB_UP.reduce((a,u,i)=>a+((m>>i)&1?u.cost:0),0);
    const maskSave=m=>PB_UP.reduce((a,u,i)=>a+((m>>i)&1?u.save:0),0);
    const netAt=(m,y)=> y*maskSave(m)-maskCost(m);

    // ---------- house rendering ----------
    function paintHouse(mask){
      for(let i=0;i<6;i++){
        const g=sec.querySelector('[data-pb-f'+i+']');
        if(g) g.classList.toggle('own', ((mask>>i)&1)===1);
      }
      // little state details
      const on=i=>((mask>>i)&1)===1;
      const bulb=el('[data-pb-bulb]'); if(bulb) bulb.setAttribute('fill', on(0)?'#fff7c9':'#ffd34e');
      const standby=el('[data-pb-standby]'); if(standby) standby.setAttribute('fill', on(1)?'#63d471':'#ff5f56');
      const vamp=el('[data-pb-vamp]'); if(vamp) vamp.style.opacity = on(1)?0:1;
      const strip=el('[data-pb-strip]'); if(strip) strip.setAttribute('fill', on(1)?'#2D6A4F':'#b9c3bd');
      const tt=el('[data-pb-thermtxt]'); if(tt) tt.textContent = on(2)?'ECO':'68°';
    }
    function updateShop(){
      const spent=maskCost(myMask);
      cards.forEach(function(c,i){
        const on=((myMask>>i)&1)===1;
        c.classList.toggle('on', on);
        const cant=!on && spent+PB_UP[i].cost>BUDGET;
        c.classList.toggle('cant', cant);
      });
      bfill.style.width=Math.min(100, spent/BUDGET*100)+'%';
      bfill.classList.toggle('over', spent>BUDGET);
      btxt.textContent='Spent '+PB_FMT(spent)+' of '+PB_FMT(BUDGET)+' · saves '+PB_FMT(maskSave(myMask))+'/yr';
      lockBtn.disabled = lockedIn() || myMask===0;
      lockBtn.textContent = lockedIn() ? 'Locked in ✓' : 'Lock in my home';
      paintHouse(myMask);
    }
    function toggleUp(i){
      if(HOST || state.phase!=='shop' || lockedIn()) return;
      const on=((myMask>>i)&1)===1;
      if(!on && maskCost(myMask)+PB_UP[i].cost>BUDGET) return; // can't afford
      myMask ^= (1<<i);
      updateShop();
    }
    cards.forEach((c,i)=>c.addEventListener('click', ()=>toggleUp(i)));
    for(let i=0;i<6;i++){ const g=sec.querySelector('[data-pb-f'+i+']');
      if(g) g.addEventListener('click', ()=>toggleUp(i)); }

    // ---------- payback curve (student) ----------
    function drawChart(mask){
      const W=320,H=110,L=30,R=8,T=10,B=18, ymax=Math.max(600, netAt(mask,12)), ymin=Math.min(-400, -maskCost(mask));
      const xs=y=>L+(W-L-R)*y/12, ys=v=>T+(H-T-B)*(1-(v-ymin)/(ymax-ymin));
      let d=''; for(let y=0;y<=12;y++){ d+=(y?' L':'M')+xs(y).toFixed(1)+' '+ys(netAt(mask,y)).toFixed(1); }
      const zero=ys(0);
      const be=maskSave(mask)>0 ? maskCost(mask)/maskSave(mask) : null;
      let s='<line x1="'+L+'" y1="'+zero.toFixed(1)+'" x2="'+(W-R)+'" y2="'+zero.toFixed(1)+'" stroke="#c8d2cc" stroke-width="1.6" stroke-dasharray="4 4"/>';
      s+='<text x="'+(L-4)+'" y="'+(zero+3).toFixed(1)+'" text-anchor="end" font-size="8.5" font-weight="700" fill="#8a958f" font-family="Inter">$0</text>';
      s+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>';
      if(be!==null && be<=12){
        s+='<circle cx="'+xs(be).toFixed(1)+'" cy="'+zero.toFixed(1)+'" r="4.5" fill="#2D6A4F" stroke="#fff" stroke-width="2"/>';
        s+='<text x="'+xs(be).toFixed(1)+'" y="'+(zero-7).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="800" fill="#1d5a40" font-family="Inter">break even · yr '+be.toFixed(1)+'</text>';
      }
      const y=Math.min(12,Y());
      s+='<circle cx="'+xs(y).toFixed(1)+'" cy="'+ys(netAt(mask,y)).toFixed(1)+'" r="5" fill="#BC8A2E" stroke="#fff" stroke-width="2"/>';
      for(let yy=0; yy<=12; yy+=3){ s+='<text x="'+xs(yy).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8a958f" font-family="Inter">yr '+yy+'</text>'; }
      chart.innerHTML=s;
    }

    function render(){
      const ph=state.phase||'idle';
      rebuildNames();
      // host buttons
      if(HOST){
        openBtn.hidden = ph!=='idle';
        clockBtn.hidden = ph!=='shop';
        yearBtn.hidden = !(ph==='run' && Y()<12);
        newBtn.hidden = !(ph==='run'||ph==='shop');
        if(ph==='idle') statusEl.textContent='Open the store once everyone has the deck open.';
        else if(ph==='shop') statusEl.textContent=N()+' home'+(N()===1?'':'s')+' locked in. Start the clock when the class is ready.';
        else statusEl.textContent = Y()<12 ? 'Year '+Y()+' of 12 — advance when ready.' : 'Year 12 — race over. Who chose best?';
      } else {
        if(ph==='idle') statusEl.textContent='Waiting for the instructor to open the store…';
        else if(ph==='shop') statusEl.textContent = lockedIn() ? 'Locked in! Waiting for the clock to start… ('+N()+' homes in)'
          : 'You have '+PB_FMT(BUDGET)+'. Tap upgrades (on the cards OR the house itself), then lock in.';
        else statusEl.textContent = lockedIn() ? 'The clock is running — watch your curve and the leaderboard.'
          : 'The race started without you — watch how the strategies play out!';
      }
      // panels
      shop.hidden = HOST || ph!=='shop';
      if(!shop.hidden) updateShop();
      yearCard.hidden = ph!=='run';
      yearNum.textContent=Y();
      // student house shows own mask; host house shows the most popular combo
      if(!HOST && lockedIn()){ myMask=lockedMask.m; }
      if(HOST){
        let agg=0; const bs=buys();
        for(let i=0;i<6;i++){ let c=0; Object.keys(bs).forEach(k=>{ if((bs[k]>>i)&1) c++; });
          if(N()>0 && c>=N()/2) agg|=(1<<i); }
        paintHouse(agg); homeLbl.textContent='the median home';
      } else { paintHouse(myMask); homeLbl.textContent = lockedIn()||ph!=='run' ? 'My home' : 'My home (spectating)'; }
      // me line + chart
      if(!HOST && lockedIn() && ph==='run'){
        meEl.hidden=false;
        const n=netAt(myMask,Y());
        meEl.innerHTML='🏠 Year '+Y()+': your upgrades have netted <strong class="'+(n>=0?'pos':'neg')+'">'+PB_FMT(n)+'</strong>'
          +(n<0?' — still paying off the up-front cost…':' — pure savings from here!');
        chartWrap.hidden=false; drawChart(myMask);
      } else { meEl.hidden=true; chartWrap.hidden = !(!HOST && lockedIn() && ph==='shop') ; if(!HOST && lockedIn() && ph==='shop'){ chartWrap.hidden=false; drawChart(myMask); } }
      // leaderboard (run phase, everyone)
      const showBoard = ph==='run' && N()>0;
      board.hidden=!showBoard;
      if(showBoard){
        boardTitle.textContent='Leaderboard — net savings after year '+Y();
        const rows=Object.keys(players()).map(k=>({k:k, name:nameOf(k), net:netAt(buys()[k]||0, Y())}));
        rows.sort((a,b)=> b.net-a.net || (a.name<b.name?-1:1));
        const row=(r,i)=>'<div class="pb-brow'+(r.k===pk?' me':'')+'"><span class="rk">'+(i+1)+'.</span>'
          +'<span class="nm">'+r.name+'</span><span class="er '+(r.net>=0?'pos':'neg')+'">'+PB_FMT(r.net)+'</span></div>';
        let html; if(rows.length<=12) html=rows.map(row).join('');
        else{ html=rows.slice(0,10).map(row).join('');
          const mi=rows.findIndex(x=>x.k===pk); if(mi>=10) html+=row(rows[mi],mi);
          const more=rows.length-10-(mi>=10?1:0); if(more>0) html+='<div class="pb-brow"><span class="nm" style="color:var(--muted)">…and '+more+' more homes</span></div>'; }
        boardRows.innerHTML=html;
      }
      // popularity (host, shop+run)
      const showPop = HOST && N()>0;
      pop.hidden=!showPop;
      if(showPop){
        const bs=buys();
        popRows.innerHTML=PB_UP.map(function(u,i){
          let c=0; Object.keys(bs).forEach(k=>{ if((bs[k]>>i)&1) c++; });
          const p=N()?Math.round(c/N()*100):0;
          return '<div class="pb-prow"><span class="pn">'+u.name+'</span><div class="pbar"><div class="pfill" style="width:'+p+'%"></div></div><span class="pv">'+p+'%</span></div>';
        }).join('');
      }
    }

    if(HOST){
      openBtn.addEventListener('click', function(){
        backend.setDoc('polls', id, {pv:1, phase:'shop', year:0, gameId:Date.now(), players:{}, buys:{}});
      });
      clockBtn.addEventListener('click', function(){
        if(state.phase==='shop'){ if(N()===0 && !confirm('No homes locked in yet. Start anyway?')) return;
          backend.mergeDoc('polls', id, {phase:'run', year:0}); }
      });
      yearBtn.addEventListener('click', function(){
        if(state.phase==='run' && Y()<12) backend.mergeDoc('polls', id, {year:backend.inc(1)});
      });
      newBtn.addEventListener('click', function(){
        if(confirm('Start a new race? This clears everyone.'))
          backend.setDoc('polls', id, {pv:1, phase:'shop', year:0, gameId:Date.now(), players:{}, buys:{}});
      });
    } else {
      lockBtn.addEventListener('click', function(){
        if(state.phase!=='shop' || lockedIn() || myMask===0) return;
        lockedMask={g:state.gameId, m:myMask};
        localStorage.setItem('pb-done:'+id, JSON.stringify(lockedMask));
        backend.mergeDocShard('polls', id, {players:{[pk]:Date.now()}, buys:{[pk]:myMask}});
        render();
      });
    }
    backend.subscribeDoc('polls', id, function(d){
      state=(d&&d.pv===1)?d:{phase:'idle'};
      if(!HOST && !lockedIn() && state.phase!=='shop') myMask=0;
      render();
    });
  });

  // ---- wire each before/after re-vote (shift) -------------------------------
  // Two docs in 'polls' per base id: <id>_pre and <id>_post. Each holds sharded
  // counts keyed "<stmtIdx>_<0..100>" + a released flag on the main doc. The
  // 'post' slide ALSO subscribes to <id>_pre (read-only) to draw the before
  // ghost + movement arrow.
  const SH_MAXSTACK=6;
  shifts.forEach(function(sec){
    const base=sec.dataset.shId, phase=sec.dataset.shPhase;
    const NST=parseInt(sec.dataset.shN,10)||1;
    const LEFT=sec.dataset.shLeft, RIGHT=sec.dataset.shRight;
    const selfId=base+'_'+phase, preId=base+'_pre';
    const ranges=Array.from(sec.querySelectorAll('.sh-range'));
    const studentBox=sec.querySelector('[data-sh-student]');
    const resultsBox=sec.querySelector('[data-sh-results]');
    const submitBtn=sec.querySelector('[data-sh-submit]');
    const totalEl=sec.querySelector('[data-sh-total]');
    const hintEl=sec.querySelector('[data-sh-hint]');
    const revealBtn=sec.querySelector('[data-sh-reveal]');
    const resetBtn=sec.querySelector('[data-sh-reset]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    const doneKey='sh-done:'+selfId;
    let mine=null; try{ mine=JSON.parse(localStorage.getItem(doneKey)); }catch(e){ mine=null; }
    let selfState={}, preState={};

    // aggregate a doc's counts into per-statement {n, mean, bins:[[v,cnt]]}
    function agg(counts){
      const out=[]; for(let i=0;i<NST;i++) out.push({n:0, sum:0, vals:[]});
      Object.keys(counts||{}).forEach(function(k){
        const m=k.match(/^(\d+)_(\d+)$/); if(!m) return;
        const i=+m[1], v=+m[2], c=counts[k]||0;
        if(i>=NST||v<0||v>100||c<=0) return;
        out[i].n+=c; out[i].sum+=v*c; out[i].vals.push([v,c]);
      });
      out.forEach(o=>{ o.mean = o.n? o.sum/o.n : null; });
      return out;
    }
    function meanLabel(mean){
      if(mean===null) return '';
      if(mean<38) return 'leans '+LEFT; if(mean>62) return 'leans '+RIGHT; return 'split';
    }

    function renderResults(){
      const released=!!selfState.released;
      const self=agg(selfState.counts||{});
      const pre = phase==='post' ? agg(preState.counts||{}) : null;
      totalEl.textContent = self[0]?self[0].n:0;
      resultsBox.hidden = !(HOST ? released : (released && true));
      // students see results only after release; before release they keep sliders
      if(!HOST){ studentBox.hidden = released || mine!==null ? true : false;
        if(mine!==null && !released){ /* locked, waiting */ } }
      if(!released){ return; }
      for(let i=0;i<NST;i++){
        const cat=self[i], dotsEl=sec.querySelector('[data-sh-dots="'+i+'"]');
        const meanEl=sec.querySelector('[data-sh-mean="'+i+'"]');
        const statEl=sec.querySelector('[data-sh-stat="'+i+'"]');
        // dots (auto-scaled)
        let maxCnt=0; cat.vals.forEach(e=>{ if(e[1]>maxCnt) maxCnt=e[1]; });
        const k=Math.max(1, Math.ceil(maxCnt/SH_MAXSTACK));
        let dh='';
        cat.vals.forEach(function(e){ const v=e[0], c=e[1], full=Math.floor(c/k), rem=c%k;
          for(let j=0;j<full;j++) dh+='<span class="sh-dot" style="left:'+v+'%; bottom:'+(j*10)+'px"></span>';
          if(rem>0) dh+='<span class="sh-dot part" style="left:'+v+'%; bottom:'+(full*10)+'px"></span>';
        });
        dotsEl.innerHTML=dh;
        if(cat.n){ meanEl.hidden=false; meanEl.style.left=cat.mean+'%';
          sec.querySelector('[data-sh-meanlbl="'+i+'"]').textContent=Math.round(cat.mean); }
        else meanEl.hidden=true;
        let st = cat.n ? ('n='+cat.n+' · avg '+Math.round(cat.mean)+'/100 · '+meanLabel(cat.mean)) : 'no responses';
        statEl.textContent=st;
        // ghost + arrow + delta (post only)
        const ghostEl=sec.querySelector('[data-sh-ghost="'+i+'"]');
        const arrowEl=sec.querySelector('[data-sh-arrow="'+i+'"]');
        const deltaEl=sec.querySelector('[data-sh-delta="'+i+'"]');
        if(phase==='post' && pre && pre[i].n && cat.n){
          const p=pre[i].mean, q=cat.mean, d=q-p;
          ghostEl.hidden=false; ghostEl.style.left=p+'%';
          const lo=Math.min(p,q), hi=Math.max(p,q);
          arrowEl.hidden = Math.abs(d)<0.6;
          arrowEl.style.left=lo+'%'; arrowEl.style.width=(hi-lo)+'%';
          arrowEl.className='sh-arrow '+(d>0?'right better':'left worse');
          // right = toward RIGHT pole; for "worry" statements RIGHT=Disagree=good(green)
          deltaEl.hidden=false;
          if(Math.abs(d)<2){ deltaEl.className='sh-delta flat'; deltaEl.textContent='↔ barely moved ('+(d>=0?'+':'')+Math.round(d)+')'; }
          else { deltaEl.className='sh-delta '+(d>0?'better':'worse');
            deltaEl.textContent=(d>0?'→ ':'← ')+'moved '+Math.abs(Math.round(d))+' pts toward '+(d>0?RIGHT:LEFT); }
        } else if(phase==='post'){ ghostEl.hidden=true; arrowEl.hidden=true; deltaEl.hidden=true; }
      }
    }

    function render(){
      const released=!!selfState.released;
      if(HOST){
        sec.classList.add('host');
        studentBox.hidden=true; resultsBox.hidden=false;
        revealBtn.hidden=false; revealBtn.textContent=released?'Hide results':'Reveal results';
        resetBtn.hidden=false;
        const n=agg(selfState.counts||{})[0]; totalEl.textContent=n?n.n:0;
        hintEl.textContent=released?'Results are on every screen.'
          :((n?n.n:0)+' response'+((n?n.n:0)===1?'':'s')+' in — reveal when the class is ready.');
      } else {
        if(mine!==null){ studentBox.hidden = true; }
        hintEl.textContent = released ? 'Here’s where the class landed.'
          : (mine!==null ? 'Locked in — results stay hidden until your instructor reveals them.'
                         : 'Set each slider, then lock in your responses.');
      }
      renderResults();
    }

    if(HOST){
      revealBtn.addEventListener('click', function(){ backend.mergeDoc('polls', selfId, {released:!selfState.released}); });
      resetBtn.addEventListener('click', function(){ if(confirm('Reset the '+phase+' responses for this question?')) backend.reset('polls', selfId); });
    } else {
      if(mine!==null){ ranges.forEach((r,i)=>{ r.value=mine[i]; r.disabled=true; }); }
      submitBtn.addEventListener('click', function(){
        if(mine!==null) return;
        mine=ranges.map(r=>Math.max(0,Math.min(100, parseInt(r.value,10)||0)));
        localStorage.setItem(doneKey, JSON.stringify(mine));
        const upd={counts:{}}; mine.forEach((v,i)=>{ upd.counts[i+'_'+v]=backend.inc(1); });
        backend.mergeDocShard('polls', selfId, upd);
        ranges.forEach(r=>r.disabled=true); submitBtn.disabled=true; submitBtn.textContent='Locked in ✓';
        studentBox.hidden=true; render();
      });
    }
    backend.subscribeDoc('polls', selfId, function(d){ selfState=d||{}; render(); });
    if(phase==='post') backend.subscribeDoc('polls', preId, function(d){ preState=d||{}; render(); });
  });

  // ---- wire live attendance ------------------------------------------------
  // Firestore carries ONLY {open, session, n} — never a name or an email. Student
  // PII is POSTed straight from their browser to the Apps Script endpoint, because
  // the Firestore rules for this project are world-readable.
  attends.forEach(function(sec){
    const id=sec.dataset.atId, CHAPTER=sec.dataset.atChapter;
    const URL_=(window.ATTENDANCE_URL||'').trim();
    // Students submit through a Google Form when one is configured (fast, and
    // Forms does the writing); ATTENDANCE_URL is still what the INSTRUCTOR's
    // "Submit Attendance" calls to mail the roster — one request, no burst.
    const FORM=window.ATTENDANCE_FORM||null;
    const FORM_OK=!!(FORM && FORM.url && FORM.fields && FORM.fields.first
                     && FORM.fields.last && FORM.fields.email);
    const bar=sec.querySelector('[data-at-bar]');
    const openBtn=sec.querySelector('[data-at-open]');
    const finBtn=sec.querySelector('[data-at-finalize]');
    const cancelBtn=sec.querySelector('[data-at-cancel]');
    const statusEl=sec.querySelector('[data-at-status]');
    const selEl=sec.querySelector('[data-at-section]');
    let st={};
    // remember which section was last used on this machine
    if(selEl){
      try{ const sv=localStorage.getItem('att-sec:'+id); if(sv) selEl.value=sv; }catch(e){}
      selEl.addEventListener('change', function(){
        try{ localStorage.setItem('att-sec:'+id, selEl.value); }catch(e){}
      });
    }

    // ---- the student pop-up lives on <body> so it shows over ANY slide ----
    const modal=document.createElement('div');
    modal.className='at-modal'; modal.hidden=true;
    modal.innerHTML=
      '<div class="at-box" role="dialog" aria-modal="true" aria-label="Attendance Information">'+
        '<div data-at-form>'+
          '<div class="at-title">Attendance Information</div>'+
          '<div class="at-chapter" data-at-ch></div>'+
          '<div class="at-section" data-at-sec hidden></div>'+
          '<div class="at-two">'+
            '<label class="at-field"><span class="at-lbl">First name</span>'+
              '<input class="at-input" type="text" data-at-first autocomplete="given-name" '+
              'placeholder="First"></label>'+
            '<label class="at-field"><span class="at-lbl">Last name</span>'+
              '<input class="at-input" type="text" data-at-last autocomplete="family-name" '+
              'placeholder="Last"></label>'+
          '</div>'+
          '<label class="at-field"><span class="at-lbl">ASU email</span>'+
            '<input class="at-input" type="email" data-at-email autocomplete="email" '+
            'placeholder="asurite@asu.edu"></label>'+
          '<button class="at-submit" type="button" data-at-send>Submit</button>'+
          '<div class="at-msg" data-at-msg></div>'+
        '</div>'+
        '<div class="at-done" data-at-done hidden>'+
          '<div class="at-done-tick">&#10003;</div>'+
          '<div class="at-done-txt">Attendance submitted</div>'+
          '<div class="at-done-sub" data-at-donesub></div>'+
          '<button class="at-close" type="button" data-at-close>Close</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(modal);
    modal.querySelector('[data-at-ch]').textContent=CHAPTER;
    const firstEl=modal.querySelector('[data-at-first]');
    const lastEl=modal.querySelector('[data-at-last]');
    const mailEl=modal.querySelector('[data-at-email]');
    const sendBtn=modal.querySelector('[data-at-send]');
    const msgEl=modal.querySelector('[data-at-msg]');
    const formBox=modal.querySelector('[data-at-form]');
    const doneBox=modal.querySelector('[data-at-done]');
    // typing must not drive the deck's arrow/space slide navigation
    modal.addEventListener('keydown', function(e){
      if(navKeys.indexOf(e.key)>-1) e.stopPropagation();
      if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); send(); }
    });
    modal.querySelector('[data-at-close]').addEventListener('click', function(){ modal.hidden=true; });

    const doneKey=function(){ return 'att-done:'+id+':'+(st.session||''); };
    function alreadyDone(){ try{ return !!localStorage.getItem(doneKey()); }catch(e){ return false; } }

    function send(){
      if(sendBtn.disabled) return;
      const fn=(firstEl.value||'').trim(), ln=(lastEl.value||'').trim(), em=(mailEl.value||'').trim();
      firstEl.classList.toggle('bad', !fn);
      lastEl.classList.toggle('bad', !ln);
      // must be an ASU address — the part before @ is the ASURITE, which is what
      // Canvas exports as "SIS Login ID", so rosters match without name-guessing
      const emOk=/^[^@\s]+@([\w-]+\.)*asu\.edu$/i.test(em);
      mailEl.classList.toggle('bad', !emOk);
      if(!fn || !ln || !emOk){
        msgEl.className='at-msg err';
        msgEl.textContent = !fn ? 'Please enter your first name.'
                          : !ln ? 'Please enter your last name.'
                                : 'Please use your ASU email address — it must end in @asu.edu.';
        return;
      }
      sendBtn.disabled=true; sendBtn.textContent='Sending…';
      msgEl.className='at-msg'; msgEl.textContent='';
      const payload={action:'record', session:String(st.session||''), chapter:CHAPTER,
                     section:String(st.sec||''), sectionLabel:String(st.secLabel||''),
                     first:fn, last:ln, email:em};
      function finish(warn){
        try{ localStorage.setItem(doneKey(),'1'); }catch(e){}
        backend.mergeDocShard('polls', id, {n: backend.inc(1)});
        modal.querySelector('[data-at-donesub]').textContent = warn ||
          ('Your instructor has you on the roster. A confirmation email follows shortly.');
        formBox.hidden=true; doneBox.hidden=false;
      }
      function fail(msg){
        sendBtn.disabled=false; sendBtn.textContent='Submit';
        msgEl.className='at-msg err'; msgEl.textContent=msg;
      }
      // ---- preferred path: ingest through a Google Form -------------------
      // Google's own infrastructure absorbs the burst, so there is no script
      // lock and no ~10-writes/second ceiling: 350 submissions land in seconds
      // instead of two minutes, and no row can be clobbered because Forms — not
      // code of ours — does the writing.
      //
      // The catch, and it is a real one: Forms sends no CORS headers, so the
      // POST has to go out `no-cors` and the reply is opaque. We can tell that
      // the request left the browser; we can never tell what the server said.
      // Two consequences, both deliberate:
      //   * SPREAD the sends. Load-testing showed a tight burst from one IP
      //     losing ~8% to per-IP rate limiting, while the same 350 spread over
      //     ~20s lost none — and a lecture hall shares a few NATed campus IPs.
      //   * The slide's counter therefore means "submitted", not "saved". Check
      //     it against the sheet; the confirmation email is the real receipt.
      if(FORM_OK){
        const p=new URLSearchParams();
        p.set(FORM.fields.first, fn);
        p.set(FORM.fields.last,  ln);
        p.set(FORM.fields.email, em);
        // the human-readable label ("MWF 9:05 am"), not the internal key — this
        // column is read by a person at the end of the semester. TA routing uses
        // the key, which the instructor's finalize call carries separately.
        if(FORM.fields.section) p.set(FORM.fields.section, String(st.secLabel||st.sec||''));
        if(FORM.fields.session) p.set(FORM.fields.session, String(st.session||''));
        if(FORM.fields.chapter) p.set(FORM.fields.chapter, CHAPTER);
        setTimeout(function(){
          fetch(FORM.url, {method:'POST', mode:'no-cors', body:p})
            .then(function(){ finish(null); })
            .catch(function(){
              fail('Could not reach the attendance form — check your connection and press Submit again.');
            });
        }, Math.random()*(FORM.spreadMs||6000));
        return;
      }

      if(!URL_){ finish('Recorded locally — your instructor has not finished setting up the attendance link yet.'); return; }

      // A roll call is a thundering herd: 300 browsers POST at once and Apps
      // Script only runs ~30 at a time. So spread the first attempt over a few
      // seconds, then back off — and NEVER claim success we have not been told
      // about: the count on the slide has to mean "a row was written".
      const TRIES=5, WAITS=[1500, 3500, 7000, 12000];
      function attempt(k){
        sendBtn.textContent = k===1 ? 'Sending…' : 'Still trying… ('+k+' of '+TRIES+')';
        fetch(URL_, {method:'POST', mode:'cors', redirect:'follow',
                     headers:{'Content-Type':'text/plain;charset=utf-8'},
                     body:JSON.stringify(payload)})
          .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
          .then(function(j){
            if(j && j.ok===true){ finish(null); return; }
            // the server understood us and said no — retrying cannot help
            const e=new Error((j&&j.error)||'rejected'); e.rejected=true; throw e;
          })
          .catch(function(err){
            if(err && err.rejected){
              fail('Not recorded — the attendance server said: '+err.message+'. Please tell your instructor.');
              return;
            }
            if(k<TRIES){ setTimeout(function(){ attempt(k+1); }, WAITS[k-1]+Math.random()*800); return; }
            fail('Could not reach the attendance server after several tries. Please press Submit again.');
          });
      }
      sendBtn.textContent='Sending…';
      setTimeout(function(){ attempt(1); }, Math.random()*4000);
    }
    sendBtn.addEventListener('click', send);

    function render(){
      const open=!!st.open, n=st.n||0;
      const secTxt = st.secLabel ? String(st.secLabel) : '';
      if(HOST){
        bar.hidden=false; modal.hidden=true;
        openBtn.hidden=open; finBtn.hidden=!open; cancelBtn.hidden=!open;
        if(selEl){ selEl.disabled=open; selEl.title = open
          ? 'Locked while this roll call is open — press Submit Attendance or Cancel to change section.'
          : 'Which section this roll call is for'; }
        openBtn.textContent = st.session ? 'Start attendance again' : 'Attendance';
        if(!URL_ && !FORM_OK){
          statusEl.className='an-att-status warn';
          statusEl.textContent='No attendance link set — add window.ATTENDANCE_FORM (or window.ATTENDANCE_URL) to firebase-config.js (see ATTENDANCE-SETUP.md).';
        } else if(FORM_OK && !URL_){
          // collection works; only the end-of-class roster email is missing
          statusEl.className='an-att-status warn';
          statusEl.textContent='Collecting through the form. Add window.ATTENDANCE_URL too if you want the roster emailed when you press Submit Attendance.';
        } else {
          statusEl.className='an-att-status';
          statusEl.innerHTML = open
            ? (secTxt ? '<em>'+secTxt+'</em> &middot; ' : '')+'<strong>'+n+'</strong> submitted &middot; press <em>Submit Attendance</em> when everyone is in.'
            : (st.session ? 'Last roll call'+(secTxt?' ('+secTxt+')':'')+': <strong>'+n+'</strong> student'+(n===1?'':'s')+'. The roster was emailed.'
                          : 'Pick the section, then open a name &amp; email pop-up on every student screen.');
        }
      } else {
        bar.hidden=true;
        const show = open && !alreadyDone();
        const secEl=modal.querySelector('[data-at-sec]');
        secEl.textContent=secTxt; secEl.hidden=!secTxt;
        if(show && modal.hidden){
          formBox.hidden=false; doneBox.hidden=true;
          sendBtn.disabled=false; sendBtn.textContent='Submit';
          msgEl.textContent=''; msgEl.className='at-msg';
          modal.hidden=false;
          setTimeout(function(){ try{ firstEl.focus(); }catch(e){} }, 60);
        } else if(!open && !doneBox.hidden===false){ /* leave a finished card up */ }
        if(!open && formBox.hidden===false) modal.hidden=true;
      }
    }

    if(HOST){
      openBtn.addEventListener('click', function(){
        // new session id + cleared shard counters
        backend.setDoc('polls', id, {open:1, session:String(Date.now()), n:0,
          sec: selEl ? selEl.value : '',
          secLabel: selEl ? (selEl.options[selEl.selectedIndex]||{}).text||'' : ''});
      });
      cancelBtn.addEventListener('click', function(){
        backend.mergeDoc('polls', id, {open:0});
      });
      // optional: wipe the last roll call so the slide is clean for the next class
      const clearBtn=sec.querySelector('[data-at-clear]');
      if(clearBtn){
        clearBtn.hidden=false;
        clearBtn.addEventListener('click', function(){
          if(!confirm('Clear the last roll call from this slide?\n\n(The roster that was emailed is unaffected.)')) return;
          backend.setDoc('polls', id, {open:0, session:'', n:0, sec:'', secLabel:''});
          try{ Object.keys(localStorage).forEach(function(k){
            if(k.indexOf('att-done:'+id+':')===0) localStorage.removeItem(k); }); }catch(e){}
        });
      }
      finBtn.addEventListener('click', function(){
        backend.mergeDoc('polls', id, {open:0});
        if(!URL_){ alert('No attendance link is configured yet — see ATTENDANCE-SETUP.md.'); return; }
        finBtn.disabled=true; finBtn.textContent='Sending roster…';
        fetch(URL_, {method:'POST', mode:'cors', redirect:'follow',
                     headers:{'Content-Type':'text/plain;charset=utf-8'},
                     body:JSON.stringify({action:'finalize', session:String(st.session||''), chapter:CHAPTER,
                       section:String(st.sec||''), sectionLabel:String(st.secLabel||'')})})
          .catch(function(){
            return fetch(URL_, {method:'POST', mode:'no-cors',
                                headers:{'Content-Type':'text/plain;charset=utf-8'},
                                body:JSON.stringify({action:'finalize', session:String(st.session||''), chapter:CHAPTER,
                       section:String(st.sec||''), sectionLabel:String(st.secLabel||'')})});
          })
          .then(function(r){
            finBtn.disabled=false; finBtn.textContent='Submit Attendance';
            if(r && r.json) r.json().then(function(j){
              if(j && typeof j.count==='number'){
                statusEl.className='an-att-status';
                statusEl.innerHTML='Roster emailed &mdash; <strong>'+j.count+'</strong> student'+(j.count===1?'':'s')+'.';
              }
            }).catch(function(){});
          })
          .catch(function(){ finBtn.disabled=false; finBtn.textContent='Submit Attendance';
                             alert('Could not reach the attendance server to send the roster.'); });
      });
    }
    backend.subscribeDoc('polls', id, function(d){ st=d||{}; render(); });
  });

  if(status!=='live') console.info('[interactive] backend =',status,'— add real values to firebase-config.js for cross-device sync.');
})();
</script>
</body>
</html>
