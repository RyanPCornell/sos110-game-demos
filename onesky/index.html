<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Sky: self-running demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15201b; --forest:#1A3C34; --forest-mid:#2D6A4F; --green:#40916C;
  --green-light:#74C69D; --pale:#F0F7F4; --line:#dde7e2; --muted:#5b6b63;
  --gold:#B8860B; --amber:#C9722B; --paper:#ffffff;
  --shadow:0 10px 30px rgba(20,40,30,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* Master type scale. Everything in this stylesheet is sized in rem, so this one
   number makes the whole deck bigger or smaller together. It is set above 100%
   so the text carries to the back of a lecture hall; a deck that runs out of
   room on a dense slide can dial it back with `html{font-size:…}` in its own
   EXTRA_CSS. */
html{font-size:112%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--ink); background:#0c1411; overflow:hidden;
}
.deck{position:fixed; inset:0;}
.slide{
  position:absolute; inset:0; opacity:0; visibility:hidden;
  display:flex; flex-direction:column; justify-content:center;
  background:var(--paper); transition:opacity .35s ease;
}
.slide.active{opacity:1; visibility:visible; z-index:2;}
.slide-inner{
  width:100%; max-width:1440px; margin:0 auto;
  padding:clamp(1.1rem,2.8vh,2.2rem) clamp(1.4rem,3vw,2.6rem);
}
.slide-inner.two-col{display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(1.5rem,3.5vw,3.5rem); align-items:center;}
.slide-inner.one-col,.slide-inner.col{display:flex; flex-direction:column; justify-content:center;}

/* typography */
h1,h2,h3,.heading{font-family:'Merriweather',Georgia,serif;}
.eyebrow{font-size:clamp(.72rem,1.35vw,.92rem); font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--accent,var(--green)); margin-bottom:.7rem;}
.eyebrow::before{content:""; display:inline-block; width:.6em; height:.6em; border-radius:2px;
  background:var(--accent,var(--green)); margin-right:.5em; transform:translateY(.02em);}
.eyebrow.light{color:var(--green-light);}
.eyebrow.light::before{display:none;}
.heading{font-size:clamp(1.5rem,3.4vw,2.5rem); line-height:1.12; color:var(--forest); font-weight:800; margin-bottom:1rem;}
.lead{font-size:clamp(.95rem,1.55vw,1.12rem); line-height:1.5; color:#33453d; margin-bottom:1.1rem; max-width:60ch;}
.lead.center{text-align:center; margin:0 auto 1.6rem;}
.bullets{list-style:none; display:flex; flex-direction:column; gap:.7rem;}
.bullets li{position:relative; padding-left:1.5rem; font-size:clamp(.9rem,1.5vw,1.06rem); line-height:1.45; color:#2c3a34;}
.bullets li::before{content:""; position:absolute; left:0; top:.5em; width:.5rem; height:.5rem;
  border-radius:50%; background:var(--accent,var(--green-light));}
.bullets li strong{color:var(--forest);}
/* works-cited small print (content_slide refs=): sits under the content, set
   small and muted with a hairline rule and a hanging indent, so a real citation
   can appear on the slide without competing with the teaching text */
.refs{margin-top:.9rem; padding-top:.5rem; border-top:1px solid var(--line);}
/* a cited slide carries an extra block, so tighten its rhythm to keep the
   citation above the fold on a 16:9 projector */
.slide.has-refs .bullets{gap:.5rem;}
.slide.has-refs .lead{margin-bottom:.8rem;}
.slide.has-refs .heading{margin-bottom:.75rem;}
.refs p{font-size:clamp(.6rem,.92vw,.72rem); line-height:1.4; color:var(--muted);
  padding-left:1.15em; text-indent:-1.15em; margin-top:.3rem;}
.refs p:first-child{margin-top:0;}
.refs em{font-style:italic;}
/* sub-bullet (authored as "- text"): indented under its parent, a shade smaller,
   hollow marker so the hierarchy reads at projector distance */
.bullets li.sub{padding-left:3rem; font-size:clamp(.82rem,1.32vw,.95rem); color:#48594f;
  margin-top:-.25rem;}
.bullets li.sub::before{left:1.55rem; top:.55em; width:.42rem; height:.42rem;
  background:transparent; border:2px solid var(--accent,var(--green-light));}
/* staged reveal (content_slide staged=True): fade each item in on a clicker
   press. Opacity, not display, so the space is reserved up front and nothing
   reflows as items appear. */
.stage-item{opacity:0; transition:opacity .3s ease;}
.stage-item.shown{opacity:1;}
@media (prefers-reduced-motion:reduce){ .stage-item{transition:none;} }
.note{margin-top:.85rem; padding:.62rem .95rem; background:var(--pale); border-left:3px solid var(--green);
  border-radius:0 8px 8px 0; font-size:clamp(.8rem,1.25vw,.92rem); color:#3a4a43; font-style:italic;}
.col-media{height:100%; display:flex; align-items:center;}
.col-media img{width:100%; height:auto; max-height:74vh; object-fit:cover; border-radius:16px; box-shadow:var(--shadow);}

/* pairs */
.pairs{display:flex; flex-direction:column; gap:.5rem;}
.pair{background:var(--pale); border:1px solid var(--line); border-radius:12px; padding:.62rem .95rem;}
.pair-head{font-weight:700; color:var(--forest); font-size:clamp(.86rem,1.4vw,1rem);}
.pair-desc{font-size:clamp(.8rem,1.3vw,.95rem); color:#3a4a43; line-height:1.4; margin-top:.15rem;}

/* grids */
.grid{display:grid; gap:clamp(.8rem,1.6vw,1.3rem); width:100%;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.gcard{background:var(--paper); border:1px solid var(--line); border-top:4px solid var(--accent,var(--green));
  border-radius:14px; padding:clamp(.9rem,1.8vw,1.4rem); box-shadow:0 4px 14px rgba(20,40,30,.06);}
.gcard-head{font-family:'Merriweather',serif; font-weight:700; color:var(--forest);
  font-size:clamp(.95rem,1.5vw,1.12rem); margin-bottom:.45rem;}
.gcard-desc{font-size:clamp(.82rem,1.3vw,.96rem); line-height:1.45; color:#3a4a43;}
.gcard.img img{width:100%; height:clamp(110px,16vh,170px); object-fit:cover; border-radius:10px; margin-bottom:.7rem;}

/* outline & objectives */
.outline-grid{display:grid; grid-template-columns:1fr 1fr; gap:.7rem 2.2rem; margin-top:1rem;}
.ol-item{display:flex; align-items:center; gap:1rem; padding:.7rem .4rem; border-bottom:1px solid var(--line);}
.ol-num{font-family:'Merriweather',serif; font-weight:800; color:var(--accent,var(--green)); font-size:clamp(1.1rem,2vw,1.5rem); min-width:2.4rem;}
.ol-text{font-size:clamp(.92rem,1.5vw,1.1rem); color:var(--forest); font-weight:600;}
.obj-grid{display:grid; grid-template-columns:1fr 1fr; gap:1rem 2rem; margin-top:1.2rem;}
.obj-item{display:flex; gap:1rem; align-items:flex-start;}
.obj-num{flex:none; width:2.4rem; height:2.4rem; border-radius:50%; background:var(--forest-mid); color:#fff;
  font-family:'Merriweather',serif; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:1.1rem;}
.obj-text{font-size:clamp(.9rem,1.45vw,1.05rem); line-height:1.4; color:#2c3a34; padding-top:.35rem;}

/* quote */
.bigquote{font-family:'Merriweather',serif; font-size:clamp(1.4rem,3vw,2.2rem); line-height:1.25;
  color:var(--forest); font-style:italic; margin-bottom:1.2rem;}
.bigquote cite{display:block; font-size:clamp(.9rem,1.4vw,1.05rem); font-style:normal; color:var(--green);
  font-family:'Inter',sans-serif; font-weight:600; margin-top:.6rem;}

/* footer */
.footer{position:absolute; bottom:1rem; right:1.6rem; font-size:.72rem; color:#9bb0a6;}
.footer.light{color:rgba(255,255,255,.7);}

/* title slides */
.title-slide{justify-content:flex-end;}
img.bleed{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.title-slide img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.title-scrim{position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(10,25,18,.86) 0%, rgba(10,25,18,.55) 50%, rgba(10,25,18,.2) 100%);}
.title-content{position:relative; z-index:2; padding:0 clamp(2.5rem,7vw,6rem) clamp(3rem,9vh,6rem); color:#fff; max-width:60rem;}
.chapter-kicker{font-size:clamp(.9rem,1.6vw,1.1rem); font-weight:700; letter-spacing:.22em; text-transform:uppercase;
  color:var(--green-light); margin-bottom:.6rem;}
.mega{font-size:clamp(4rem,13vw,9rem); line-height:.95; font-weight:900; letter-spacing:-.01em;}
.title-sub{font-family:'Merriweather',serif; font-size:clamp(1.3rem,3.2vw,2.4rem); font-weight:400; margin-top:.4rem; color:#eaf5ef;}
.title-tag{margin-top:1.6rem; font-style:italic; font-size:clamp(1rem,1.9vw,1.4rem); color:var(--green-light);
  border-left:3px solid var(--green-light); padding-left:1rem;}

/* sim slides */
.slide.sim{background:#0e1a15; padding:0;}
.sim-bar{display:flex; align-items:center; justify-content:space-between; gap:1.5rem;
  padding:.9rem clamp(1.2rem,3vw,2.2rem); background:linear-gradient(120deg,#143027,#1d4438); color:#fff;}
.sim-bar-text .eyebrow{margin-bottom:.2rem;}
.sim-title{font-size:clamp(1.15rem,2.4vw,1.8rem); color:#fff; font-weight:800; line-height:1;}
.sim-q{font-size:clamp(.78rem,1.3vw,.95rem); color:#bfe3d3; margin-top:.35rem;}
.sim-open{flex:none; background:var(--green-light); color:#0e1a15; font-weight:700; text-decoration:none;
  padding:.6rem 1.1rem; border-radius:10px; font-size:.85rem; white-space:nowrap; transition:background .15s;}
.sim-open:hover{background:#9fe0c0;}
.sim-note{background:#3a2c12; color:#ffe6b8; font-size:.82rem; padding:.5rem clamp(1.2rem,3vw,2.2rem); line-height:1.4;}
.sim-frame-wrap{flex:1; min-height:0; background:#fff;}
.sim-frame{width:100%; height:100%; border:0; display:block; background:#fff;}

/* embed slides (interactive chart / app under a slim light header) */
.slide.embed{background:#fff; padding:0;}
.embed-head{display:flex; align-items:flex-end; justify-content:space-between; gap:1.5rem;
  padding:.85rem clamp(1.3rem,3vw,2.4rem) .8rem; border-bottom:1px solid var(--line); background:#fff;}
.embed-head .eyebrow{margin-bottom:.25rem;}
.embed-title{font-size:clamp(1.1rem,2.4vw,1.7rem); color:var(--forest); font-weight:800; line-height:1.05;}
.embed-sub{font-size:clamp(.72rem,1.2vw,.86rem); color:var(--muted); margin-top:.3rem; max-width:80ch;}
.embed-open{flex:none; align-self:center; background:var(--accent,var(--green)); color:#fff; font-weight:700;
  text-decoration:none; padding:.5rem 1rem; border-radius:9px; font-size:.82rem; white-space:nowrap;
  transition:filter .15s;}
.embed-open:hover{filter:brightness(1.08);}
.embed-wrap{flex:1; min-height:0; background:#fff;}
.embed-frame{width:100%; height:100%; border:0; display:block; background:#fff;}

/* nav chrome */
.nav-btn{position:fixed; top:50%; transform:translateY(-50%); z-index:30;
  width:clamp(40px,5vw,56px); height:clamp(40px,5vw,56px); border-radius:50%;
  border:none; background:rgba(20,40,30,.32); color:#fff; font-size:1.4rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background .15s; backdrop-filter:blur(4px);}
.nav-btn:hover{background:rgba(20,40,30,.6);}
.nav-btn.prev{left:14px;} .nav-btn.next{right:14px;}
.topbar{position:fixed; top:0; left:0; right:0; height:4px; background:rgba(255,255,255,.12); z-index:40;}
.progress{height:100%; background:var(--green-light); width:0; transition:width .3s;}
.hud{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:40;
  display:flex; align-items:center; gap:.5rem; background:rgba(14,26,21,.72); backdrop-filter:blur(6px);
  padding:.4rem .55rem; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.25);}
.hud button{background:none; border:none; color:#dbeee5; cursor:pointer; font-size:.95rem; padding:.3rem .55rem; border-radius:8px; line-height:1;}
.hud button:hover{background:rgba(255,255,255,.12);}
.hud .counter{color:#fff; font-size:.82rem; font-weight:600; min-width:3.2rem; text-align:center; font-variant-numeric:tabular-nums;}

/* menu overlay */
.menu{position:fixed; inset:0; z-index:60; background:rgba(8,16,12,.92); backdrop-filter:blur(8px);
  display:none; padding:clamp(1.5rem,4vh,3rem); overflow:auto;}
.menu.open{display:block;}
.menu h3{color:#fff; font-family:'Merriweather',serif; margin-bottom:1.2rem; font-size:1.3rem;}
.menu-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.5rem; max-width:1100px; margin:0 auto;}
.menu-item{display:flex; align-items:center; gap:.7rem; text-align:left; background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1); color:#e6f3ec; padding:.6rem .8rem; border-radius:10px; cursor:pointer;
  font-size:.86rem; transition:background .15s;}
.menu-item:hover{background:rgba(116,198,157,.22);}
.menu-num{flex:none; width:1.7rem; height:1.7rem; border-radius:6px; background:var(--forest-mid); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700;}
.menu-close{position:fixed; top:18px; right:22px; background:none; border:none; color:#fff; font-size:1.6rem; cursor:pointer; z-index:61;}

/* half-bleed content layout (text left, edge-to-edge image right) */
.bleed-grid{position:absolute; inset:0; display:grid; grid-template-columns:1.04fr .96fr;}
.bleed-text{padding:clamp(1.4rem,4vh,2.8rem) clamp(1.5rem,3.4vw,3.2rem);
  display:flex; flex-direction:column; justify-content:center; min-width:0; overflow:auto;}
.bleed-media{position:relative; overflow:hidden; background:var(--pale);}
.bleed-media::before{content:""; position:absolute; left:0; top:0; bottom:0; width:34px; z-index:3;
  background:linear-gradient(90deg, rgba(20,40,30,.13), transparent); pointer-events:none;}
.bleed-media.cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.bleed-media.contain{display:flex; align-items:center; justify-content:center;
  padding:clamp(1.4rem,3.2vw,3rem); background:linear-gradient(155deg,#eef6f1,#dfeee6);}
.bleed-media.contain img{max-width:100%; max-height:100%; object-fit:contain; background:#fff;
  border-radius:12px; box-shadow:0 10px 30px rgba(20,40,30,.18); padding:6px;}

/* stacked layout (text on top, wide image full-width below) */
.stack-grid{position:absolute; inset:0; display:flex; flex-direction:column;}
.stack-top{display:grid; grid-template-columns:minmax(240px,34%) 1fr;
  gap:clamp(1.2rem,3vw,2.8rem); align-items:start;
  padding:clamp(1.1rem,2.8vh,2rem) clamp(1.6rem,3.4vw,3.4rem) clamp(.7rem,1.6vh,1.1rem);}
.stack-head .heading{margin-bottom:0;}
.stack-body{min-width:0;}
.stack-body .lead{margin-bottom:.7rem;}
.stack-body .bullets{display:block; columns:2; column-gap:1.9rem;}
.stack-body .bullets li{break-inside:avoid; margin-bottom:.5rem;}
.stack-body .pairs{display:block; columns:2; column-gap:1.2rem;}
.stack-body .pairs .pair{break-inside:avoid; margin-bottom:.55rem;}
.stack-body .note{margin-top:.7rem;}
.stack-media{flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center;
  padding:clamp(.7rem,1.8vh,1.2rem) clamp(1.6rem,3.4vw,3.4rem) clamp(2.2rem,4.5vh,3rem);
  background:linear-gradient(180deg,#eef6f1,#dfeee6);}
.stack-media::before{content:""; position:absolute; left:0; right:0; top:0; height:24px; z-index:2;
  background:linear-gradient(180deg,rgba(20,40,30,.11),transparent); pointer-events:none;}
.stack-media.contain img,.stack-media img{max-width:100%; max-height:100%; object-fit:contain;
  background:#fff; border-radius:12px; box-shadow:0 10px 30px rgba(20,40,30,.18); padding:6px;}

/* stat callouts */
.stat-row{display:flex; flex-wrap:wrap; gap:.7rem; margin:.2rem 0 1.1rem;}
.stat-box{flex:1 1 0; min-width:92px; background:#fff; border:1px solid var(--line);
  border-top:3px solid var(--accent,var(--green)); border-radius:12px;
  padding:.6rem .7rem .65rem; box-shadow:0 4px 14px rgba(20,40,30,.06);}
.stat-num{font-family:'Merriweather',serif; font-weight:800; color:var(--accent,var(--forest));
  font-size:clamp(1.35rem,2.9vw,2.1rem); line-height:1;}
.stat-lbl{font-size:clamp(.66rem,1.05vw,.8rem); color:var(--muted); line-height:1.25; margin-top:.3rem;}

@media (max-width:820px){
  .slide-inner.two-col{grid-template-columns:1fr; gap:1.2rem;}
  .col-media{order:-1;} .col-media img{max-height:34vh;}
  .bleed-grid{position:static; display:flex; flex-direction:column; height:100%;}
  .bleed-media{min-height:34vh;} .bleed-media.contain{min-height:30vh;}
  .bleed-media::before{display:none;}
  .stack-grid{position:static;}
  .stack-top{grid-template-columns:1fr; gap:.4rem;}
  .stack-body .bullets,.stack-body .pairs{grid-template-columns:1fr;}
  .stack-media{min-height:34vh;}
  .grid.cols-2{grid-template-columns:1fr;}
  .grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}
  .outline-grid,.obj-grid{grid-template-columns:1fr;}
  .slide{justify-content:flex-start; overflow-y:auto;}
}

.os .os-svg{width:100%;height:auto;display:block}
.os .os-nname{font:800 20px Merriweather,serif;letter-spacing:.2em;fill:#3b3222;paint-order:stroke;stroke:#fbf5e6;stroke-width:4px;stroke-linejoin:round}
.os .os-nepi{font:italic 600 10.5px Merriweather,serif;fill:#5e5340;paint-order:stroke;stroke:#fbf5e6;stroke-width:3px}
.os .os-nl.you .os-nname{fill:#7a5a14}
.os .os-chipt{font:800 9.5px Inter;fill:#3b3222}
.os .os-city{font:italic 700 9.5px Merriweather,serif;fill:#3b3222;paint-order:stroke;stroke:#fbf5e6;stroke-width:3px}
.os .os-sea{font:italic 600 13px Merriweather,serif;fill:#4f7488;letter-spacing:.14em;opacity:.85}
.os .os-cmp{font:800 10px Merriweather,serif;fill:#3b3222}
.os .os-scl{font:700 9px Inter;fill:#3b3222}
.os .os-ceb{font:800 10px Inter;letter-spacing:.24em;fill:#8a6a2f}
.os .os-cyr{font:italic 900 30px Merriweather,serif;fill:#3b3222}
.os .os-cst{font:700 10px Inter;fill:#5e5340}
.os .os-fxl{font:900 11px Inter;letter-spacing:.2em;fill:#a8483f}
.os .os-snow{transform-box:fill-box;transform-origin:50% 0;transform:scale(var(--snow,1));transition:transform 1.2s}
.os .os-flare{animation:osflk .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.os .os-flare.off{display:none}
@keyframes osflk{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
.os .os-nod{animation:osnod 2.2s ease-in-out infinite}
@keyframes osnod{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.os .os-fx{animation:osfx 5s ease-out both}
@keyframes osfx{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.os .os-spin{animation:osspin 2.4s linear infinite}
@keyframes osspin{to{transform:rotate(-360deg)}}
.os .os-ripple{animation:osrip 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes osrip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.os .os-pulse{animation:ospulse 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes ospulse{from{transform:scale(.85)}to{transform:scale(1.1)}}
.os .os-flame{animation:osflame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes osflame{from{transform:scaleY(.75)}to{transform:scaleY(1.15)}}
@media (prefers-reduced-motion:reduce){.os .os-flare,.os .os-nod,.os .os-spin,.os .os-ripple,.os .os-pulse,.os .os-flame{animation:none}}
.os-slide{padding:0;background:#f3ecdc}
.os{--ink:#3b3222;--gold:#8a6a2f;--paper:#fbf5e6;--muted:#5e5340;--red:#a8483f;--grn:#2f7a40;--line:#d9c9a3;
  position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;padding:.55rem clamp(3.6rem,4.6vw,4.6rem) .5rem;color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;
  background:radial-gradient(120% 80% at 50% 0%,#f8f1e0 0%,#efe5cf 70%,#e9dec4 100%)}
.os *{box-sizing:border-box}
.os [hidden]{display:none!important}
.os .os-top{display:flex;align-items:center;gap:14px;min-height:40px}
.os .os-tl{display:flex;align-items:baseline;gap:12px;flex:none}

  <script>(function(){

if(!window.__cg){
/* the deck's shared script may not have run yet — whoever is first creates it */
if(!window.__deckLiveReady){
  window.__deckLiveReady = new Promise(function(res){ window.__deckLiveResolve = res; });
}
window.__cg = (function(){
  /* deterministic [0,1) from a string — every client agrees with no write */
  function rnd(s){
    var h=2166136261;
    for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    h^=h>>>15; h=Math.imul(h,2246822507); h^=h>>>13; h^=h>>>16;
    return (h>>>0)/4294967296;
  }
  function pick(s,n){ return Math.floor(rnd(s)*n)%n; }
  /* a stable per-browser player key, one per game id */
  function pid(gid){
    var k='cg-pid:'+gid, v=null;
    try{ v=localStorage.getItem(k); }catch(e){}
    if(!v){ v=Math.random().toString(36).slice(2,9);
            try{ localStorage.setItem(k,v); }catch(e){} }
    return v;
  }
  function clock(ms){
    if(ms==null) return '';
    var t=Math.max(0,Math.ceil(ms/1000)), m=Math.floor(t/60), s=t%60;
    return m+':'+(s<10?'0':'')+s;
  }
  /* keyboard inside a game must not drive the deck */
  function trapKeys(el){
    var NAV=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','PageUp','PageDown','Home','End'];
    el.addEventListener('keydown', function(e){ if(NAV.indexOf(e.key)>-1) e.stopPropagation(); });
  }
  return {rnd:rnd, pick:pick, pid:pid, clock:clock, trapKeys:trapKeys};
})();

// register of _deck-builder/plate_kit.py (cream paper, rough ink, watercolor washes, gold frame).
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const INK = '#3b3222', GOLD = '#8a6a2f', PAPER = '#fbf5e6';

function rng(seed) {

  // ── the climate: CO2 by its cumulative total; methane, nitrous oxide and aerosols by their levels ──
  // co2 = this year's net CO2 (Gt), ch4 = methane (Mt), n2o = nitrous oxide as a multiple of 2026, so2 = sulfur dioxide (Mt)
  // Warming per tonne of CO2 is the IPCC's TCRE; methane lasts about 12 years, nitrous oxide about 110; aerosols wash out
  // within a year, so cutting coal smoke briefly uncovers warming it was hiding. Coefficients checked against the IPCC
  // pathways in calib_ssp.html.
  const CLIM = { aCH4: .5, aN2O: .1, aAER: .42, lag: 4 };
  function climateStep(C, co2, ch4, n2o, so2) {
    C.cum += co2;
    C.ch4 += (ch4 / C.ch40 - C.ch4) / 11.8;
    C.n2o += (n2o - C.n2o) / 109;
    const aer = CLIM.aAER * (1 - so2 / C.so20), nc = CLIM.aCH4 * (C.ch4 - 1) + CLIM.aN2O * (C.n2o - 1) + aer;
    C.Tnc += (nc - C.Tnc) / CLIM.lag;
    C.Tco2 = TCRE * C.cum; C.Tch4 = CLIM.aCH4 * (C.ch4 - 1); C.Taer = aer;
    C.T = T0 + C.Tco2 + C.Tnc;
  }

  // apply a session's laws to a nation (the clock starts on phase-outs and caps when they pass)
  function enact(C, n, laws) {
    const s = C.nat[n], y = C.year;
    for (const k of Object.keys(laws)) {
      if (laws[k] && !s.laws[k]) { s.since[k] = y; if (k === 'coal') s.coalAt = s.k; if (k === 'cap') s.capBase = s.sect.power + s.sect.industry; }
      if (!laws[k] && s.laws[k]) delete s.since[k];
    }
    s.laws = { ...s.laws, ...laws };
  }

  // ── one year ──
  function step(C) {
    const y = C.year + 1, nat = C.nat, cc = cleanCost(C);
    // two oil-and-gas price shocks: fossil importers pay, the exporter cashes in
    const crisis = ENERGY_CRISES[y] || 0;
    C.gasShock = crisis * 30;
    const rec = { year: y, nat: [], events: [], news: [] };
    // the average carbon price elsewhere (for leakage and tariffs)
    const Pof = s => Math.max(s.laws.tax || 0, s.permit || 0);
    let cleanGen = 0, rdCount = 0, aidPool = 0;
    for (const s of nat) {
      const N = NATIONS[s.i], L = s.laws, t = y - Y0, P = Pof(s);
      s.P = P;
      // ── trend growth, plus the growth effects of policy ──
      const gTrend = lerp(N.g0, N.gEnd, t / 40);
      let gPol = 0;
      // a drilling boom lasts about ten years
      if (L.drill && s.since.drill != null && y - s.since.drill <= 10) gPol += .0008 + (N.id === 'saldaea' ? .0016 : 0);
      // the standard game's growth levers: factories, farmland and roads grow the economy for about ten years
      const boom = k => L[k] && y - (s.since[k] != null ? s.since[k] : Y0) <= 10;
      if (boom('igrow')) gPol += .001;
      if (boom('fexp')) gPol += ['terrasen', 'erid'].includes(N.id) ? .0009 : .0004;
      if (boom('roads')) gPol += .0003;
      s.Ypot *= 1 + gTrend + gPol;
      const scale = s.Ypot / N.gdp;
      // ── electricity: new plants go to whatever is cheapest; laws tilt the race ──
      const D = N.D * Math.pow(scale, .8) * Math.pow(.993, t) * (1 + .25 * s.ev) * (1 + (L.beff >= 2 ? .1 * Math.max(0, 1 - s.bInt) : 0));
      const coalC = 62 + .95 * P - (L.drill ? 8 : 0) - (L.subs ? 12 : 0), gasC = 72 + .42 * P - (L.drill ? 8 : 0) - (L.subs ? 12 : 0) + (C.gasShock || 0);
      const myClean = cleanAt(C, s.c) - (L.solar ? 10 : 0);
      const fos = Math.min(coalC, gasC), sNew = 1 / (1 + Math.exp((myClean - fos) / 8));
      const kNew = 1 / (1 + Math.exp((coalC - gasC) / 6));
      const Dprev = s.D || N.D, add = Math.max(0, D - Dprev * .955), ret = .045;
      let cG = s.c * Dprev * (1 - ret * .3), kG = s.k * Dprev * (1 - ret), gG = s.g * Dprev * (1 - ret);
      const cleanAdd = add * sNew, fosAdd = add - cleanAdd;
      s.cleanAdd = cleanAdd;
      cG += cleanAdd; kG += fosAdd * kNew * (L.drill ? 1.2 : 1); gG += fosAdd * (1 - kNew);
      // public build-out and aid money put up clean plants that push out the dirtiest first
      const buildPct = LI.build.opts[L.build || 0] / 100 + (N.id === 'erid' ? s.aidIn / Math.max(1, s.Y) * .6 : 0);
      if (buildPct > 0) { const extra = D * buildPct * 4.2 * (C.cc0 / cc) ** .5; cG += extra; const fromK = Math.min(kG, extra * .7); kG -= fromK; gG = Math.max(0, gG - (extra - fromK)); }
      // coal phase-out: a straight line to zero over ten years from the vote
      if (L.coal && s.since.coal != null) { const lim = (s.coalAt || s.k) * Math.max(0, 1 - (y - s.since.coal) / 10) * D; if (kG > lim) { const d = kG - lim; kG = lim; cG += d * .75; gG += d * .25; } }
      const tot = cG + kG + gG;
      s.c = Math.min(.96, cG / tot); s.k = kG / tot * (1 - s.c) / Math.max(1e-6, (kG + gG) / tot); s.g = Math.max(0, 1 - s.c - s.k); s.D = D;
      cleanGen += D * s.c;
      // ── cars: an S-curve of electric sales; prices, credits and bans pull it earlier ──
      let mid = N.evMid - (L.ev ? 4 : 0) + (L.roads ? 3 : 0) - P / 45 - (C.X / C.X0 - 1) * .8;
      let sales = 1 / (1 + Math.exp(-(y - mid) / 3.2));
      if (L.gascar && s.since.gascar != null) sales = Math.max(sales, Math.min(1, (y - s.since.gascar) / 8));
      s.evSales = sales; s.ev += (sales - s.ev) / 11;
      // ── industry, buildings, land ──
      s.iInt = Math.max(.2, s.iInt * (1 - (L.igrow ? 0 : .006) - .011 * Math.min(P, 250) / 100 - (L.ieff >= 2 ? .035 : L.ieff ? .012 : 0)));
      s.bInt = Math.max(.15, s.bInt * (1 - (L.bcheap ? 0 : .008) - .008 * Math.min(P, 250) / 100 - (L.beff >= 2 ? .04 : L.beff ? .012 : 0)));
      s.tInt = L.roads ? Math.min(1.3, s.tInt * 1.004) : Math.max(.5, s.tInt * (1 - .004 - (L.transit ? .02 : 0)));
      const landGrow = (['terrasen', 'erid'].includes(N.id) ? .014 : .008) * (L.fexp ? 2 : 1);
      // protecting forests ends the clearing; in the standard game farming's own methane and fertilizer remain unless farms change too
      const floor = L.farm ? .2 : C.mode === 'std' ? .45 : .22;
      s.land = L.forest ? Math.max(floor, s.land * .9) : Math.min(L.fexp ? 2.6 : 2.2, s.land * (1 + landGrow - .02 * Math.min(P, 250) / 100));
      // ── emissions ──
      const sect = {
        power: D * (.95 * s.k + .42 * s.g) * s.fPow,
        transport: N.Gt.transport * Math.pow(scale, .7) * s.tInt * (1 - .88 * s.ev),
        industry: N.Gt.industry * Math.pow(scale, .65) * s.iInt * (L.drill ? 1.06 : 1) * (L.igrow ? 1.08 : 1),
        buildings: N.Gt.buildings * Math.pow(scale, .5) * s.bInt,
        land: N.Gt.land * s.land,
      };
      // cap-and-trade: power + industry may not exceed the cap; the permit price is what it takes
      if (L.cap && s.since.cap != null) {
        const cap = s.capBase * Math.pow(.955, y - s.since.cap), cov = sect.power + sect.industry;
        if (cov > cap) { const f = cap / cov; sect.power *= f; sect.industry *= f; s.permit = Math.min(300, Math.round(30 + 420 * (1 / f - 1))); }
        else s.permit = Math.max(5, Math.round(s.permit * .8));
      } else s.permit = 0;
      s.sect = sect;
      // carbon removal: replanted forests (cheap, limited) and machines (costly), both ramping up over about ten years
      const ramp = k => s.since[k] != null ? Math.min(1, (y - s.since[k]) / 10) : 0;
      s.removal = (L.refor ? .009 * s.Ypot * ramp('refor') : 0) + (L.dac ? .03 * s.Ypot * ramp('dac') : 0);
      s.emis = SECTORS.reduce((a, k) => a + sect[k], 0) - s.removal;
      // ── the other pollutants ──
      const X0 = NONCO2[s.i], b = s.base, ramp2 = k => s.since[k] != null ? Math.min(1, (y - s.since[k]) / 8) : 0;
      const rCoal = D * s.k / b.coalGen, rGas = (D * s.g / 1000 + sect.buildings + sect.transport) / b.gasUse;
      const og = N.id === 'saldaea' ? X0.og * (.82 * (C.fossilR || 1) + .18 * rGas) : X0.og * rGas;
      const ag = X0.ag * Math.pow(scale, .25) * (L.fexp ? 1 + .2 * ramp2('fexp') : 1) * (L.farm ? 1 - .35 * ramp2('farm') : 1) * (1 - .0006 * Math.min(P, 250));
      s.ch4 = X0.coal * rCoal + og * (L.drill ? 1.15 : 1) + ag + X0.waste * Math.pow(.995, t) * (s.pop / N.pop);
      s.agR = ag / X0.ag;
      s.so2 = X0.so2 * (.5 * rCoal + .3 * sect.industry / b.ind + .2 * sect.transport / b.tr) * Math.pow(N.id === 'cairhien' ? .98 : .985, t);
      if (L.rd) rdCount++;
      if (L.aid && N.id !== 'erid') aidPool += s.Y * .005;
    }
    // leakage: industry leaves a nation that prices carbon far above its neighbors (unless it has a border tariff)
    const avgP = nat.reduce((a, s) => a + s.P, 0) / 5;
    // ── the shared atmosphere ──
    const worldE = nat.reduce((a, s) => a + s.emis, 0) + C.permafrost;
    const ch4 = nat.reduce((a, s) => a + s.ch4, 0) + CH4_OTHER, so2 = nat.reduce((a, s) => a + s.so2, 0);
    const agR = nat.reduce((a, s) => a + s.agR * NONCO2[s.i].ag, 0) / 150, fosR = fossilUse(C) / C.fossil0;
    climateStep(C, worldE, ch4, .7 * agR + .3 * fosR, so2);
    C.fossilR = fosR;
    C.ppm += .47 * worldE / 7.82;
    C.slr += (3.9 + 1.6 * (C.T - T0) * 4) / 10;          // cm: today's 3.9 mm/yr, rising with warming
    C.X += cleanGen;
    C.rdMult = Math.max(.8, C.rdMult * Math.pow(.997, rdCount));
    // tipping points
    if (C.T > 1.75 && !C.tips.ice) { C.tips.ice = y; rec.news.push(['tip', 'The Arctic has its first ice-free summer']); }
    if (C.T > 1.85 && !C.tips.perma) { C.tips.perma = y; rec.news.push(['tip', 'Saldaea’s permafrost is thawing: the frozen ground now releases its own carbon']); }
    if (C.tips.perma) C.permafrost = Math.min(1.2, C.permafrost + .12);
    if (C.T > 2.0 && !C.tips.reef) { C.tips.reef = y; rec.news.push(['tip', 'Erid’s coral reefs are bleaching beyond recovery; its fisheries collapse']); }
    const fossilNow = fossilUse(C);
    const worldClean = nat.reduce((a, s) => a + s.c * s.D, 0) / nat.reduce((a, s) => a + s.D, 0);
    C.wclean = worldClean;
    // ── each nation's economy: trend, minus damage, minus what its policies cost, plus what they earn ──
    for (const s of nat) {
      const N = NATIONS[s.i], L = s.laws, t = y - Y0;
      // climate damage (DICE-style, relative to today) and this year's disasters
      const adapt = L.adapt ? .6 : L.adaptL ? .8 : 1;
      let dmg = N.vuln / VULN_AVG * DAMAGE[C.dmg] * (C.T * C.T - T0 * T0) * adapt;
      if (N.id === 'saldaea') dmg -= .006 * Math.min(.6, Math.max(0, C.T - T0));       // longer summers, for a while
      if (C.tips.reef && N.id === 'erid') dmg += .003;
      if (C.tips.perma && N.id === 'saldaea') dmg += .002;
      const ev = disasters(C, s, y, adapt);
      s.shock = s.shock * .45 + ev.cost;             // most of a disaster's loss is recovered within a few years
      for (const e of ev.list) rec.events.push(e);
      // what the laws cost (share of GDP, net of the carbon dividend) …
      const intens = (s.emis / s.Y) / (C.world0.E / C.world0.Y), cm = Math.min(1.2, cleanCost(C) / C.cc0);
      let cost = .011 * Math.pow(s.P / 100, 1.45) * Math.min(2, intens) * (.55 + .45 * cm);
      if (L.coal && s.since.coal != null && y - s.since.coal <= 10) cost += .0032 * (s.coalAt || 0) / .4 * (.6 + .4 * cm);
      if (L.gascar) cost += .0016 * Math.max(0, 1 - t / 14);
      if (L.forest) cost += { terrasen: .0028, erid: .0022 }[N.id] || .0008;
      if (L.ev) cost += .0006; if (L.solar) cost += .0005; if (L.rd) cost += .002; if (L.adapt) cost += .004;
      if (L.aid && N.id !== 'erid') cost += .005;
      if (L.build) cost += LI.build.opts[L.build] / 100 * .3 - LI.build.opts[L.build] / 100 * .12;   // paid by taxes, partly back as construction jobs
      if (L.subs) cost -= .0012;
      if (L.drill && s.since.drill != null && y - s.since.drill > 8) cost += .0035 * clamp((worldClean - .45) / .4) * Math.min(1, (y - s.since.drill - 8) / 8);
      // the standard game's levers: what they cost now, and what they save or cost later
      const yrs = k => s.since[k] != null ? y - s.since[k] : 99;
      if (L.igrow && yrs('igrow') > 8) cost += .003 * clamp((worldClean - .45) / .4) * Math.min(1, (yrs('igrow') - 8) / 8);   // old, dirty plants fall behind
      if (L.ieff === 1) cost += yrs('ieff') <= 8 ? .0012 : -.0006;
      if (L.ieff >= 2) cost += .0045 * (.55 + .45 * cm) * Math.max(.35, 1 - yrs('ieff') / 20);
      if (L.farm) cost += ['terrasen', 'erid'].includes(N.id) ? .0018 : .0008;
      if (L.transit) cost += yrs('transit') <= 10 ? .0025 : -.0008;
      if (L.bcheap) cost -= .0006;
      if (L.beff === 1) cost += yrs('beff') <= 10 ? .0006 : -.0005;
      if (L.beff >= 2) cost += yrs('beff') <= 12 ? .0022 : -.001;
      if (L.adaptL) cost += .0018;
      if (L.refor) cost += .0008;
      if (L.dac) cost += .009 * Math.min(1, yrs('dac') / 10);          // about $300 a tonne removed
      // leakage and tariffs
      const gap = s.P - avgP;
      if (gap > 20 && !L.bta) cost += .00005 * gap;
      if (gap < -20) cost -= .00002 * -gap;                       // dirty industry moves in
      if (s.P < 25) cost += .0016 * nat.filter(o => o !== s && o.laws.bta && o.P > s.P + 25).length;
      // … and what cheap clean power earns: electricity cheaper than today's grid raises everyone's output
      const lcoe = s.c * (cleanAt(C, s.c) - (L.solar ? 10 : 0)) + s.k * (62 - (L.subs ? 12 : 0)) + s.g * (72 - (L.subs ? 12 : 0));
      s.lcoe = lcoe;
      if (s.lcoe0 == null) s.lcoe0 = lcoe;
      cost -= .016 * (1 - lcoe / s.lcoe0);
      // a petrostate lives on the world's fossil fuel habit
      let petro = 0;
      if (N.id === 'saldaea') petro = .10 * (1 - fossilNow / C.fossil0) * (1 - .5 * s.c);
      // Erid receives the climate aid
      if (N.id === 'erid') { s.aidIn = aidPool; cost -= aidPool / Math.max(1, s.Y) * .5; s.adaptLvl = Math.min(1, aidPool / Math.max(1, s.Y) / .02); dmg *= 1 - .25 * s.adaptLvl; }
      if (crisis) {
        const fosShare = (s.k * .4 + s.g * .9) * .6 + (1 - s.ev) * .4 * (L.transit ? .7 : 1) + (L.bcheap ? .1 : 0);        // how much of the economy runs on oil and gas
        if (N.id === 'saldaea') cost -= .025 * crisis; else cost += .022 * crisis * fosShare;
      }
      s.cost = cost; s.dmg = dmg;
      // ── life in the nation: what people would notice ──
      // heat: days above 35 °C in the capital, scaled like the IPCC's 10-year hot extremes (illustrative starting counts);
      // harvests: about 5.5% lower per °C of global warming without adaptation (Zhao et al. 2017), less with it, and a bad
      // drought or fire year on top; power bills: the grid's cost plus any carbon price and fuel shock; fuel: pump prices;
      // jobs: work in fossil fuels and in clean energy, as indexes of 2026
      const crisisF = crisis ? 1 : 0, droughtHit = ev.list.filter(e => e.kind === 'drought' || e.kind === 'fire').reduce((a, e) => a + e.sev, 0);
      const life = {
        heat: HEAT_DAYS[s.i] * AR6x('heat10', C.T) / AR6x('heat10', T0),
        crop: 1 - .055 * (C.T - T0) * (L.adapt ? .7 : L.adaptL ? .85 : 1) - droughtHit * 2.5,
        power: 40 + s.lcoe + s.P * (.95 * s.k + .42 * s.g) + (C.gasShock || 0) * s.g,     // + about $40/MWh of wires and service
        fuel: 1 + .8 * crisis + .0018 * s.P - (L.subs ? .15 : 0),
        jobsF: s.D * (s.k + s.g) + 900 * (sect0(s).transport + s.sect.buildings),
        jobsC: s.D * s.c + 8 * (s.cleanAdd || 0),
      };
      if (!s.life0) s.life0 = { ...life };
      s.life = { heat: life.heat, crop: life.crop, power: life.power / s.life0.power, fuel: life.fuel / s.life0.fuel, jobsF: life.jobsF / s.life0.jobsF, jobsC: life.jobsC / s.life0.jobsC };
      void crisisF;
      const Yprev = s.Y;
      s.Y = s.Ypot * (1 - dmg) * (1 - s.shock) * (1 - cost) * (1 - petro);
      s.growth = s.Y / Yprev - 1;
      s.pop *= 1 + ({ erid: .012, terrasen: .007, cairhien: .002, andor: -.001, saldaea: -.002 })[N.id] * (1 - t / 80);
      s.cumE += s.emis;
      rec.nat.push({ life: { ...s.life }, Y: s.Y, gdpPc: s.Y / s.pop, growth: s.growth, emis: s.emis, removal: s.removal || 0, sect: { ...s.sect }, clean: s.c, coal: s.k, ev: s.ev, P: s.P, permit: s.permit,
        dmg: s.dmg, shock: s.shock, cost: s.cost, petro, laws: { ...s.laws } });
    }
    rec.budget = BUDGETS.map(([t, b]) => [t, b - E2025 - C.cum]);
    Object.assign(rec, { Tco2: C.Tco2, Tnc: C.Tnc, Tch4: C.Tch4, Taer: C.Taer, ch4, so2, T: C.T, ppm: C.ppm, worldE, slr: C.slr, cleanCost: cleanCost(C), Y: nat.reduce((a, s) => a + s.Y, 0),
      clean: nat.reduce((a, s) => a + s.c * s.D, 0) / nat.reduce((a, s) => a + s.D, 0),
      dmgShare: nat.reduce((a, s) => a + s.Y * (s.dmg + s.shock), 0) / nat.reduce((a, s) => a + s.Y, 0) });
    if (crisis === 1) rec.news.push(['crisis', 'Oil and gas prices double. Fuel-hungry economies stall; Saldaea’s exports boom']);
    rec.crisis = crisis;
    C.year = y; C.hist.push(rec);
    for (const e of rec.events) rec.news.push(['ev', e.text, e]);
    C.news.push(...rec.news.map(n => [y, ...n]));
    return rec;
  }

  const ENERGY_CRISES = { 2031: 1, 2032: .5, 2047: 1, 2048: .5 };
  // ── disasters: each nation's own kinds, more frequent as it warms ──
  const HAZ = {
    cairhien: [['storm', .10, .012], ['heat', .05, .004], ['flood', .05, .006]],
    andor: [['flood', .09, .008], ['drought', .08, .006], ['heat', .07, .004]],
    saldaea: [['fire', .10, .007], ['heat', .03, .002]],
    terrasen: [['drought', .13, .013], ['fire', .06, .005], ['heat', .08, .006]],
    erid: [['flood', .13, .02], ['storm', .1, .018], ['heat', .12, .01]],
  };
  const HAZT = {
    storm: (N, b) => `A Category ${b > .018 ? 5 : 4} storm strikes ${N.name}`, flood: N => `Record floods swamp ${N.name}`, heat: N => `A deadly heat wave grips ${N.name}`,
    drought: N => `Drought withers ${N.name}’s harvest`, fire: N => `Wildfires sweep across ${N.name}`,
  };
  // how much more often each kind of event happens at a warming level, relative to 1850-1900 (IPCC AR6 WG1, Figure SPM.6):
  // heat = 50-year hot extremes, rain = 10-year heavy rain, drought = 10-year farm droughts in drying regions. Storms:
  // AR6 projects a rising share of the most intense cyclones (about +10% at 1.5 °C, +13% at 2, +20% at 4). Fires: no
  // AR6 figure; they follow drought here (an assumption).
  const AR6 = { lv: [1, 1.5, 2, 4], heat: [4.8, 8.6, 13.9, 39.2], heat10: [2.8, 4.1, 5.6, 9.4], flood: [1.3, 1.5, 1.7, 2.7], drought: [1.7, 2.0, 2.4, 4.1], storm: [1.05, 1.1, 1.13, 1.2] };
  const AR6x = (kind, T) => { const v = AR6[kind] || AR6.drought, L = AR6.lv; if (T <= L[0]) return v[0]; for (let i = 1; i < L.length; i++) if (T <= L[i]) return v[i - 1] + (v[i] - v[i - 1]) * (T - L[i - 1]) / (L[i] - L[i - 1]); return v[v.length - 1] + (v[v.length - 1] - v[v.length - 2]) * (T - 4) / 2; };
  const hazKind = k => k === 'fire' ? 'drought' : k;
  function disasters(C, s, y, adapt) {
    const N = NATIONS[s.i], r = rk(C, 'haz:' + y + ':' + N.id), list = [];
    let cost = 0;
    for (const [k, p, c] of HAZ[N.id]) {
      const f = AR6x(hazKind(k), C.T) / AR6x(hazKind(k), T0);      // today's odds, scaled by how much likelier warming makes it
      if (r() < p * f) {
        const sev = c * (.6 + r() * .9) * (C.T / T0) * (adapt < 1 ? .5 : 1);
        cost += sev;
        list.push({ n: s.i, kind: k, sev, text: HAZT[k](N, sev) + ` · ${(sev * 100).toFixed(1)}% of GDP lost` });
      }
    }
    return { cost: Math.min(.06, cost), list };
  }

  // ── the whole game, replayed from the frozen votes ──
  // I = { seed, assign: {pk: nation}, V: [votes0, votes1, …] }; runs to year `upto` (default: as far as the votes allow)
  function run(I, upto) {
    const C = newWorld(I.seed, I.assign, I.mode, I.dmg);

  // ── what one year looks like ──

      const cRatio = n ? (n.coal / Math.max(.01, N.coal)) * Math.pow(n.Y / N.gdp, .8) : 1;

//   THE TEMPTATION  four worlds for one nation: it acts or goes fossil-first, and so do the other four. Every nation sees

<script>
// A game slide's inline script runs BEFORE this one (slides are emitted above the
// shared script tag), so whichever gets there first creates the promise and the
// other reuses it. POLL_JS resolves it once the live backend is ready.
if(!window.__deckLiveReady){
  window.__deckLiveReady = new Promise(function(res){ window.__deckLiveResolve = res; });
}
const slides = Array.from(document.querySelectorAll('.slide')).filter(s => !s.closest('.sp-pop'));   // slides inside a pop-up are not deck slides
let cur = 0;
const progress = document.getElementById('progress');
const counter  = document.getElementById('counter');
const menu = document.getElementById('menu');

// ── staged reveals ─────────────────────────────────────────────────────────
// A slide can hold .stage-item elements that the clicker uncovers one at a
// time before moving on. Slides without them are unaffected.
function stageItems(s){ return Array.prototype.slice.call(s.querySelectorAll('.stage-item')); }
function stageShown(s){ return stageItems(s).filter(function(e){ return e.classList.contains('shown'); }).length; }
function setStage(s, n){ stageItems(s).forEach(function(e, i){ e.classList.toggle('shown', i < n); }); }

function hydrate(i){
  if(i < 0 || i >= slides.length) return;
  slides[i].querySelectorAll('img[data-src]').forEach(function(im){
    im.src = im.getAttribute('data-src'); im.removeAttribute('data-src');
  });
}
function show(i, back){
  i = Math.max(0, Math.min(slides.length-1, i));
  slides[cur].classList.remove('active');
  cur = i;
  const s = slides[cur];
  s.classList.add('active');
  const f = s.querySelector('iframe[data-src]');
  if(f && !f.src){ f.src = f.getAttribute('data-src'); }
  // photos arrive with their slide, plus the neighbours so paging stays instant.
  // Every slide is stacked at inset:0, so loading="lazy" alone would still fetch
  // the whole deck's images on load — 23 MB on a phone, for one slide.
  hydrate(cur); hydrate(cur+1); hydrate(cur-1);
  // arriving forward starts a staged slide covered; stepping back into one
  // shows everything, so you don't have to click through it again
  const st = stageItems(s);
  if(st.length){ setStage(s, back ? st.length : 0); }
  progress.style.width = ((cur+1)/slides.length*100)+'%';
  var ac = (getComputedStyle(s).getPropertyValue('--accent') || '').trim();
  progress.style.background = ac || 'var(--green-light)';
  counter.textContent = (cur+1)+' / '+slides.length;
  location.hash = 'slide-'+(cur+1);
}
// A bespoke slide may claim a clicker press by defining s.__deckNext / s.__deckPrev
// and returning true (e.g. a host-run game that reveals and advances on the clicker).
// Slides without them are unaffected.
function next(){
  const s = slides[cur], n = stageItems(s).length;
  if(typeof s.__deckNext === 'function' && s.__deckNext()) return;
  if(n){ const k = stageShown(s); if(k < n){ setStage(s, k + 1); return; } }
  show(cur+1);
}
function prev(){
  const s = slides[cur];
  if(typeof s.__deckPrev === 'function' && s.__deckPrev()) return;
  if(stageItems(s).length){ const k = stageShown(s); if(k > 0){ setStage(s, k - 1); return; } }
  show(cur-1, true);
}

document.addEventListener('keydown', e=>{
  if(menu.classList.contains('open')){ if(e.key==='Escape') toggleMenu(false); return; }
  // let focused form fields keep their keys (typing, sliders), and let Space activate a focused button
  const tg = e.target;
  if(tg && tg.closest && tg.closest('input, textarea, select, [contenteditable=""], [contenteditable="true"]')) return;
  if(e.key===' ' && tg && tg.closest && tg.closest('button, [role="button"], a[href]')) return;
  switch(e.key){
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); next(); break;
    case 'ArrowLeft':  case 'PageUp': e.preventDefault(); prev(); break;
    case 'Home': show(0); break;
    case 'End': show(slides.length-1); break;
    case 'f': case 'F': toggleFs(); break;
    case 'o': case 'O': toggleMenu(); break;
  }
});
function toggleFs(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } }
function toggleMenu(force){ const open = force===undefined ? !menu.classList.contains('open') : force; menu.classList.toggle('open', open); }
document.querySelectorAll('.menu-item').forEach(b=> b.addEventListener('click', ()=>{ show(+b.dataset.go); toggleMenu(false); }));

const m = (location.hash||'').match(/slide-(\d+)/);
const start = m ? (+m[1]-1) : 0;
slides.forEach(s=>s.classList.remove('active'));
show(start);

<script>if(new URLSearchParams(location.search).has("demo"))window.FIREBASE_CONFIG={apiKey:"YOUR_API_KEY"};</script>
<script type="module">
(async function(){
  const HOST = new URLSearchParams(location.search).has('host');
  const polls  = Array.from(document.querySelectorAll('.slide.poll:not(.dpoll), .poll-embed'));
  const clouds = Array.from(document.querySelectorAll('.slide.wordcloud'));
  const probpolls = Array.from(document.querySelectorAll('.slide.probpoll'));
  const dpolls = Array.from(document.querySelectorAll('.slide.dpoll'));
  const commons = Array.from(document.querySelectorAll('.slide.commons'));
  const guesses = Array.from(document.querySelectorAll('.slide.guess'));
  const heatmaps = Array.from(document.querySelectorAll('.slide.heatmap'));
  const rankings = Array.from(document.querySelectorAll('.slide.ranking'));
  const spectrums = Array.from(document.querySelectorAll('.slide.spectrum'));
  const dollars = Array.from(document.querySelectorAll('.slide.dollar'));
  const splitdollars = Array.from(document.querySelectorAll('.slide.splitdollar'));
  const endows = Array.from(document.querySelectorAll('.slide.endow'));
  const captrades = Array.from(document.querySelectorAll('.slide.captrade'));
  const inspects = Array.from(document.querySelectorAll('.slide.inspect'));
  const qafeeds = Array.from(document.querySelectorAll('.slide.qa'));
  const gridmixes = Array.from(document.querySelectorAll('.slide.gridmix'));
  const paybacks = Array.from(document.querySelectorAll('.slide.payback'));
  const shifts = Array.from(document.querySelectorAll('.slide.shift'));
  const guessembeds = Array.from(document.querySelectorAll('.guess-embed'));
  const attends = Array.from(document.querySelectorAll('[data-at-id]'));
  const games = Array.from(document.querySelectorAll('[data-game-id]'));  // class_games.py
  if(!polls.length && !clouds.length && !probpolls.length && !dpolls.length && !commons.length
     && !guesses.length && !heatmaps.length && !rankings.length && !spectrums.length && !dollars.length
     && !captrades.length && !qafeeds.length && !gridmixes.length && !paybacks.length && !shifts.length
     && !endows.length && !splitdollars.length && !guessembeds.length && !inspects.length
     && !attends.length && !games.length) return;

  // ---- pick a backend -----------------------------------------------------
  // Simple counts API (poll, wordcloud, dpoll votes): subscribe / bump / reset
  // Full-document API (probpoll, commons):  subscribeDoc / setDoc / mergeDoc /
  //                                          mergeDocShard / inc
  //
  // LARGE-CLASS SHARDING: Firestore sustains ~1 write/s per document, so student
  // writes are spread across NSHARDS shard docs ("<id>__s0".."<id>__s7") — each
  // browser is pinned to one shard. Host/state writes go to the main doc. Every
  // client subscribes to main + all shards and deep-merges them (colliding
  // numeric leaves are SUMMED, which aggregates the per-shard counts; map keys
  // like player ids never collide across shards). setDoc (= new game / reset)
  // rewrites the main doc and clears every shard.
  const NSHARDS = 8;
  const CFG = window.FIREBASE_CONFIG;
  const cfgReal = CFG && CFG.apiKey && CFG.projectId &&
    !String(CFG.apiKey).includes('YOUR_') && !String(CFG.projectId).includes('YOUR_');

  let myShard = parseInt(localStorage.getItem('iv-shard')||'',10);
  if(isNaN(myShard) || myShard<0 || myShard>=NSHARDS){
    myShard = Math.floor(Math.random()*NSHARDS); localStorage.setItem('iv-shard', String(myShard));
  }
  const shardName = (id,k) => id+'__s'+k;
  function mergeInto(a,b){ // deep merge b into a; colliding numeric leaves are summed
    for(const k in b){ const v=b[k];
      if(v && typeof v==='object' && !Array.isArray(v)){
        if(!a[k] || typeof a[k]!=='object') a[k]={};
        mergeInto(a[k], v);
      } else if(typeof v==='number' && typeof a[k]==='number'){ a[k]+=v; }
      else a[k]=v;
    }
    return a;
  }

  function localBackend(){
    // same-origin, cross-tab fallback (also used for preview / offline).
    // Single browser = no contention, so everything lives in one localStorage doc.
    // It also enforces Firestore's no-nested-arrays rule, because a slide tested only
    // in local mode would otherwise ship a payload that Firestore silently rejects.
    const noNested = (v, path, inArr) => {
      if(Array.isArray(v)){
        if(inArr) throw new Error('nested array at '+path+' — Firestore rejects these');
        v.forEach((x,i)=>noNested(x, path+'['+i+']', true));
      } else if(v && typeof v==='object'){
        for(const k in v) noNested(v[k], path?path+'.'+k:k, false);
      }
    };
    const subs = {};                       // 'coll:id' -> [thunk,...]
    const sk = (coll,id) => 'iv:'+coll+':'+id;
    const key = (coll,id) => coll+':'+id;
    const read = (coll,id) => { try{ return JSON.parse(localStorage.getItem(sk(coll,id))||'{}'); }catch(e){ return {}; } };
    const write = (coll,id,d) => { noNested(d, coll+'/'+id, false);
      localStorage.setItem(sk(coll,id), JSON.stringify(d)); };
    const emit = (coll,id) => (subs[key(coll,id)]||[]).forEach(t=>t());
    const on = (coll,id,thunk) => { (subs[key(coll,id)]=subs[key(coll,id)]||[]).push(thunk); thunk(); return ()=>{}; };
    function applyInc(target,obj){
      for(const k in obj){ const v=obj[k];
        if(v && typeof v==='object' && '__inc' in v){ target[k]=(target[k]||0)+v.__inc; }
        else if(v && typeof v==='object' && !Array.isArray(v)){ if(!target[k]||typeof target[k]!=='object') target[k]={}; applyInc(target[k],v); }
        else { target[k]=v; }
      }
      return target;
    }
    window.addEventListener('storage', e=>{
      if(e.key && e.key.indexOf('iv:')===0){ const p=e.key.slice(3), i=p.indexOf(':'); emit(p.slice(0,i), p.slice(i+1)); }
    });
    const merge = (coll,id,obj)=>{ const d=read(coll,id); applyInc(d,obj); write(coll,id,d); emit(coll,id); };
    return {
      kind:'local',
      subscribe(coll,id,cb){ return on(coll,id, ()=>cb(read(coll,id).counts||{})); },
      bump(coll,id,k,delta){ merge(coll,id,{counts:{[k]:{__inc:(delta===undefined?1:delta)}}}); },
      reset(coll,id){ const d=read(coll,id); d.counts={}; write(coll,id,d); emit(coll,id); },
      subscribeDoc(coll,id,cb){ return on(coll,id, ()=>cb(read(coll,id))); },
      subscribeMain(coll,id,cb){ return on(coll,id, ()=>cb(read(coll,id))); },
      setDoc(coll,id,obj){ write(coll,id, applyInc({},obj)); emit(coll,id); },
      mergeDoc:merge,
      mergeDocShard:merge,
      inc(n){ return {__inc:n}; }
    };
  }

  let backend, status;
  if(cfgReal){
    try{
      const [appMod, fsMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js')
      ]);
      const db = fsMod.getFirestore(appMod.initializeApp(CFG));
      const ref = (coll,id) => fsMod.doc(db, coll, id);
      function multiSub(coll,id,cb){
        // subscribe to the main doc + every shard; emit the deep merge
        const parts = new Array(NSHARDS+1).fill(null);
        const emit = ()=>{ const m={}; parts.forEach(p=>{ if(p) mergeInto(m,p); }); cb(m); };
        const unsubs = [fsMod.onSnapshot(ref(coll,id), s=>{ parts[0]=s.data()||{}; emit(); })];
        for(let k=0;k<NSHARDS;k++){
          unsubs.push(fsMod.onSnapshot(ref(coll,shardName(id,k)), s=>{ parts[k+1]=s.data()||{}; emit(); }));
        }
        return ()=>unsubs.forEach(u=>u());
      }
      function resetAll(coll,id,obj){
        const ps=[fsMod.setDoc(ref(coll,id), obj)];
        for(let k=0;k<NSHARDS;k++) ps.push(fsMod.setDoc(ref(coll,shardName(id,k)), {}));
        return Promise.all(ps);
      }
      backend = {
        kind:'firestore',
        subscribe(coll,id,cb){ return multiSub(coll,id, m=>cb(m.counts||{})); },
        bump(coll,id,key,delta){ return fsMod.setDoc(ref(coll,shardName(id,myShard)), {counts:{[key]:fsMod.increment(delta===undefined?1:delta)}}, {merge:true}); },
        reset(coll,id){ return resetAll(coll,id,{counts:{}}); },
        subscribeDoc:multiSub,
        // main doc only (no shards): for players who never need the other players' writes
        subscribeMain(coll,id,cb){ return fsMod.onSnapshot(ref(coll,id), s=>cb(s.data()||{})); },
        setDoc:resetAll,
        mergeDoc(coll,id,obj){ return fsMod.setDoc(ref(coll,id), obj, {merge:true}); },
        mergeDocShard(coll,id,obj){ return fsMod.setDoc(ref(coll,shardName(id,myShard)), obj, {merge:true}); },
        inc(n){ return fsMod.increment(n); }
      };
      status='live';
    }catch(err){ backend=localBackend(); status='offline'; console.warn('[interactive] Firebase load failed, using local backend', err); }
  } else { backend=localBackend(); status='local'; }

  // ── publish the live backend ────────────────────────────────────────────
  // Bespoke multiplayer slides (see class_games.py) await this instead of
  // re-implementing sharding, Firebase loading and the ?host convention:
  //   window.__deckLiveReady.then(({backend, HOST}) => { … })
  try{
    window.__deckLive = {backend:backend, status:status, HOST:HOST};
    if(window.__deckLiveResolve) window.__deckLiveResolve(window.__deckLive);
  }catch(e){}

  const navKeys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','PageUp','PageDown','Home','End'];

  // ---- wire each poll -----------------------------------------------------
  polls.forEach(function(sec){
    const id = sec.dataset.pollId;
    const optsBox = sec.querySelector('[data-poll-opts]');
    const opts = Array.from(sec.querySelectorAll('.poll-opt'));
    const totalEl = sec.querySelector('[data-poll-total]');
    const hintEl = sec.querySelector('[data-poll-hint]');
    const resetBtn = sec.querySelector('[data-poll-reset]');
    const n = opts.length;
    const REVOTE = sec.dataset.pollRevote==='1';
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    const votedKey='poll-voted:'+id;
    let myVote = localStorage.getItem(votedKey);
    myVote = (myVote===null||myVote==='') ? null : parseInt(myVote,10);

    function render(counts){
      let total=0; for(let i=0;i<n;i++) total+=(counts[i]||0);
      opts.forEach(function(b,i){
        const c=counts[i]||0, pct=total?Math.round(c/total*100):0;
        b.querySelector('.poll-opt-fill').style.width=(total?c/total*100:0)+'%';
        b.querySelector('.poll-opt-count').textContent=c+(c===1?' vote':' votes');
        b.querySelector('.poll-opt-pct').textContent=pct+'%';
      });
      totalEl.textContent=total;
    }
    function markChosen(){ opts.forEach((b,i)=>b.classList.toggle('chosen', i===myVote)); }
    function lockIfVoted(){
      if(myVote!==null){
        if(!REVOTE) optsBox.classList.add('voted');
        markChosen();
        hintEl.textContent = REVOTE
          ? 'Your answer is in — click again any time to change it. Results update live.'
          : 'Thanks — your answer is locked in. Results update live.';
      }
    }

    let collapseReveal = function(){};  // set below if this poll has a reveal-able answer
    let rewindStage = function(){};     // set below if this poll reveals options one at a time

    if(HOST){
      sec.classList.add('host');
      hintEl.textContent='Live results — students vote on their own screens.';
      resetBtn.hidden=false;
      resetBtn.addEventListener('click', ()=>{ if(confirm('Reset all results for this question?')){ backend.reset('polls',id); collapseReveal(); rewindStage(); } });
    } else {
      lockIfVoted();
      opts.forEach(function(b,i){
        b.addEventListener('click', function(){
          if(REVOTE){
            if(myVote===i) return;              // already on this option
            const prev=myVote;
            myVote=i; localStorage.setItem(votedKey,String(i));
            markChosen();
            hintEl.textContent='Answer updated ✓ — change it again any time.';
            if(prev!==null) backend.bump('polls',id,prev,-1);   // move the single vote
            backend.bump('polls',id,i,1);
            return;
          }
          if(myVote!==null) return;
          myVote=i; localStorage.setItem(votedKey,String(i));
          lockIfVoted(); backend.bump('polls',id,i);
        });
      });
    }

    // optional instructor "reveal answer" (local toggle on this screen only)
    if(sec.dataset.answerIdx!==undefined){
      const ansIdx=parseInt(sec.dataset.answerIdx,10);
      const revealBtn=sec.querySelector('[data-poll-reveal]');
      const answerBox=sec.querySelector('[data-poll-answer]');
      const big=answerBox && answerBox.querySelector('.poll-answer-big');
      if(revealBtn && answerBox && big && opts[ansIdx]){
        const text=opts[ansIdx].querySelector('.poll-opt-label').textContent.trim();
        const kind=/^(true|fact|yes)$/i.test(text)?'true':(/^(false|fiction|no)$/i.test(text)?'false':'other');
        big.textContent=text; answerBox.classList.add('kind-'+kind);
        let shown=false;
        function setReveal(on){
          shown=on; answerBox.hidden=!on; sec.classList.toggle('revealed',on);
          // a concealed poll also uncovers its bars/percentages on reveal
          if(sec.dataset.pollConceal) sec.classList.toggle('concealed', !on);
          var refsEl=sec.querySelector('[data-poll-refs]');
          if(refsEl) refsEl.hidden=!on;
          opts.forEach((b,i)=>b.classList.toggle('correct', on && i===ansIdx));
          revealBtn.textContent = on ? 'Hide answer' : 'Reveal answer';
          revealBtn.setAttribute('aria-expanded', on?'true':'false');
        }
        revealBtn.hidden=false;
        revealBtn.addEventListener('click', ()=>setReveal(!shown));
        collapseReveal = ()=>setReveal(false);  // let "Reset results" also hide the answer
      }
    }

    // optional STAGED options: the instructor uncovers one answer at a time and
    // the stage index rides the same poll document, so every open copy of the
    // deck reveals in step with the projector.
    if(sec.dataset.pollStaged==='1'){
      const stageBtn=sec.querySelector('[data-poll-stage]');
      let stage=0, want=1;   // `want` is the host's own count, so pressing the
                             // clicker fast never waits on a round trip
      function applyStage(k){
        k=Math.max(1, Math.min(n, k||1));
        const grew = k>stage;
        opts.forEach(function(b,i){
          const pending = i>=k;
          b.classList.toggle('pending', pending);
          b.setAttribute('aria-hidden', pending?'true':'false');
          if(grew && !pending && i>=stage){
            b.classList.add('just-in');
            setTimeout(()=>b.classList.remove('just-in'), 400);
          }
        });
        stage=k;
        if(stageBtn){
          stageBtn.disabled = stage>=n;
          stageBtn.textContent = stage>=n ? 'All options showing' : 'Show next option ('+stage+'/'+n+')';
        }
      }
      applyStage(1);
      backend.subscribeDoc('polls', id, function(d){
        let k=(d&&d.stage)||1;
        if(HOST) k=Math.max(k, want);   // don't let a stale snapshot re-cover an option
        applyStage(k);
      });
      if(HOST){
        stageBtn.hidden=false;
        const bump=function(){
          if(want>=n) return;
          want++; applyStage(want); backend.mergeDoc('polls', id, {stage: want});
        };
        stageBtn.addEventListener('click', bump);
        rewindStage = function(){ want=1; applyStage(1); backend.mergeDoc('polls', id, {stage:1}); };
        // the clicker: while options are still covered, → / space / PageDown
        // uncovers the next one instead of leaving the slide.
        document.addEventListener('keydown', function(e){
          if(!sec.classList.contains('active') || want>=n) return;
          if(e.key!=='ArrowRight' && e.key!==' ' && e.key!=='PageDown') return;
          const t=e.target, tag=t&&t.tagName;
          if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
          e.preventDefault(); e.stopPropagation(); bump();
        }, true);
      }
    }

    backend.subscribe('polls', id, render);
  });

  // ---- wire each word cloud ----------------------------------------------
  const WC_COLORS=['#2D6A4F','#1C7293','#BC8A2E','#A4373A','#6D597A','#B5651D','#40916C','#3D6E70','#7D5BA6','#52796F'];
  // light classroom profanity guard (host can Reset if anything slips through)
  const WC_BAD=['fuck','fucking','shit','bitch','cunt','dick','cock','pussy','asshole','bastard',
    'slut','whore','nigger','nigga','faggot','fag','retard','rape','porn','sex','penis','vagina'];
  clouds.forEach(function(sec){
    const id = sec.dataset.wcId;
    const form = sec.querySelector('[data-wc-form]');
    const input = sec.querySelector('[data-wc-input]');
    const cloud = sec.querySelector('[data-wc-cloud]');
    const totalEl = sec.querySelector('[data-wc-total]');
    const hintEl = sec.querySelector('[data-wc-hint]');
    const resetBtn = sec.querySelector('[data-wc-reset]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    const mineKey='wc-mine:'+id;
    let mine; try{ mine=new Set(JSON.parse(localStorage.getItem(mineKey)||'[]')); }catch(e){ mine=new Set(); }
    const colorFor = w => { let h=0; for(let i=0;i<w.length;i++) h=(h*31+w.charCodeAt(i))>>>0; return WC_COLORS[h%WC_COLORS.length]; };
    const clean = raw => raw.trim().toLowerCase().replace(/\s+/g,' ').replace(/[^\p{L}\p{N} '\-]/gu,'').trim();
    const isBad = w => { const parts=w.split(' '); return WC_BAD.some(b=> w===b || parts.indexOf(b)>-1); };

    function render(counts){
      let entries=Object.keys(counts).map(w=>[w,counts[w]]).filter(e=>e[1]>0);
      let total=0; entries.forEach(e=>total+=e[1]); totalEl.textContent=total;
      const empty=cloud.querySelector('.wc-empty');
      if(!entries.length){ if(!empty) cloud.innerHTML='<div class="wc-empty">Waiting for the first response…</div>'; return; }
      if(empty) empty.remove();
      if(entries.length>90){ // big classes: render only the 90 most-common words
        entries.sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
        entries=entries.slice(0,90);
      }
      const max=Math.max.apply(null, entries.map(e=>e[1]));
      // keyed update: existing words grow smoothly, new words pop in, removed words drop out
      const have={}; Array.from(cloud.querySelectorAll('.wc-word')).forEach(s=>{ have[s.dataset.w]=s; });
      entries.forEach(function(e){
        const w=e[0], c=e[1], t=max>1?(c-1)/(max-1):0, base=1.0+t*3.0;
        let s=have[w];
        if(!s){ s=document.createElement('span'); s.className='wc-word'+(mine.has(w)?' mine':'');
          s.dataset.w=w; s.style.color=colorFor(w); s.textContent=w; cloud.appendChild(s); }
        s.dataset.base=base.toFixed(3);
        s.style.fontSize=base.toFixed(2)+'rem';
        s.style.opacity=(0.6+0.4*t).toFixed(2);
        s.title=c+(c===1?' response':' responses');
        delete have[w];
      });
      Object.keys(have).forEach(w=>have[w].remove());
      // shrink-to-fit: a big class should never overflow/clip the slide
      let scale=1;
      for(let g=0; g<14 && cloud.scrollHeight>cloud.clientHeight+2 && scale>0.3; g++){
        scale*=0.92;
        cloud.querySelectorAll('.wc-word').forEach(s=>{ s.style.fontSize=(parseFloat(s.dataset.base)*scale).toFixed(2)+'rem'; });
      }
    }

    if(HOST){
      sec.classList.add('host');
      hintEl.textContent='Live word cloud — students respond on their own screens.';
      resetBtn.hidden=false;
      resetBtn.addEventListener('click', ()=>{ if(confirm('Clear all responses for this word cloud?')) backend.reset('wordclouds',id); });
    } else {
      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        const w=clean(input.value);
        if(!w){ hintEl.textContent='Type a word first.'; return; }
        if(w.length>28){ hintEl.textContent='Keep it to a word or short phrase.'; return; }
        if(isBad(w)){ hintEl.textContent="Let's keep it classroom-friendly."; input.value=''; return; }
        if(mine.has(w)){ hintEl.textContent='You already added “'+w+'.” Try a different word.'; input.value=''; return; }
        mine.add(w); localStorage.setItem(mineKey, JSON.stringify(Array.from(mine)));
        backend.bump('wordclouds', id, w);
        input.value='';
        hintEl.textContent='Added “'+w+'.” Add another, or watch the cloud grow.';
      });
    }
    backend.subscribe('wordclouds', id, render);
  });

  // ---- wire each probability-poll (instructor-run class game) -------------
  // Shared doc lives in the 'polls' collection (existing rule covers it):
  //   { game, votes:{i:n}, rolls:{i:n}, rollCount, lastRoll, rollId }
  const PP_GAMES={
    g1:{name:'1 or greater than 1', options:[
      {label:'1', test:function(n){return n===1;}},
      {label:'Greater than 1', test:function(n){return n>1;}}]},
    g2:{name:'Odd or even', options:[
      {label:'Odd', test:function(n){return n%2===1;}},
      {label:'Even', test:function(n){return n%2===0;}}]},
    g3:{name:'“1 and 2,” or “3, 4, 5, and 6”', options:[
      {label:'1 and 2', test:function(n){return n<=2;}},
      {label:'3, 4, 5, and 6', test:function(n){return n>=3;}}]}
  };
  const PP_COLORS=['#2D6A4F','#1C7293','#BC8A2E','#A4373A','#6D597A','#B5651D'];

  probpolls.forEach(function(sec){
    const id = sec.dataset.ppId;
    const sel = sec.querySelector('[data-pp-game]');
    const optsBox = sec.querySelector('[data-pp-opts]');
    const rollBtn = sec.querySelector('[data-pp-roll]');
    const die = sec.querySelector('[data-pp-die]');
    const resultEl = sec.querySelector('[data-pp-result]');
    const hintEl = sec.querySelector('[data-pp-hint]');
    const probBox = sec.querySelector('[data-pp-prob]');
    const probTitle = sec.querySelector('[data-pp-prob-title]');
    const probRows = sec.querySelector('[data-pp-prob-rows]');
    const totalEl = sec.querySelector('[data-pp-total]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });
    if(HOST) sec.classList.add('host');

    let state={game:'',votes:{},rolls:{},rollCount:0,lastRoll:0,rollId:0};
    let myVoteGame=null, myVote=null, builtGame=null, lastSeenRollId=null, rolling=false;

    const myKey = g => 'pp-voted:'+id+':'+g;
    function loadMyVote(g){ const v=localStorage.getItem(myKey(g)); myVoteGame=g; myVote=(v===null||v==='')?null:parseInt(v,10); }
    function winner(game,n){ const o=PP_GAMES[game].options; for(let i=0;i<o.length;i++){ if(o[i].test(n)) return i; } return -1; }

    function buildOptions(game){
      optsBox.innerHTML='';
      if(!game || !PP_GAMES[game]){
        optsBox.innerHTML='<div class="pp-empty">'+(HOST?'Choose a game above to begin.':'Waiting for the instructor to choose a game…')+'</div>';
        builtGame=game; return;
      }
      PP_GAMES[game].options.forEach(function(o,i){
        const b=document.createElement('button');
        b.className='pp-opt'; b.type='button'; b.dataset.idx=i; b.style.setProperty('--opt', PP_COLORS[i%PP_COLORS.length]);
        b.innerHTML='<span class="pp-opt-fill"></span><span class="pp-opt-row">'
          +'<span class="pp-opt-chip"></span><span class="pp-opt-label">'+o.label+'</span>'
          +'<span class="pp-opt-stat"><span class="pp-opt-count" data-c>0 votes</span>'
          +'<span class="pp-opt-pct" data-p>0%</span></span></span>';
        if(!HOST){
          b.addEventListener('click', function(){
            if(myVote!==null || state.game!==game) return;
            myVote=i; localStorage.setItem(myKey(game), String(i)); markMine();
            backend.mergeDocShard('polls', id, {votes:{[i]:backend.inc(1)}});
          });
        }
        optsBox.appendChild(b);
      });
      builtGame=game; markMine();
    }
    function markMine(){
      const opts=optsBox.querySelectorAll('.pp-opt');
      opts.forEach((b,i)=>b.classList.toggle('chosen', myVote!==null && i===myVote));
      optsBox.classList.toggle('voted', !HOST && myVote!==null);
    }
    function renderPoll(){
      const g=state.game; if(!g||!PP_GAMES[g]) return;
      const n=PP_GAMES[g].options.length; let total=0; for(let i=0;i<n;i++) total+=(state.votes[i]||0);
      if(totalEl) totalEl.textContent=total;
      optsBox.querySelectorAll('.pp-opt').forEach(function(b,i){
        const c=state.votes[i]||0, pct=total?Math.round(c/total*100):0;
        b.querySelector('.pp-opt-fill').style.width=(total?c/total*100:0)+'%';
        b.querySelector('[data-c]').textContent=c+(c===1?' vote':' votes');
        b.querySelector('[data-p]').textContent=pct+'%';
      });
    }
    function renderProb(){
      const g=state.game;
      if(!g||!PP_GAMES[g]){ probBox.classList.remove('show'); return; }
      probBox.classList.toggle('show', (state.rollCount||0)>0);
      if(probRows.dataset.game!==g){
        probRows.innerHTML=''; probRows.dataset.game=g;
        PP_GAMES[g].options.forEach(function(o,i){
          const row=document.createElement('div'); row.className='pp-prow'; row.style.setProperty('--opt', PP_COLORS[i%PP_COLORS.length]);
          row.innerHTML='<div class="pp-prow-top"><span>'+o.label+'</span><span class="pp-prow-pct" data-pi="'+i+'">0%</span></div>'
            +'<div class="pp-pbar"><div class="pp-pbar-fill" data-fi="'+i+'"></div></div>';
          probRows.appendChild(row);
        });
      }
      const rc=state.rollCount||0;
      PP_GAMES[g].options.forEach(function(o,i){
        const c=state.rolls[i]||0, pct=rc?Math.round(c/rc*100):0;
        probRows.querySelector('[data-pi="'+i+'"]').textContent=pct+'%';
        probRows.querySelector('[data-fi="'+i+'"]').style.width=(rc?c/rc*100:0)+'%';
      });
      probTitle.textContent='Actual roll outcomes — '+rc+(rc===1?' roll':' rolls');
    }
    function showResult(){
      const g=state.game;
      if(!g||!PP_GAMES[g]||!state.lastRoll){ resultEl.textContent=''; resultEl.className='pp-result'; return; }
      const n=state.lastRoll, w=winner(g,n), wl=w>=0?PP_GAMES[g].options[w].label:'';
      if(!HOST && myVote!==null && state.game===myVoteGame){
        const right=(myVote===w);
        resultEl.innerHTML=(right?'You were right! 🎉':'You were wrong!')
          +'<span class="pp-result-sub">Rolled '+n+' → “'+wl+'”</span>';
        resultEl.className='pp-result '+(right?'right':'wrong');
      } else {
        resultEl.innerHTML='<span class="pp-result-sub">Rolled '+n+' → “'+wl+'” wins</span>';
        resultEl.className='pp-result';
      }
    }
    function animateTo(n){
      rolling=true; if(HOST) rollBtn.disabled=true;
      die.classList.remove('settled'); die.classList.add('rolling');
      let ticks=0; const iv=setInterval(function(){
        die.textContent=1+Math.floor(Math.random()*6);
        if(++ticks>=14){ clearInterval(iv); die.textContent=n; die.classList.remove('rolling'); die.classList.add('settled');
          rolling=false; showResult(); if(HOST) rollBtn.disabled=!state.game; }
      },70);
    }

    function onState(data){
      data=data||{};
      state={game:data.game||'', votes:data.votes||{}, rolls:data.rolls||{},
             rollCount:data.rollCount||0, lastRoll:data.lastRoll||0, rollId:data.rollId||0};
      if(HOST && sel && sel.value!==state.game) sel.value=state.game;
      if(builtGame!==state.game){ loadMyVote(state.game); buildOptions(state.game); }
      else if(myVoteGame!==state.game){ loadMyVote(state.game); markMine(); }
      renderPoll(); renderProb();
      if(lastSeenRollId===null){ // first load: reflect state without animating
        lastSeenRollId=state.rollId;
        if(state.lastRoll){ die.textContent=state.lastRoll; die.className='pp-die settled'; showResult(); }
        else { die.textContent='?'; die.className='pp-die'; resultEl.textContent=''; resultEl.className='pp-result'; }
      } else if(state.rollId!==lastSeenRollId){
        lastSeenRollId=state.rollId;
        if(state.lastRoll){ animateTo(state.lastRoll); }
        else { die.textContent='?'; die.className='pp-die'; resultEl.textContent=''; resultEl.className='pp-result'; }
      } else if(!rolling){
        if(state.lastRoll){ die.textContent=state.lastRoll; die.className='pp-die settled'; showResult(); }
        else { die.textContent='?'; die.className='pp-die'; resultEl.textContent=''; resultEl.className='pp-result'; }
      }
      if(HOST){
        rollBtn.disabled = !state.game || rolling;
        hintEl.textContent = state.game ? 'Roll as many times as you like. Pick a new game to reset.' : 'Choose a game to begin.';
      } else {
        hintEl.textContent = !state.game ? 'Waiting for the instructor to choose a game…'
          : (myVote!==null ? 'Your pick is locked in. Watch the class results and rolls update live.'
                           : 'Tap your prediction below.');
      }
    }

    if(HOST){
      sel.addEventListener('change', function(){
        // new game resets everything shared (votes + rolls), keeps rollId so no stray animation
        backend.setDoc('polls', id, {game:sel.value, votes:{}, rolls:{}, rollCount:0, lastRoll:0, rollId:(state.rollId||0)});
      });
      rollBtn.addEventListener('click', function(){
        if(rolling || !state.game || !PP_GAMES[state.game]) return;
        const n=1+Math.floor(Math.random()*6), w=winner(state.game,n);
        const upd={rolls:{}, rollCount:backend.inc(1), lastRoll:n, rollId:backend.inc(1)};
        upd.rolls[w]=backend.inc(1);
        backend.mergeDoc('polls', id, upd);
      });
    }
    backend.subscribeDoc('polls', id, onState);
  });

  // ---- wire each decision poll (results hidden until the host releases) ---
  // Shared doc in 'polls': { counts:{i:n}, released:bool }
  dpolls.forEach(function(sec){
    const id = sec.dataset.pollId;
    const trig = parseInt(sec.dataset.triggerIdx,10);
    const thr = parseFloat(sec.dataset.threshold);
    const thrCount = sec.dataset.thresholdCount!==undefined ? parseInt(sec.dataset.thresholdCount,10) : null;

    const releaseBtn = sec.querySelector('[data-dp-release]');
    const verdict = sec.querySelector('[data-dp-verdict]');
    const vBig = sec.querySelector('[data-dp-big]');
    const vSub = sec.querySelector('[data-dp-sub]');
    const n = opts.length;
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    const votedKey='poll-voted:'+id;
    let myVote = localStorage.getItem(votedKey);
    myVote = (myVote===null||myVote==='') ? null : parseInt(myVote,10);
    let state={counts:{},released:false};

    function render(){
      const counts=state.counts||{}, released=!!state.released;
      let total=0; for(let i=0;i<n;i++) total+=(counts[i]||0);
      opts.forEach(function(b,i){
        const c=counts[i]||0, pct=total?Math.round(c/total*100):0;
        b.querySelector('.poll-opt-fill').style.width=(released&&total?c/total*100:0)+'%';
        b.querySelector('.poll-opt-count').textContent=c+(c===1?' vote':' votes');
        b.querySelector('.poll-opt-pct').textContent=pct+'%';
      });
      totalEl.textContent=total;
      sec.classList.toggle('released', released);
      if(released){
        const c = counts[trig]||0;
        const share = total ? c/total*100 : 0;
        const over = thrCount!==null ? (c >= thrCount) : (share > thr);
        vBig.textContent = over ? msgOver : msgUnder;
        verdict.className = 'dp-verdict '+(over?'bad':'good');
        const optLabel = opts[trig] ? opts[trig].querySelector('.poll-opt-label').textContent.trim() : '';
        vSub.textContent = !total ? 'No votes were cast.'
          : (thrCount!==null
             ? c+' of '+total+' ('+Math.round(share)+'%) chose “'+optLabel+'”'
             : Math.round(share)+'% of the class chose “'+optLabel+'”');
        verdict.hidden = false;
      } else { verdict.hidden = true; }
      if(HOST){
        releaseBtn.textContent = released ? 'Hide results' : 'Release results';
        hintEl.textContent = released ? 'Results are on every screen.'
          : (total+' secret ballot'+(total===1?'':'s')+' in. Release when the class is ready.');
      } else if(released){
        hintEl.textContent = 'The results are in!';
      } else if(myVote!==null){
        hintEl.textContent = 'Your vote is locked in. Results stay secret until your instructor releases them…';
      } else {
        hintEl.textContent = 'Select your answer. Votes stay secret until the instructor releases the results.';
      }
    }

    if(HOST){
      sec.classList.add('host');
      releaseBtn.hidden=false; resetBtn.hidden=false;
      releaseBtn.addEventListener('click', ()=> backend.mergeDoc('polls', id, {released:!state.released}));
      resetBtn.addEventListener('click', ()=>{ if(confirm('Reset all results for this question?')) backend.setDoc('polls', id, {counts:{}, released:false}); });
    } else {
      opts.forEach(function(b,i){
        b.addEventListener('click', function(){
          if(myVote!==null || state.released) return;
          myVote=i; localStorage.setItem(votedKey,String(i));
          optsBox.classList.add('voted');
          opts.forEach((o,j)=>o.classList.toggle('chosen', j===i));
          backend.bump('polls', id, i);
          render();
        });
      });
      if(myVote!==null){
        optsBox.classList.add('voted');
        opts.forEach((o,j)=>o.classList.toggle('chosen', j===myVote));
      }
    }
    backend.subscribeDoc('polls', id, function(d){ state=d||{counts:{},released:false}; render(); });
  });

  // ---- wire each tragedy-of-the-commons game (v2) ---------------------------
  // In-deck port of the standalone Tragedy of the Commons app: 5 scenarios,

  //     hist:{rN:{total,cap,sust,mult,zone,health,coopPer,coopEarn}} }
  const CM_SCEN={

    bandwidth:{name:'The Office Network', res:'screen', color:'#4a6a86',

      prompt:'How many Mbps of bandwidth will you consume?', resName:'Network speed', unit:'Mbps', unitValue:80, max:12},
    forest:{name:'The Amazon Rainforest', res:'pine', color:'#3f7a4f',

      prompt:'How many hectares (×1,000) will you clear this year?', resName:'Forest coverage', unit:'hectares ×1k', unitValue:200, max:8}
  };
  // Flat cream-on-ink marks rather than emoji, so the pond is drawn in the same
  // hand it draws its charts in. Cream fill + dark outline reads on both the pale
