      return {n:n, sum:sum, min:min, max:max, vals:vals};
    }
    function renderResult(agg){
      avgEl.textContent = agg.n ? fmt(agg.sum/agg.n) : '—';
      if(!agg.n){ histEl.innerHTML=''; statsEl.textContent='No guesses yet.'; return; }
      const step = niceStep(agg.max-agg.min);
      const lo = Math.floor(agg.min/step)*step;
      const NB = Math.max(1, Math.min(10, Math.floor((agg.max-lo)/step)+1));
      const bins = new Array(NB).fill(0);
      agg.vals.forEach(function(e){
        const b=Math.max(0, Math.min(NB-1, Math.floor((e[0]-lo)/step)));
        bins[b]+=e[1];
      });
      const maxBin = Math.max.apply(null, bins.concat([1]));
      let hh='';
      for(let b=0;b<NB;b++){
        const h = bins[b]>0 ? Math.max(6, bins[b]/maxBin*100) : 0;
        hh+='<div class="ge-bin"><div class="ge-bin-col"><div class="ge-bin-fill" style="height:'+h+'%">'
          +(bins[b]>0?'<span class="ge-bin-cnt">'+bins[b]+'</span>':'')
          +'</div></div><div class="ge-bin-lbl">'+trim(lo+b*step)+'</div></div>';
      }
      histEl.innerHTML=hh;
      agg.vals.sort(function(a,b){return a[0]-b[0];});
      let med=0, seen=0, half=(agg.n+1)/2;
      for(const pair of agg.vals){ seen+=pair[1]; if(seen>=half){ med=pair[0]; break; } }
      statsEl.textContent='n='+agg.n+' · median '+fmt(med)+' · range '+trim(agg.min)+'–'+fmt(agg.max);
    }
    function render(){
      const agg=aggregate(state.counts||{});
      const opened=!!state.opened, released=!!state.released;
      root.hidden = !(HOST || opened);
      launch.hidden = !(HOST && !opened);
      body.hidden = !opened;
      totalEl.textContent=agg.n;
      resultBox.hidden=!released;
      if(answerEl) answerEl.hidden=!released;
      if(released) renderResult(agg);
      if(HOST){
        studentBox.hidden=true;
        revealBtn.hidden=!opened; closeBtn.hidden=!opened; resetBtn.hidden=!opened;
        revealBtn.textContent = released ? 'Hide results' : 'Release results';
        hintEl.textContent = released ? 'Results are on every screen.'
          : (agg.n+' guess'+(agg.n===1?'':'es')+' in. Release when the class is ready.');
      } else {
        studentBox.hidden=released;
        if(released) hintEl.textContent='The results are in!';
        else if(mine!==null) hintEl.textContent='Your guess is locked in. Results appear when your instructor releases them…';
        else hintEl.textContent='Type a number, then lock it in.';
      }
    }
    function lockIfDone(){
      if(mine===null) return;
      input.value=trim(mine); input.disabled=true;
      submitBtn.disabled=true; submitBtn.textContent='Locked in ✓';
    }

    if(HOST){
      root.classList.add('host');
      openBtn.addEventListener('click', ()=> backend.mergeDoc('polls', id, {opened:true}));
      revealBtn.addEventListener('click', ()=> backend.mergeDoc('polls', id, {released:!state.released}));
      closeBtn.addEventListener('click', ()=> backend.mergeDoc('polls', id, {opened:false, released:false}));
      resetBtn.addEventListener('click', ()=>{ if(confirm('Reset all guesses for this question?')) backend.setDoc('polls', id, {counts:{}, opened:true, released:false}); });
    } else {
      lockIfDone();
      form.addEventListener('submit', function(e){
        e.preventDefault();
        if(mine!==null) return;
        let v=parseFloat(input.value);
        if(isNaN(v) || v<0){ input.focus(); return; }
        const key=Math.round(Math.min(MAXV, v)*scale);
        mine=key/scale; localStorage.setItem(doneKey, String(mine));
        lockIfDone(); backend.bump('polls', id, 'g_'+key);
      });
    }
    render();
    backend.subscribeDoc('polls', id, function(d){ state=d||{counts:{},opened:false,released:false}; render(); });
  });

  splitdollars.forEach(function(sec){

    const MAXV = 100000;
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    const fmt = n => prefix + Math.round(n).toLocaleString('en-US');
    function niceStep(range){
      const raw = range/9 || 1;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const norm = raw/mag;
      const step = norm<=1?1 : norm<=2?2 : norm<=5?5 : 10;
      return Math.max(1, step*mag);
    }

    // stable random assignment (question A or B) per browser
    const roleKey='sd-role:'+id;
    let role=null; try{ role=localStorage.getItem(roleKey); }catch(e){}
    if(role!=='a' && role!=='b'){ role = Math.random()<0.5?'a':'b'; try{ localStorage.setItem(roleKey, role); }catch(e){} }

    const doneKey='sd-done:'+id;
    let mine=null; try{ const v=localStorage.getItem(doneKey); mine=(v===null||v==='')?null:parseFloat(v); }catch(e){ mine=null; }
    let state={counts:{},released:false};

    function aggregate(counts, pfx){
      let n=0,sum=0,min=Infinity,max=0; const vals=[];
      const re=new RegExp('^'+pfx+'_(\\d+)$');
      Object.keys(counts).forEach(function(k){
        const m=k.match(re); if(!m) return;
        const v=parseInt(m[1],10), c=counts[k]||0; if(v<0||v>MAXV||c<=0) return;
        n+=c; sum+=v*c; vals.push([v,c]); if(v<min)min=v; if(v>max)max=v;
      });

      return {n:n,sum:sum,min:min,max:max,vals:vals};
    }
    function renderOne(agg, avgEl, histEl, statsEl){
      avgEl.textContent = fmt(agg.n?agg.sum/agg.n:0);
      if(!agg.n){ histEl.innerHTML=''; statsEl.textContent='No answers yet.'; return; }
      const step=niceStep(agg.max);
      const NB=Math.max(1,Math.min(12,Math.floor(agg.max/step)+1));
      const bins=new Array(NB).fill(0);
      agg.vals.forEach(function(e){ const b=Math.min(NB-1,Math.floor(e[0]/step)); bins[b]+=e[1]; });
      const maxBin=Math.max.apply(null,bins.concat([1]));
      let hh='';
      for(let b=0;b<NB;b++){
        const lo=b*step, hi=lo+step-1;
        const h=bins[b]>0?Math.max(6,bins[b]/maxBin*100):0;
        const lbl= step>=1000 ? (prefix+(lo/1000)+'–'+((hi+1)/1000)+'k') : (prefix+lo+'–'+hi);
        hh+='<div class="dl-bin"><div class="dl-bin-col"><div class="dl-bin-fill" style="height:'+h+'%">'
          +(bins[b]>0?'<span class="dl-bin-cnt">'+bins[b]+'</span>':'')+'</div></div>'
          +'<div class="dl-bin-lbl">'+lbl+'</div></div>';
      }

        heading.textContent = (role==='a'?qA:qB);

    function lockIfDone(){

    }
    // initial paint so the student sees their question (and the host its holding
    // message) before the first Firestore snapshot arrives
    if(HOST){ heading.textContent=HH; hostWait.hidden=false; studentBox.hidden=true; }
    else { heading.textContent = (role==='a'?qA:qB); }

    if(HOST){
      sec.classList.add('host');
      revealBtn.addEventListener('click', ()=> backend.mergeDoc('polls', id, {released:!state.released}));
      resetBtn.addEventListener('click', ()=>{ if(confirm('Reset all answers for both questions?')) backend.setDoc('polls', id, {counts:{}, released:false}); });
    } else {
      lockIfDone();
      form.addEventListener('submit', function(e){
        e.preventDefault();
        if(mine!==null) return;
        let v=parseFloat(input.value);
        if(isNaN(v)||v<0){ input.focus(); return; }
        v=Math.min(MAXV, Math.round(v));
        mine=v; localStorage.setItem(doneKey, String(v));
        lockIfDone(); backend.bump('polls', id, role+'_'+v);
      });
    }
    backend.subscribeDoc('polls', id, function(d){ state=d||{counts:{},released:false}; render(); });
  });

  // ---- wire each endowment-effect experiment (Kahneman mug experiment) -------
  // Main doc in 'polls': { v:1, gameId, phase:'idle'|'open'|'results' }.
  // Sharded counts: "a_<cents>" = owners' asks (WTA), "b_<cents>" = buyers' bids (WTP).
  // Each browser flips its own coin for the role, so the class splits ~50/50.
  endows.forEach(function(sec){
    const id = sec.dataset.enId;
    const ITEM = sec.dataset.enItem, SHORT = sec.dataset.enShort;
    const MAXP = parseFloat(sec.dataset.enMax||'60');
    const el = s => sec.querySelector(s);
    const idleBox=el('[data-en-idle]'), idleTxt=el('[data-en-idletxt]'), playBox=el('[data-en-play]'),
      lockedBox=el('[data-en-locked]'), resultsBox=el('[data-en-results]'),
      badge=el('[data-en-badge]'), story=el('[data-en-story]'), card=el('[data-en-card]'),
      form=el('[data-en-form]'), qEl=el('[data-en-q]'), input=el('[data-en-input]'),
      submitBtn=el('[data-en-submit]'), noteEl=el('[data-en-note]'),
      lockRole=el('[data-en-lockrole]'), lockPrice=el('[data-en-lockprice]'),
      histEl=el('[data-en-hist]'), medaEl=el('[data-en-meda]'), medbEl=el('[data-en-medb]'),
      ratioEl=el('[data-en-ratio]'), tradeEl=el('[data-en-trade]'), verdictEl=el('[data-en-verdict]'),
      naEl=el('[data-en-na]'), nbEl=el('[data-en-nb]'), hintEl=el('[data-en-hint]'),
      startBtn=el('[data-en-start]'), revealBtn=el('[data-en-reveal]'), newBtn=el('[data-en-new]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    const A_COL='#B85042', B_COL='#2F6D8A';
    const money = c => '$' + (c/100).toFixed(2);
    const money0 = c => '$' + (c/100).toFixed(c%100 ? 2 : 0);

    let state = {phase:'idle', gameId:0};
    const roleKey = g => 'endow-role:'+id+':'+g;
    const doneKey = g => 'endow-done:'+id+':'+g;
    function myRole(g){
      if(!g) return null;
      let r = null; try{ r = localStorage.getItem(roleKey(g)); }catch(e){}
      if(r!=='a' && r!=='b'){ r = Math.random()<0.5 ? 'a' : 'b'; try{ localStorage.setItem(roleKey(g), r); }catch(e){} }
      return r;
    }
    function myPrice(g){
      if(!g) return null;
      let v=null; try{ v=localStorage.getItem(doneKey(g)); }catch(e){}
      return (v===null||v==='') ? null : parseInt(v,10);
    }

    function paintRole(r){
      const owner = r==='a';
      card.style.setProperty('--rc', owner?A_COL:B_COL);
      form.style.setProperty('--rc', owner?A_COL:B_COL);
      badge.textContent = owner ? 'You are an owner' : 'You are a buyer';
      story.innerHTML = owner
        ? 'The instructor has just handed you a <b>'+ITEM+'</b>. It is yours to keep — '
          +'or to sell to a classmate who doesn\'t have one.'
        : 'Your classmate across the room was handed a <b>'+ITEM+'</b>. You weren\'t. '
          +'You have cash, and you can buy theirs.';
      qEl.textContent = owner
        ? 'What is the LOWEST price you would accept to sell your '+SHORT+'?'
        : 'What is the MOST you would pay to buy one?';
      noteEl.textContent = owner
        ? 'Answer honestly — below this price you\'d rather keep the '+SHORT+'. Anything from $0 to $'+MAXP+'.'
        : 'Answer honestly — above this price you\'d rather keep your cash. Anything from $0 to $'+MAXP+'.';
      input.max = MAXP;
    }

    function aggregate(counts, pfx){
      const vals=[]; let n=0, sum=0;
      Object.keys(counts||{}).forEach(function(k){
        const m=k.match(new RegExp('^'+pfx+'_(\\d+)$')); if(!m) return;
        const v=parseInt(m[1],10), c=counts[k]||0;
        if(c<=0 || v<0 || v>MAXP*100) return;
        n+=c; sum+=v*c; vals.push([v,c]);
      });
      vals.sort((x,y)=>x[0]-y[0]);
      let med=0, seen=0, half=(n+1)/2;
      for(const p of vals){ seen+=p[1]; if(seen>=half){ med=p[0]; break; } }
      return {n:n, sum:sum, med:med, vals:vals};
    }
    function tradeShare(A,B){
      // share of all owner×buyer pairs where the buyer's bid >= the owner's ask
      let pairs=0, trades=0;
      A.vals.forEach(function(a){ B.vals.forEach(function(b){
        pairs += a[1]*b[1]; if(b[0]>=a[0]) trades += a[1]*b[1];
      }); });
      return pairs ? trades/pairs : null;
    }
    function renderResults(A,B){
      const maxV = Math.max(A.vals.length?A.vals[A.vals.length-1][0]:0,
                            B.vals.length?B.vals[B.vals.length-1][0]:0, 100);
      const NB = 10, step = Math.ceil(maxV/NB/25)*25 || 25;
      const binsA=new Array(NB).fill(0), binsB=new Array(NB).fill(0);
      A.vals.forEach(p=>{ binsA[Math.min(NB-1, Math.floor(p[0]/step))] += p[1]; });
      B.vals.forEach(p=>{ binsB[Math.min(NB-1, Math.floor(p[0]/step))] += p[1]; });
      const maxBin = Math.max.apply(null, binsA.concat(binsB).concat([1]));
      let h='';
      for(let i=0;i<NB;i++){
        const lo=i*step;
        const ha = binsA[i]>0 ? Math.max(5, binsA[i]/maxBin*100) : 0;
        const hb = binsB[i]>0 ? Math.max(5, binsB[i]/maxBin*100) : 0;
        h+='<div class="en-bin"><div class="en-bin-cols">'
          +'<div class="en-bin-col"><div class="en-bin-fill a" style="height:'+ha+'%">'
          +(binsA[i]>0?'<span class="en-bin-cnt">'+binsA[i]+'</span>':'')+'</div></div>'
          +'<div class="en-bin-col"><div class="en-bin-fill b" style="height:'+hb+'%">'
          +(binsB[i]>0?'<span class="en-bin-cnt">'+binsB[i]+'</span>':'')+'</div></div>'
          +'</div><div class="en-bin-lbl">'+money0(lo)+'</div></div>';
      }
      histEl.innerHTML=h;
      medaEl.textContent = A.n ? money0(A.med) : '—';
      medbEl.textContent = B.n ? money0(B.med) : '—';
      const ratio = (A.n && B.n && B.med>0) ? A.med/B.med : null;
      ratioEl.textContent = ratio ? ratio.toFixed(1)+'×' : '—';
      const ts = tradeShare(A,B);
      tradeEl.textContent = ts===null ? '—' : Math.round(ts*100)+'%';
      if(!A.n || !B.n){
        verdictEl.className='en-verdict';
        verdictEl.textContent='Waiting for prices from both owners and buyers.';
        return;
      }
      if(ratio && ratio>1.15){
        verdictEl.className='en-verdict hit';
        verdictEl.innerHTML='<b>The endowment effect.</b> Owners and buyers are pricing the exact same '+SHORT
          +' — nothing about it differs except who happens to be holding one. Yet owners demand about '
          +'<b>'+ratio.toFixed(1)+'×</b> what buyers offer, so far fewer pairs trade than the 50% you\'d expect. '
          +'Giving up the '+SHORT+' registers as a <b>loss</b>, and losses loom larger than equivalent gains. '
          +'Kahneman, Knetsch &amp; Thaler found the same 2–3× gap with coffee mugs — and it\'s why status quo bias '
          +'is so hard to overcome.';
      } else {
        verdictEl.className='en-verdict';
        verdictEl.innerHTML='This time the two distributions came out close together (owners asked about '
          +'<b>'+ratio.toFixed(1)+'×</b> what buyers offered), so trades happen near the rate standard economics '
          +'predicts. In the original mug experiments the gap was 2–3× — small classes, prior exposure to the idea, '
          +'or a hypothetical rather than real '+SHORT+' can all shrink it.';
      }
    }

    function render(){
      const ph = state.phase||'idle', g = state.gameId||0;
      const counts = state.counts||{};
      const A = aggregate(counts,'a'), B = aggregate(counts,'b');
      naEl.textContent=A.n; nbEl.textContent=B.n;

      const released = ph==='results';
      const mine = myPrice(g);
      idleBox.hidden = !(ph==='idle');
      resultsBox.hidden = !released;
      if(released) renderResults(A,B);

      if(HOST){
        sec.classList.add('host');
        playBox.hidden=true; lockedBox.hidden=true;
        startBtn.hidden = ph!=='idle';
        revealBtn.hidden = ph==='idle';
        revealBtn.textContent = released ? 'Hide results' : 'Reveal the results';
        newBtn.hidden = ph==='idle';
        idleTxt.textContent = 'Hand out the '+SHORT+'s to start — each student\'s screen randomly makes them an owner or a buyer.';
        hintEl.textContent = ph==='idle' ? 'Students open the deck on their own devices.'
          : released ? 'Results are on every screen.'
          : (A.n+B.n)+' price'+((A.n+B.n)===1?'':'s')+' in — reveal when the class is ready.';
      } else {
        startBtn.hidden=true; revealBtn.hidden=true; newBtn.hidden=true;
        if(ph==='idle'){
          playBox.hidden=true; lockedBox.hidden=true;
          idleTxt.textContent='Waiting for your instructor to hand out the '+SHORT+'s…';
          hintEl.textContent='';
        } else if(released){
          playBox.hidden=true; lockedBox.hidden=true;
          hintEl.textContent='The results are in!';
        } else {
          const r = myRole(g);
          if(mine===null){
            paintRole(r); playBox.hidden=false; lockedBox.hidden=true;
            hintEl.textContent='Name your price, then lock it in.';
          } else {
            playBox.hidden=true; lockedBox.hidden=false;
            lockRole.textContent = r==='a' ? 'Your selling price (owner)' : 'Your offer (buyer)';
            lockRole.style.setProperty('--rc', r==='a'?A_COL:B_COL);
            lockPrice.textContent = money(mine);
            hintEl.textContent='';
          }
        }
      }
    }

    if(HOST){
      startBtn.addEventListener('click', ()=> backend.setDoc('polls', id, {v:1, gameId:Date.now(), phase:'open', counts:{}}));
      revealBtn.addEventListener('click', ()=> backend.mergeDoc('polls', id, {phase: state.phase==='results'?'open':'results'}));
      newBtn.addEventListener('click', ()=>{ if(confirm('Start a fresh round? All prices are cleared and roles are re-drawn.'))
        backend.setDoc('polls', id, {v:1, gameId:Date.now(), phase:'idle', counts:{}}); });
    } else {
      form.addEventListener('submit', function(e){
        e.preventDefault();
        const g = state.gameId||0;
        if(!g || myPrice(g)!==null) return;
        let v=parseFloat(input.value);
        if(isNaN(v) || v<0){ input.focus(); return; }
        v = Math.min(MAXP, v);
        const cents = Math.round(v*100);
        try{ localStorage.setItem(doneKey(g), String(cents)); }catch(e){}
        input.disabled=true; submitBtn.disabled=true; submitBtn.textContent='Locked in ✓';
        backend.bump('polls', id, myRole(g)+'_'+cents);
        render();
      });
    }
    backend.subscribeDoc('polls', id, function(d){ state = d || {phase:'idle', gameId:0}; render(); });
  });

  // ---- wire each cap-and-trade market sim (v4: multi-round, declining cap) ----
  // Shared doc in 'polls': { v:4, phase:'idle'|'lobby'|'open'|'results', round,
  //   gameId, players:{pk:joinTs}, costs:{pk:$/ton}, prices:{rN:$},
  //   rounds:{rN:{pk:{a:tonsCleaned, t:creditsBought(+)/Sold(-) — derived from a}}},
  //   hist:{rN:{em,cost,base,capT,price}} }.
  // Pollution cap (tons per factory): R1 none (baseline), then 4, 3, 2.
  // Baseline emissions CT_E=5; cleanup tech removes at most CT_AMAX=4 tons, so
  // no factory can reach zero. Emissions under the cap EARN credits; over must BUY.
  const CT_E=5, CT_AMAX=4, CT_CAPS=[null,4,3,2], CT_NR=4, CT_COSTS=[15,25,35,45,55,65,75,85];
  const CT_FMT = n => '$'+Math.round(Math.abs(n)).toLocaleString('en-US');
  const CT_NET = n => n<-0.5 ? '−'+CT_FMT(n) : CT_FMT(n);
  captrades.forEach(function(sec){
    const id=sec.dataset.ctId;
    const el=s=>sec.querySelector(s);
    const startBtn=el('[data-ct-start]'), roundBtn=el('[data-ct-round]'), endBtn=el('[data-ct-end]'), newBtn=el('[data-ct-new]'),
      statusEl=el('[data-ct-status]'), joinBox=el('[data-ct-join]'), joinBtn=el('[data-ct-joinbtn]'),
      factory=el('[data-ct-factory]'), meEl=el('[data-ct-me]'), costEl=el('[data-ct-cost]'), hint2=el('[data-ct-hint2]'),
      aRange=el('[data-ct-a]'), aNum=el('[data-ct-anum]'),
      tradeRow=el('[data-ct-traderow]'), tRange=el('[data-ct-t]'), tNum=el('[data-ct-tnum]'),
      comply=el('[data-ct-comply]'), readout=el('[data-ct-readout]'), submitBtn=el('[data-ct-submit]'),
      resultEl=el('[data-ct-result]'), board=el('[data-ct-board]'), boardTitle=el('[data-ct-boardtitle]'), boardRows=el('[data-ct-boardrows]'),
      capcard=el('[data-ct-capcard]'), croundLbl=el('[data-ct-croundlbl]'), capMain=el('[data-ct-capmain]'), capSub=el('[data-ct-capsub]'),
      histWrap=el('[data-ct-histwrap]'), histBars=el('[data-ct-histbars]'),
      lesson=el('[data-ct-lesson]'), idlehint=el('[data-ct-idlehint]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });
    if(HOST) sec.classList.add('host');

    let pk=localStorage.getItem('ct-pk:'+id);
    if(!pk){ pk='p'+Math.random().toString(36).slice(2,10); localStorage.setItem('ct-pk:'+id, pk); }

    let state={phase:'idle'}, nameMap={}, uiRound=0;
    const players=()=>state.players||{}, costs=()=>state.costs||{};
    const N=()=>Object.keys(players()).length;
    const joined=()=>!HOST && players()[pk]!==undefined;
    const myCost=()=>{ const c=costs()[pk]; return c===undefined?50:c; };
    const R=()=>state.round||0;
    const capOf=r=>(r>=1&&r<=CT_NR)?CT_CAPS[r-1]:null;
    const priceOf=r=>((state.prices||{})['r'+r]);
    const roundChoices=r=>((state.rounds||{})['r'+r])||{};
    const myChoice=r=>roundChoices(r)[pk]||null;
    const histOf=r=>(state.hist||{})['r'+r];
    const doneRounds=()=>{ let n=0; for(let r=1;r<=CT_NR;r++) if(histOf(r)) n++; return n; };
    function rebuildNames(){ const ks=Object.keys(players()).sort((a,b)=>(players()[a]-players()[b])||(a<b?-1:1));
      nameMap={}; ks.forEach((k,i)=>nameMap[k]='Factory '+(i+1)); }
    const nameOf=k=>nameMap[k]||'Factory ?';
    // plan actually used for a factory in round r (default: clean nothing, buy what the cap forces)
    function planOf(k,r){ const ch=roundChoices(r)[k]; if(ch && ch.a!==undefined) return ch;
      const A=capOf(r); return {a:0, t:(A===null?0:(CT_E-A)), auto:true}; }
    function planCost(c,p,P){ return c*p.a + p.t*(P||0); }
    function fmtT(t){ return t>0?('buy '+t):(t<0?('sell '+(-t)):'—'); }

    // ---------- student decision panel ----------
    // TWO linked decisions: how much to clean up, and how many credits to buy/sell.
    // The trade slider's range follows the cleanup slider — you can only SELL
    // credits you earned by going under the cap, and you must BUY at least your
    // excess over the cap before you can lock in.
    function renderDecide(){
      const r=R(), A=capOf(r), P=priceOf(r)||0, c=myCost();
      const locked = !!myChoice(r) || state.phase!=='open';
      const mine=myChoice(r);
      if(uiRound!==r && !mine){ aRange.value=0; tRange.value=0; uiRound=r; }
      if(mine){ aRange.value=mine.a; tRange.value=mine.t; }
      aRange.disabled=locked; tRange.disabled=locked;
      tradeRow.hidden=(A===null);
      const a=parseInt(aRange.value,10)||0, em=CT_E-a;
      let t=0;
      if(A!==null){
        const sellCap=Math.max(0, A-em);      // you can only sell credits you EARNED
        tRange.min=-sellCap; tRange.max=CT_E-A;
        t=Math.max(-sellCap, Math.min(CT_E-A, parseInt(tRange.value,10)||0));
        tRange.value=t;
      }
      aNum.textContent=a;
      tNum.textContent = t>0?('buy '+t):(t<0?('sell '+(-t)):'0');
      // which path is cheaper for THIS factory?
      if(A===null){ hint2.innerHTML='🌫 <strong>No cap this round.</strong> Polluting is free — cleanup only costs you money. (Notice what everyone chooses…)'; }
      else if(c<P){ hint2.innerHTML='💡 Your cleanup (<strong>'+CT_FMT(c)+'/ton</strong>) is CHEAPER than credits (<strong>'+CT_FMT(P)+'</strong>) — clean up, go <strong>under the cap</strong>, and sell the credits you earn.'; }
      else { hint2.innerHTML='💡 Credits (<strong>'+CT_FMT(P)+'</strong>) are CHEAPER than your cleanup (<strong>'+CT_FMT(c)+'/ton</strong>) — keep polluting <strong>over the cap</strong> and buy credits instead.'; }
      // your position vs the cap → what the trade slider must / can do
      const need = A===null?0:Math.max(0, em-A);     // credits you MUST buy
      const earned = A===null?0:Math.max(0, A-em);   // credits you earned (can sell)
      let ok=true;
      if(A===null){ comply.className='ct-comply tip';
        comply.innerHTML='You emit <strong>'+em+' of '+CT_E+' tons</strong>. There is no cap — credits don’t exist yet.'; }
      else if(need>0 && t<need){ comply.className='ct-comply bad'; ok=false;
        comply.innerHTML='❌ You’d emit <strong>'+em+' tons</strong> — that’s <strong>'+need+' over</strong> the cap of '+A+', but you’re only buying '+Math.max(0,t)+'. Slide credits right to buy '+need+', or clean up more.'; }
      else if(need>0 && t>need){ comply.className='ct-comply warn';
        comply.innerHTML='⚠️ You only need '+need+' credit'+(need===1?'':'s')+' to cover your excess — buying '+t+' wastes '+CT_FMT((t-need)*P)+'.'; }
      else if(need>0){ comply.className='ct-comply warn';
        comply.innerHTML='🎫 <strong>'+em+' tons</strong> is '+need+' OVER the cap of '+A+' → you’re buying <strong>'+need+' credit'+(need===1?'':'s')+'</strong> at '+CT_FMT(P)+' → <strong>−'+CT_FMT(need*P)+'</strong>.'; }
      else if(t>0){ comply.className='ct-comply warn';
        comply.innerHTML='⚠️ You’re at or under the cap — you don’t need to buy credits'+(earned>0?' (you EARNED '+earned+' to sell — slide left instead!)':'')+'. Buying '+t+' wastes '+CT_FMT(t*P)+'.'; }
      else if(earned===0){ comply.className='ct-comply tip';
        comply.innerHTML='⚖️ <strong>'+em+' ton'+(em===1?'':'s')+'</strong> — exactly at the cap. Nothing to buy; nothing earned to sell.'; }
      else if(t===-earned){ comply.className='ct-comply ok';
        comply.innerHTML='✅ <strong>'+em+' ton'+(em===1?'':'s')+'</strong> is '+earned+' UNDER the cap of '+A+' → you earned <strong>'+earned+' credit'+(earned===1?'':'s')+'</strong> and you’re selling '+(earned===1?'it':'them all')+' → <strong>+'+CT_FMT(earned*P)+'</strong> in your pocket.'; }
      else { const unsold=earned+t; comply.className='ct-comply tip';
        comply.innerHTML='💰 You went '+earned+' under the cap and earned <strong>'+earned+' credit'+(earned===1?'':'s')+'</strong>'+(t<0?' (selling '+(-t)+')':'')+' — <strong>'+unsold+' still unsold</strong>. Slide credits left to sell '+(unsold===1?'it':'them')+' for '+CT_FMT(unsold*P)+'.'; }
      // cost readout
      const clean=c*a, trade=t*P, net=clean+trade;
      let ro='Cleanup: '+a+' × '+CT_FMT(c)+' = <strong>'+CT_FMT(clean)+'</strong><br>';
      if(A!==null){ ro+='Credits: '+(t>0?('buy '+t+' × '+CT_FMT(P)+' = <strong>'+CT_FMT(trade)+'</strong>')
        :(t<0?('sell '+(-t)+' × '+CT_FMT(P)+' = <strong class="profit">−'+CT_FMT(-trade)+'</strong>'):'none'))+'<br>'; }
      ro+='<span class="net">Your total this round: <span class="'+(net<-0.5?'profit':'')+'">'+CT_NET(net)+(net<-0.5?' profit':'')+'</span></span>';
      readout.innerHTML=ro;
      submitBtn.disabled = locked || !ok;
      submitBtn.textContent = mine ? 'Locked in ✓' : 'Lock in my plan';
    }
    // ---------- cap card ----------
    function renderCapcard(){
      const ph=state.phase, r=R();
      capcard.hidden = !(ph==='open'||ph==='results');
      if(capcard.hidden) return;
      const A=capOf(r), n=N();
      croundLbl.textContent='ROUND '+r+' of '+CT_NR+(ph==='results'?' — RESULTS':'');
      if(A===null){ capMain.textContent='No pollution cap';
        capSub.innerHTML='Credits don’t exist yet. Every factory may emit its full '+CT_E+' tons for free — baseline: <strong>'+(CT_E*n)+' tons</strong>.'; }
      else{ capMain.textContent='Pollution cap: '+A+' ton'+(A===1?'':'s')+' per factory';
        capSub.innerHTML='Class-wide cap: <strong>'+(A*n)+'</strong> of '+(CT_E*n)+' baseline tons ('+Math.round((1-A/CT_E)*100)+'% cut) · go under and SELL, go over and BUY · credit price <span class="px">'+CT_FMT(priceOf(r)||0)+'</span>'; }
    }
    // ---------- round-by-round history chart ----------
    function renderHist(){
      const ph=state.phase;
      histWrap.hidden = !(ph==='open'||ph==='results');
      if(histWrap.hidden) return;
      let hh='';
      for(let r=1;r<=CT_NR;r++){
        const h=histOf(r), A=capOf(r);
        if(h){
          const emH=Math.max(4, h.em/Math.max(1,h.base)*100);
          const capH= h.capT>=0 ? (h.capT/Math.max(1,h.base)*100) : null;
          hh+='<div class="ct-hslot"><div class="ct-harea">'
            +'<div class="ct-hbar" style="height:'+emH.toFixed(1)+'%"><div class="ct-hem">'+h.em+'t</div></div>'
            +(capH!==null?'<div class="ct-hcap" style="bottom:'+capH.toFixed(1)+'%"></div>':'')
            +'</div><div class="ct-hlbl">R'+r+' · '+(A===null?'no cap':'cap '+A+'t each')+'</div>'
            +'<div class="ct-hcost">'+CT_FMT(h.cost)+'</div></div>';
        } else {
          hh+='<div class="ct-hslot future"><div class="ct-harea"><div class="ct-hfut">'
            +(A===null?'no cap':'cap will be<br>'+A+' ton'+(A===1?'':'s')+' each')+'</div></div>'
            +'<div class="ct-hlbl">R'+r+(r===R()?' · now':'')+'</div><div class="ct-hcost">&nbsp;</div></div>';
        }
      }
      histBars.innerHTML=hh;
    }
    // ---------- end-of-round lesson ----------
    function renderLesson(){
      const ph=state.phase, r=R(), h=histOf(r);
      lesson.hidden = !(ph==='results' && h);
      idlehint.hidden = (ph==='open'||ph==='results');
      if(lesson.hidden) return;
      const A=capOf(r);
      let s='<strong>Round '+r+':</strong> the class emitted <strong>'+h.em+' of '+h.base+' tons</strong>'
        +(h.capT>=0?' (cap: '+h.capT+' — '+(h.em<=h.capT?'met ✓':'exceeded!')+')':' (no cap)')
        +' and spent <strong>'+CT_FMT(h.cost)+'</strong> in total.';
      if(A!==null){ // the trade ledger: who sold to whom
        let sold=0, bought=0;
        Object.keys(players()).forEach(function(k){ const p=planOf(k,r); if(p.t>0) bought+=p.t; else sold-=p.t; });
        s+='<br>🎫 The market: <strong>'+sold+' credit'+(sold===1?'':'s')+' sold</strong> by factories that went under the cap ↔ <strong>'
          +bought+' bought</strong> by factories that stayed over it.';
      }
      const h1=histOf(1);
      if(r>1 && h1){ const drop=Math.round((1-h.em/Math.max(1,h1.em))*100);
        s+='<br>Versus Round 1 (no cap): <span class="drop">'+drop+'% less pollution</span> — the cap did that; trading just made it cheap.'; }
      if(r===CT_NR){ s+='<br><strong>Game over:</strong> same factories, same technology — the only thing that changed each round was the cap.'; }
      lesson.innerHTML=s;
    }
    // ---------- personal round result ----------
    function renderResult(){
      const ph=state.phase, r=R();
      if(HOST || !joined() || ph!=='results' || !histOf(r)){ resultEl.hidden=true; return; }
      resultEl.hidden=false;
      const c=myCost(), A=capOf(r), P=priceOf(r)||0, p=planOf(pk,r);
      const mine=planCost(c,p,P), em=CT_E-p.a;
      let s='';
      if(p.auto) s+='⏰ You didn’t lock in, so you were auto-assigned: clean nothing'+(A!==null?', buy the '+(CT_E-A)+' credit'+(CT_E-A===1?'':'s')+' your excess pollution requires':'')+'. ';
      s+='You emitted <strong>'+em+' ton'+(em===1?'':'s')+'</strong>'
        +(A!==null?' (cap '+A+'), cleaned '+p.a+', '+(p.t>0?'bought '+p.t+' credit'+(p.t===1?'':'s'):p.t<0?'sold '+(-p.t)+' credit'+(p.t===-1?'':'s'):'traded no credits'):'')+'. ';
      s+='<span class="big">Your cost this round: '+CT_NET(mine)+(mine<-0.5?' — a profit!':'')+'.</span> ';
      if(A===null){ resultEl.className='ct-result '+(mine<=0.5?'good':'bad');
        s+= mine<=0.5 ? 'Free polluting — no cap, no cost. That’s the baseline problem. 🌫' :
          'You paid to clean up even though there was no cap — good citizenship, but notice most factories won’t.'; }
      else{
        const best = (c<P) ? planCost(c,{a:CT_AMAX,t:(CT_E-CT_AMAX)-A},P) : planCost(c,{a:0,t:CT_E-A},P);
        if(mine-best<0.5){ resultEl.className='ct-result good';
          s+= (c<P)?'Optimal — cleaning up was your cheap path, and selling your credits paid for it. 🎉'
                   :'Optimal — buying credits was cheaper than your expensive cleanup. 🎉'; }
        else{ resultEl.className='ct-result bad';
          s+='Cheapest play for your factory: '+((c<P)?'clean the max '+CT_AMAX+' tons (emitting '+(CT_E-CT_AMAX)+') and sell '+(A-(CT_E-CT_AMAX))+' credit'+((A-(CT_E-CT_AMAX))===1?'':'s'):'clean nothing and buy '+(CT_E-A)+' credit'+(CT_E-A===1?'':'s'))+' → '+CT_NET(best)+'.'; }
      }
      resultEl.innerHTML=s;
    }
    // ---------- roster / cumulative leaderboard ----------
    function renderBoard(){
      const ph=state.phase;

      board.hidden=!show; if(!show) return;
      if(ph==='lobby'){
        boardTitle.textContent='In the lobby — '+N()+' factor'+(N()===1?'y':'ies');

          || '<div class="ct-brow"><span class="nm" style="color:var(--muted)">No one yet…</span></div>';
        return;
      }
      boardTitle.textContent='Running total after '+done+' round'+(done===1?'':'s')+' — lowest cost wins';
      const rows=Object.keys(players()).map(function(k){
        const c=costs()[k]!==undefined?costs()[k]:50; let tot=0;
        for(let r=1;r<=CT_NR;r++){ if(histOf(r)) tot+=planCost(c, planOf(k,r), (histOf(r).price||0)); }
        return {k:k, name:nameOf(k), tot:tot};
      });
      rows.sort((a,b)=> a.tot-b.tot || (a.name<b.name?-1:1));
      const row=(r,i)=>'<div class="ct-brow'+(r.k===pk?' me':'')+'"><span class="rk">'+(i+1)+'.</span>'
        +'<span class="nm">'+r.name+'</span><span class="er">'+CT_NET(r.tot)+'</span></div>';
      let html; if(rows.length<=12){ html=rows.map(row).join(''); }
      else{ html=rows.slice(0,10).map(row).join('');
        const mi=rows.findIndex(x=>x.k===pk); if(mi>=10) html+=row(rows[mi],mi);
        const more=rows.length-10-(mi>=10?1:0); if(more>0) html+='<div class="ct-brow"><span class="nm" style="color:var(--muted)">…and '+more+' more</span></div>'; }
      boardRows.innerHTML=html;
    }

    function render(){
      const ph=state.phase||'idle', r=R();
      rebuildNames();
      renderCapcard(); renderHist(); renderLesson(); renderResult(); renderBoard();
      joinBox.hidden = HOST || !(ph==='lobby'||ph==='open') || joined();
      const showFactory = !HOST && joined() && ph==='open';
      factory.hidden=!showFactory;
      if(showFactory){ meEl.textContent=nameOf(pk); costEl.textContent=CT_FMT(myCost()); renderDecide(); }
      if(HOST){
        startBtn.hidden = ph!=='idle';
        roundBtn.hidden = !(ph==='lobby' || (ph==='results' && r<CT_NR));
        if(ph==='lobby') roundBtn.textContent='Start Round 1 — no cap ▸';
        else if(ph==='results' && r<CT_NR) roundBtn.textContent='Start Round '+(r+1)+' — cap drops to '+capOf(r+1)+' ton'+(capOf(r+1)===1?'':'s')+' each ▸';
        endBtn.hidden = ph!=='open';
        if(ph==='open') endBtn.textContent='End Round '+r+' — show results ▸';
        newBtn.hidden = ph!=='results';
        if(ph==='idle') statusEl.textContent='Open the lobby once everyone has the deck open.';
        else if(ph==='lobby') statusEl.textContent=N()+' factor'+(N()===1?'y':'ies')+' joined. Start Round 1 when ready.';
        else if(ph==='open'){ const d=Object.keys(roundChoices(r)).length;
          statusEl.textContent='Round '+r+' — '+d+' of '+N()+' locked in. End the round when ready.'; }
        else statusEl.textContent = r<CT_NR ? 'Round '+r+' results are on every screen. Tighten the cap when ready.'
          : 'Game over — the cap cut pollution 75%. Start a new game to play again.';
      } else {
        if(ph==='idle') statusEl.textContent='Waiting for the instructor to open the market…';
        else if(ph==='lobby') statusEl.textContent= joined()? 'You’re in as '+nameOf(pk)+'! Waiting for Round 1… ('+N()+' joined)' : 'Tap below to run a factory.';
        else if(ph==='open') statusEl.textContent= !joined()? 'Round '+r+' is underway — join below to play.'
          : (myChoice(r)? 'Locked in — waiting for the round to end…' : 'Round '+r+' — make your plan below, then lock it in.');
        else statusEl.textContent = r<CT_NR ? 'Round '+r+' is done — the cap tightens next round…' : 'Game over — nice work.';
      }
    }

    aRange.addEventListener('input', renderDecide);
    tRange.addEventListener('input', renderDecide);

    if(HOST){
      function startRound(r){
        const A=capOf(r); const upd={phase:'open', round:r};
        // assign cleanup costs by cycling the tiers in join order — a balanced
        // spread guarantees the market has both natural sellers (cheap cleanup)
        // and natural buyers (expensive cleanup), even in a small class
        const ks=Object.keys(players()).sort((a,b)=>(players()[a]-players()[b])||(a<b?-1:1));
        const newCosts={}; let anyNew=false;
        ks.forEach(function(k,i){ if(costs()[k]===undefined){ newCosts[k]=CT_COSTS[i%CT_COSTS.length]; anyNew=true; } });
        if(anyNew) upd.costs=newCosts;
        if(A!==null){
          const cs=ks.map(k=> costs()[k]!==undefined?costs()[k]:(newCosts[k]!==undefined?newCosts[k]:50)).sort((x,y)=>x-y);
          const n=cs.length, rc=Math.round(n*(CT_E-A)/CT_AMAX);
          let P; if(!n) P=50; else if(rc<=0) P=Math.max(5,cs[0]-5); else if(rc>=n) P=cs[n-1]+5; else P=(cs[rc-1]+cs[rc])/2;
          upd.prices={}; upd.prices['r'+r]=Math.max(5, Math.round(P/5)*5);
        }
        backend.mergeDoc('polls', id, upd);
      }
      startBtn.addEventListener('click', function(){
        backend.setDoc('polls', id, {v:4, phase:'lobby', round:0, gameId:Date.now(), players:{}, costs:{}, prices:{}, rounds:{}, hist:{}});
      });
      roundBtn.addEventListener('click', function(){
        if(state.phase==='lobby'){ if(N()===0 && !confirm('No factories joined yet. Start anyway?')) return; startRound(1); }
        else if(state.phase==='results' && R()<CT_NR) startRound(R()+1);
      });
      endBtn.addEventListener('click', function(){
        if(state.phase!=='open') return;
        const r=R(), A=capOf(r), P=priceOf(r)||0, n=N();
        let em=0, cost=0;
        Object.keys(players()).forEach(function(k){
          const c=costs()[k]!==undefined?costs()[k]:50, p=planOf(k,r);
          em+=CT_E-p.a; cost+=planCost(c,p,P);
        });
        const entry={em:em, cost:Math.round(cost), base:CT_E*n, capT:(A===null?-1:A*n), price:P};
        const upd={phase:'results', hist:{}}; upd.hist['r'+r]=entry;
        backend.mergeDoc('polls', id, upd);
      });
      newBtn.addEventListener('click', function(){
        if(confirm('Start a new game? This clears the board for everyone.'))
          backend.setDoc('polls', id, {v:4, phase:'lobby', round:0, gameId:Date.now(), players:{}, costs:{}, prices:{}, rounds:{}, hist:{}});
      });
    } else {
      joinBtn.addEventListener('click', function(){
        if(!(state.phase==='lobby'||state.phase==='open') || joined()) return;
        // cost is assigned by the host at round start (balanced across the tiers)
        backend.mergeDocShard('polls', id, {players:{[pk]:Date.now()}});
      });
      submitBtn.addEventListener('click', function(){
        if(state.phase!=='open' || !joined() || myChoice(R())) return;
        const r=R(), A=capOf(r);
        const a=Math.max(0,Math.min(CT_AMAX, parseInt(aRange.value,10)||0));
        const em=CT_E-a;
        let t=0;
        if(A!==null){
          t=Math.max(-Math.max(0,A-em), Math.min(CT_E-A, parseInt(tRange.value,10)||0));
          const need=Math.max(0, em-A);
          if(need>0 && t<need) return; // short of the cap — blocked (comply box explains)
        }
        backend.mergeDocShard('polls', id, {rounds:{['r'+r]:{[pk]:{a:a,t:t}}}});
      });
    }
    backend.subscribeDoc('polls', id, function(d){ state=(d&&d.v===4)?d:{phase:'idle'}; render(); });
  });

  // ---- wire each Inspector game (adversarial pursuit, Ch 8.7) --------------
  // Half the room runs plants (comply / cheat quietly / cheat openly), half
  // inspects them (random / target big emitters / follow up on complaints).
  // Both move at once, and the inspectors' MIX sets the probability each kind
  // of cheat is caught — so there is no dominant move on either side.
  //
  // The teaching object is Becker (1968): deterrence = probability x penalty.
  // The payoffs are tuned so pulling ONE lever leaves cheating just as common
  // but drives it from open to quiet, and only pulling BOTH produces
  // compliance. Both single-lever paths give identical numbers, which is the
  // proof that only the product matters.
  //
  // Shared doc in 'polls':
  //   { iv:1, phase:'idle'|'lobby'|'open'|'reveal'|'final', gameId, rounds, round,
  //     cov, fine, players:{pk:ts}, roles:{pk:'p'|'i'}, choices:{rN:{pk:key}},
  //     caught:{rN:{pk:1}}, hist:{rN:{...}} }
  const INS_PAY  = {comply:60, quiet:85, open:100};   // revenue net of cleanup
  const INS_GAIN = {quiet:25, open:40};               // saved vs complying
  const INS_D = {                                     // detection before coverage
    rand:{quiet:0.18, open:0.30},
    big: {quiet:0.06, open:0.62},
    comp:{quiet:0.30, open:0.28}
  };
  const INS_COV={off:0.5, on:1.0}, INS_FINE={off:100, on:200};
  const INS_PMOVE=[
    {k:'comply', n:'Comply',            d:'Run the scrubbers. Costs you $40 in cleanup.',      p:'$60'},
    {k:'quiet',  n:'Cheat quietly',     d:'Cut cleanup back where it is hard to notice.',      p:'$85'},
    {k:'open',   n:'Cheat openly',      d:'Skip cleanup altogether. Cheapest, and obvious.',   p:'$100'}
  ];
  const INS_IMOVE=[
    {k:'rand', n:'Random spot checks',      d:'Even coverage — catches a little of everything.'},
    {k:'big',  n:'Target the big emitters', d:'Strong against blatant violations, weak on subtle ones.'},
    {k:'comp', n:'Follow up on complaints', d:'Strong against subtle violations near neighborhoods.'}
  ];
  const INS_FMT = n => '$'+Math.round(n).toLocaleString('en-US');
  const INS_PCT = x => Math.round(x*100)+'%';
  function insHash(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
  function insRnd(s){ let h=insHash(s); h^=h>>>16; h=Math.imul(h,2246822507)>>>0; h^=h>>>13; h=Math.imul(h,3266489909)>>>0; h^=h>>>16; return (h>>>0)/4294967296; }

  inspects.forEach(function(sec){
    const id = sec.dataset.insId;
    const el = s=>sec.querySelector(s);
    const roundsIn=el('[data-ins-rounds]'), startBtn=el('[data-ins-start]'),
      nextBtn=el('[data-ins-next]'), endBtn=el('[data-ins-end]'), finishBtn=el('[data-ins-finish]'),
      leversBox=el('[data-ins-levers]'), statusEl=el('[data-ins-status]'),
      joinBox=el('[data-ins-join]'), joinBtn=el('[data-ins-joinbtn]'),
      roleCard=el('[data-ins-rolecard]'), roleTag=el('[data-ins-roletag]'),
      roleName=el('[data-ins-rolename]'), roleDesc=el('[data-ins-roledesc]'),
      decideBox=el('[data-ins-decide]'), promptEl=el('[data-ins-prompt]'), optsEl=el('[data-ins-opts]'),
      submitBtn=el('[data-ins-submit]'), revealBox=el('[data-ins-reveal]'),
      verdictEl=el('[data-ins-verdict]'), revLines=el('[data-ins-revlines]'),
      meEl=el('[data-ins-me]'), boardBox=el('[data-ins-board]'),
      boardP=el('[data-ins-boardplants]'), boardI=el('[data-ins-boardinsp]'),
      gaugeSvg=el('[data-ins-gauge]'), eqEl=el('[data-ins-eq]'),
      mixBox=el('[data-ins-mix]'), mixSvg=el('[data-ins-mixsvg]'),
      sumBox=el('[data-ins-summary]'), chipsEl=el('[data-ins-chips]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });
    if(HOST) sec.classList.add('host');

    let pk=localStorage.getItem('ins-pk:'+id);
    if(!pk){ pk='p'+Math.random().toString(36).slice(2,10); localStorage.setItem('ins-pk:'+id, pk); }

    let state={phase:'idle'}, pick=null, pickRound=-1;
    const players=()=>state.players||{};
    const roles=()=>state.roles||{};
    const R=()=>state.round||0;
    const NR=()=>state.rounds||5;
    const cov=()=>state.cov||INS_COV.off;
    const fine=()=>state.fine||INS_FINE.off;
    const joined=()=>!HOST && players()[pk]!==undefined;
    const myRole=()=>roles()[pk]||null;
    const choicesFor=r=>(state.choices&&state.choices['r'+r])||{};
    const caughtFor=r=>(state.caught&&state.caught['r'+r])||{};
    const histFor=r=>(state.hist&&state.hist['r'+r])||null;

    // display names by join order, exactly as the commons game numbers players
    let nameMap={};
    function rebuildNames(){
      const ks=Object.keys(players()).sort((a,b)=>(players()[a]-players()[b])||(a<b?-1:1));
      nameMap={}; let np=0, ni=0;
      ks.forEach(function(k){
        const r=roles()[k];
        if(r==='i'){ ni++; nameMap[k]='Inspector '+ni; }
        else { np++; nameMap[k]='Plant '+np; }
      });
    }
    const nameOf=k=>nameMap[k]||'Player';
    function roleCounts(){
      let p=0,i=0; Object.keys(players()).forEach(function(k){ if(roles()[k]==='i') i++; else if(roles()[k]==='p') p++; });
      return {p:p,i:i};
    }

    // detection probabilities implied by the inspectors' actual mix this round
    function probs(imix, coverage){
      const tot=(imix.rand||0)+(imix.big||0)+(imix.comp||0);
      let q=0,o=0;
      if(!tot){ ['rand','big','comp'].forEach(function(s){ q+=INS_D[s].quiet/3; o+=INS_D[s].open/3; }); }
      else ['rand','big','comp'].forEach(function(s){
        const sh=(imix[s]||0)/tot; q+=sh*INS_D[s].quiet; o+=sh*INS_D[s].open; });
      return {q:Math.min(1,q*coverage), o:Math.min(1,o*coverage)};
    }
    // what a rational plant would do, given those probabilities
    function bestMove(p, f){
      const v={comply:INS_PAY.comply, quiet:INS_PAY.quiet-p.q*f, open:INS_PAY.open-p.o*f};
      let bk='comply'; ['quiet','open'].forEach(function(k){ if(v[k]>v[bk]) bk=k; });
      return {key:bk, v:v};
    }

    function totals(){
      const out={};
      Object.keys(players()).forEach(function(k){ out[k]={earn:0, caught:0, n:0}; });
      for(let r=1;r<=R();r++){
        const h=histFor(r); if(!h) continue;
        const ch=choicesFor(r), cg=caughtFor(r);
        Object.keys(players()).forEach(function(k){
          if(!out[k]) return;
          const c=ch[k]; if(c===undefined) return;
          out[k].n++;
          if(roles()[k]==='i'){
            const per=(h.perInsp&&h.perInsp[c]!==undefined)?h.perInsp[c]:0;
            out[k].earn+=50+80*per; out[k].caught+=per;
          } else {
            out[k].earn+=INS_PAY[c]-(cg[k]?h.fine:0);
          }
        });
      }
      return out;
    }

    // ── the gauge: what each cheat nets you AFTER the expected penalty,
    // measured against simply complying. Zero is the break-even line, so a bar
    // to the right means that cheat still pays. Showing BOTH cheats matters:
    // at the half-measure the open bar falls to zero while the quiet bar is
    // still positive, which is the whole lesson made visible.
    function renderGauge(){
      const h=histFor(R());
      const imix=h?h.imix:null, c=h?h.cov:cov(), f=h?h.fine:fine();
      const p=probs(imix||{}, c);
      const net={quiet:(INS_PAY.quiet-p.q*f)-INS_PAY.comply, open:(INS_PAY.open-p.o*f)-INS_PAY.comply};
      const best=bestMove(p,f);
      const W=460, CX=292, TOP=30, BH=28, GAP=20, HALF=150, GUT=8;
      const max=Math.max(25, Math.abs(net.quiet), Math.abs(net.open))*1.12;
      const w=v=>Math.max(2,(Math.abs(v)/max)*HALF);
      const rows=[{k:'quiet', n:'Cheat quietly', v:net.quiet},{k:'open', n:'Cheat openly', v:net.open}];
      let sv='';
      rows.forEach(function(o,i){
        const y=TOP+i*(BH+GAP), pays=o.v>0.5, bw=w(o.v);
        const x=pays?CX:CX-bw;
        sv+='<text class="ins-glbl" x="'+GUT+'" y="'+(y+19)+'">'+o.n+'</text>';
        sv+='<rect class="ins-gbar '+(pays?'gain':'pen over')+'" x="'+x.toFixed(1)+'" y="'+y+'" width="'
          + bw.toFixed(1)+'" height="'+BH+'" rx="4"/>';
        // a long bar reaches back under the row label, so its value goes INSIDE
        const inside = bw>62;
        const lx = inside ? (pays ? x+bw-8 : x+8) : (pays ? x+bw+7 : x-7);
        const anch = inside ? (pays?'end':'start') : (pays?'start':'end');
        sv+='<text class="ins-gnum'+(inside?' in':'')+'" x="'+lx.toFixed(1)+'" y="'+(y+20)
          + '" text-anchor="'+anch+'">'+(o.v>0?'+':'')+INS_FMT(o.v)+'</text>';
      });
      const BOT=TOP+2*BH+GAP;
      sv+='<path class="ins-gaxis" d="M'+CX+' '+(TOP-9)+' V'+(BOT+8)+'"/>';
      sv+='<text class="ins-gsub" x="'+CX+'" y="'+(TOP-14)+'" text-anchor="middle">same as complying</text>';
      sv+='<text class="ins-gsub" x="'+(CX-8)+'" y="'+(BOT+21)+'" text-anchor="end">&#8592; complying pays more</text>';
      sv+='<text class="ins-gsub" x="'+(CX+8)+'" y="'+(BOT+21)+'">cheating still pays &#8594;</text>';
      const vTxt={comply:'Complying pays best.', quiet:'Cheating still pays — quietly.', open:'Cheating openly pays best.'}[best.key];
      sv+='<text class="ins-gverdict" x="'+GUT+'" y="'+(BOT+42)+'" fill="'
        + (best.key==='comply'?'#2f6b4f':(best.key==='quiet'?'#8a6a2f':'#a1503c'))+'">'+vTxt+'</text>';
      gaugeSvg.innerHTML=sv;
      eqEl.innerHTML='Deterrence = chance caught &times; the fine. Quiet cheat: <b>'+INS_PCT(p.q)+'</b> &times; '
        + INS_FMT(f)+' = <b>'+INS_FMT(p.q*f)+'</b> against '+INS_FMT(INS_GAIN.quiet)+' saved. Open cheat: <b>'
        + INS_PCT(p.o)+'</b> &times; '+INS_FMT(f)+' = <b>'+INS_FMT(p.o*f)+'</b> against '+INS_FMT(INS_GAIN.open)
        + ' saved.'+(h?'':' Figures update as soon as a round is played.');
    }

    // ── round-by-round mix of what plants actually did ──
    function renderMix(){
      const rounds=[]; for(let r=1;r<=R();r++){ const h=histFor(r); if(h) rounds.push({r:r,h:h}); }
      mixBox.hidden = rounds.length===0;
      if(!rounds.length) return;
      const W=460, H=150, PADL=30, PADR=8, TOP=10, BASE=112;
      const n=rounds.length, slot=(W-PADL-PADR)/n, bw=Math.min(52, slot*0.62);
      let sv='';
      // the columns are shares of the plants, so give them a real percentage axis
      [0,0.25,0.5,0.75,1].forEach(function(f){
        const y=(BASE-f*(BASE-TOP)).toFixed(1);
        sv+='<path class="ins-grid" d="M'+PADL+' '+y+' H'+(W-PADR)+'"/>'
          + '<text class="ins-axl" x="'+(PADL-5)+'" y="'+(+y+3.5).toFixed(1)+'" text-anchor="end">'+Math.round(f*100)+'%</text>';
      });
      rounds.forEach(function(o,i){
        const h=o.h, m=h.mix||{}, tot=(m.comply||0)+(m.quiet||0)+(m.open||0);
        const x=PADL+i*slot+(slot-bw)/2;
        if(!tot){
          sv+='<rect class="ins-seg comply" x="'+x.toFixed(1)+'" y="'+(BASE-2)+'" width="'+bw.toFixed(1)+'" height="2"/>';
        } else {
          let y=BASE;
          [['open',m.open||0],['quiet',m.quiet||0],['comply',m.comply||0]].forEach(function(pair){
            const cls=pair[0], v=pair[1]; if(!v) return;
            const hgt=(v/tot)*(BASE-TOP); y-=hgt;
            sv+='<rect class="ins-seg '+cls+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'"/>';
            if(hgt>13) sv+='<text class="ins-mixnum" x="'+(x+bw/2).toFixed(1)+'" y="'+(y+hgt/2+3.5).toFixed(1)+'" text-anchor="middle">'+v+'</text>';
          });
        }
        sv+='<text class="ins-mixlbl" x="'+(x+bw/2).toFixed(1)+'" y="'+(BASE+13)+'" text-anchor="middle">R'+o.r+'</text>';
        sv+='<text class="ins-mixlbl" x="'+(x+bw/2).toFixed(1)+'" y="'+(BASE+26)+'" text-anchor="middle" fill="#3f5f7a">'
          + INS_FMT(h.det||0)+'</text>';
      });
      sv+='<text class="ins-mixlbl" x="'+PADL+'" y="'+(BASE+39)+'" fill="#3f5f7a">deterrence = chance caught &#215; fine</text>';
      mixSvg.innerHTML=sv;
    }

    // ── the round verdict, written to explain WHY it came out that way ──
    function renderReveal(){
      const ph=state.phase, r=R(), h=histFor(r);
      const show=(ph==='reveal'||ph==='final')&&h;
      revealBox.hidden=!show;
      if(!show) return;
      const m=h.mix||{}, im=h.imix||{}, nP=(m.comply||0)+(m.quiet||0)+(m.open||0);
      const p={q:h.pq, o:h.po};
      const best=bestMove(p, h.fine);
      const bestName={comply:'complying', quiet:'cheating quietly', open:'cheating openly'}[best.key];
      verdictEl.className='ins-verdict '+best.key;
      const cheats=(m.quiet||0)+(m.open||0), caughtN=(h.caughtQ||0)+(h.caughtO||0);
      verdictEl.textContent = best.key==='comply'
        ? 'Round '+r+': complying was the profitable move — and '+(m.comply||0)+' of '+nP+' plants took it.'
        : 'Round '+r+': '+bestName+' was the profitable move. '+cheats+' of '+nP+' plants cheated; '
          + caughtN+(caughtN===1?' was':' were')+' caught.';
      let s='Plants: <strong>'+(m.comply||0)+'</strong> complied, <strong>'+(m.quiet||0)
        +'</strong> cheated quietly, <strong>'+(m.open||0)+'</strong> cheated openly. '
        +'Inspectors: <strong>'+(im.rand||0)+'</strong> ran spot checks, <strong>'+(im.big||0)
        +'</strong> targeted big emitters, <strong>'+(im.comp||0)+'</strong> worked complaints. '
        +'That mix caught a quiet cheat <strong>'+INS_PCT(h.pq)+'</strong> of the time and an open one <strong>'
        +INS_PCT(h.po)+'</strong> of the time.';
      // The explainer has to reason about the move that ACTUALLY won, not just
      // the open cheat: at the half-measure the open cheat is deterred while
      // the quiet one is not, and saying "complying won" there would be false.
      const penO=h.po*h.fine, penQ=h.pq*h.fine;
      s+='<span class="why"><b>Why it came out that way.</b> ';
      if(best.key==='open'){
        s+='Cheating openly saved '+INS_FMT(INS_GAIN.open)+' against an expected penalty of '+INS_PCT(h.po)
          +' &times; '+INS_FMT(h.fine)+' = <strong>'+INS_FMT(penO)+'</strong>. The penalty was smaller than the saving, '
          +'so the most blatant cheat was also the most profitable one.';
      } else if(best.key==='quiet'){
        s+='The open cheat is now deterred — it saves '+INS_FMT(INS_GAIN.open)+' against an expected penalty of <strong>'
          +INS_FMT(penO)+'</strong>. But a quiet cheat saves '+INS_FMT(INS_GAIN.quiet)+' against only <strong>'
          +INS_FMT(penQ)+'</strong>, so cheating did not stop; it <strong>changed form</strong>. '
          +'Raising the penalty and funding inspections each double deterrence — it takes both to get past '
          +INS_FMT(INS_GAIN.open)+'.';
      } else {
        s+='Both cheats are now deterred: openly saves '+INS_FMT(INS_GAIN.open)+' against <strong>'+INS_FMT(penO)
          +'</strong> expected, quietly saves '+INS_FMT(INS_GAIN.quiet)+' against <strong>'+INS_FMT(penQ)
          +'</strong>. Complying is worth more than either — which took the penalty <em>and</em> the odds of being caught.';
      }
      s+=' Expected payouts this round: comply '+INS_FMT(best.v.comply)+', cheat quietly '
        + INS_FMT(best.v.quiet)+', cheat openly '+INS_FMT(best.v.open)+'.</span>';
      if(ph==='final'){
        s+='<span class="why"><b>Game over.</b> The scoreboard is below and the summary is on the right.</span>';
      }
      revLines.innerHTML=s;
    }

    function renderMe(){
      const r=R(), h=histFor(r);
      if(HOST||!joined()||!h||!(state.phase==='reveal'||state.phase==='final')){ meEl.hidden=true; return; }
      const c=choicesFor(r)[pk];
      if(c===undefined){ meEl.hidden=false; meEl.innerHTML='You sat this round out.'; return; }
      meEl.hidden=false;
      if(myRole()==='i'){
        const per=(h.perInsp&&h.perInsp[c]!==undefined)?h.perInsp[c]:0;
        const nm=(INS_IMOVE.filter(o=>o.k===c)[0]||{}).n||'your strategy';
        meEl.innerHTML='You ran <b>'+nm+'</b>. It caught <b>'+per.toFixed(2)
          +'</b> violations per inspector this round — you earned <b>'+INS_FMT(50+80*per)+'</b>.';
      } else {
        const got=caughtFor(r)[pk], base=INS_PAY[c];
        const nm={comply:'complied',quiet:'cheated quietly',open:'cheated openly'}[c];
        meEl.innerHTML='You <b>'+nm+'</b> for '+INS_FMT(base)+'. '
          + (got? 'You were <b>caught</b> and fined '+INS_FMT(h.fine)+' — you kept <b>'+INS_FMT(base-h.fine)+'</b>.'
                : (c==='comply'? 'No fine was possible.' : 'You were <b>not</b> caught — you kept <b>'+INS_FMT(base)+'</b>.'));
      }
    }

    function renderBoard(){
      const ph=state.phase;
      const show=(ph==='reveal'||ph==='final')&&Object.keys(players()).length>0;
      boardBox.hidden=!show; if(!show) return;
      const t=totals();
      const ks=Object.keys(t);
      const plants=ks.filter(k=>roles()[k]!=='i').sort((a,b)=>t[b].earn-t[a].earn).slice(0,5);
      const insp=ks.filter(k=>roles()[k]==='i').sort((a,b)=>t[b].caught-t[a].caught).slice(0,5);
      const rowsP=plants.map(k=>'<div class="ins-board-row'+(k===pk?' you':'')+'"><span class="nm">'
        +nameOf(k)+(k===pk?' (you)':'')+'</span><span class="vv">'+INS_FMT(t[k].earn)+'</span></div>').join('');
      const rowsI=insp.map(k=>'<div class="ins-board-row'+(k===pk?' you':'')+'"><span class="nm">'
        +nameOf(k)+(k===pk?' (you)':'')+'</span><span class="vv">'+t[k].caught.toFixed(1)+'</span></div>').join('');
      boardP.innerHTML=rowsP||'<div class="ins-board-empty">No plants yet.</div>';
      boardI.innerHTML=rowsI||'<div class="ins-board-empty">No inspectors yet.</div>';
    }

    // ── closing summary: the chips do the teaching, like the commons game ──
    function renderSummary(){
      const show=state.phase==='final';
      sumBox.hidden=!show; if(!show) return;
      const hs=[]; for(let r=1;r<=R();r++){ const h=histFor(r); if(h) hs.push(h); }
      if(!hs.length){ chipsEl.innerHTML=''; return; }
      const chip=(l,v,e,cls)=>'<div class="ins-chip'+(cls?' '+cls:'')+'"><span>'+l+'</span><b>'+v+'</b><em>'+e+'</em></div>';
      const first=hs[0], last=hs[hs.length-1];
      const share=h=>{ const m=h.mix||{}, t=(m.comply||0)+(m.quiet||0)+(m.open||0);
        return t? {cheat:((m.quiet||0)+(m.open||0))/t, open:(m.open||0)/t, quiet:(m.quiet||0)/t} : {cheat:0,open:0,quiet:0}; };
      const s0=share(first), s1=share(last);
      let chips='';
      // 1 — the number the whole game is about
      chips+=chip('Deterrence, first round to last',
        INS_FMT(first.det)+' &rarr; '+INS_FMT(last.det),
        'chance of being caught &times; the fine, against the '+INS_FMT(INS_GAIN.open)+' an open cheat saves');
      // 2 — did cheating actually stop?
      chips+=chip('Plants cheating', INS_PCT(s0.cheat)+' &rarr; '+INS_PCT(s1.cheat),
        'share of plants that cheated in round 1 versus the final round');
      // 3 — the form of cheating, which is where the half-measure shows up
      chips+=chip('Of those cheats, done openly', INS_PCT(s0.cheat?s0.open/s0.cheat:0)+' &rarr; '+INS_PCT(s1.cheat?s1.open/s1.cheat:0),
        'when penalties rise but detection stays low, cheating gets quieter rather than rarer');
      // 4 — enforcement actually delivered
      let cheatsAll=0, caughtAll=0, finesAll=0;
      hs.forEach(function(h){ const m=h.mix||{}; cheatsAll+=(m.quiet||0)+(m.open||0);
        caughtAll+=(h.caughtQ||0)+(h.caughtO||0); finesAll+=((h.caughtQ||0)+(h.caughtO||0))*h.fine; });
      chips+=chip('Cheats actually caught', caughtAll+' of '+cheatsAll,
        INS_FMT(finesAll)+' collected in fines across the whole game');
      // 5 — the lesson, stated against what this class actually produced
      const bothOn=last.cov>=INS_COV.on && last.fine>=INS_FINE.on;
      const oneOn=(last.cov>=INS_COV.on)!==(last.fine>=INS_FINE.on);
      let key;
      if(bothOn) key='Only the product deters. Raising the fine and funding inspections each doubled deterrence; neither alone was enough to beat the '+INS_FMT(INS_GAIN.open)+' a cheat saves, and together they were.';
      else if(oneOn) key='One lever was pulled, and deterrence doubled to '+INS_FMT(last.det)+' — still short of the '+INS_FMT(INS_GAIN.open)+' an open cheat saves. Cheating did not stop; it got quieter. Pull the other lever and the product finally clears the bar.';
      else key='With neither lever pulled, deterrence stayed at '+INS_FMT(last.det)+' against a '+INS_FMT(INS_GAIN.open)+' payoff for cheating. Adding inspectors or raising fines would each have doubled it — and only doing both clears the bar.';
      chips+=chip('The point', 'Penalty &times; probability', key, 'key');
      chipsEl.innerHTML=chips;
    }

    function renderDecide(){
      const ph=state.phase, r=R(), role=myRole();
      const canPlay = !HOST && joined() && ph==='open' && role;
      decideBox.hidden = !canPlay;
      roleCard.hidden = HOST || !joined() || !role;
      if(!roleCard.hidden){
        roleCard.classList.toggle('insp', role==='i');
        roleTag.textContent = role==='i' ? 'Your side' : 'Your side';
        roleName.textContent = role==='i' ? nameOf(pk)+' — enforcement agency' : nameOf(pk)+' — you run a plant';
        roleDesc.textContent = role==='i'
          ? 'You cannot inspect everyone. Choose where to put your effort each round, and you score on violations found.'
          : 'You earn more by cutting cleanup, and you pay a fine if you are caught. You keep whatever you clear.';
      }
      if(!canPlay) return;
      const already=choicesFor(r)[pk];
      const list = role==='i' ? INS_IMOVE : INS_PMOVE;
      promptEl.textContent = role==='i'
        ? 'Round '+r+' — where will you put your inspection effort?'
        : 'Round '+r+' — how will you run the plant this year? The fine, if you are caught, is '+INS_FMT(fine())+'.';
      if(pickRound!==r){ pick=null; pickRound=r; }
      optsEl.innerHTML = list.map(function(o){
        const on = already!==undefined ? (already===o.k) : (pick===o.k);
        return '<button class="ins-opt'+(on?(already!==undefined?' chosen':' on'):'')
          +(already!==undefined?' done':'')+'" type="button" data-k="'+o.k+'">'
          +'<span class="txt"><b>'+o.n+'</b><em>'+o.d+'</em></span>'
          +(o.p?'<span class="pay">'+o.p+'</span>':'')+'</button>';
      }).join('');
      Array.from(optsEl.querySelectorAll('.ins-opt')).forEach(function(b){
        b.addEventListener('click', function(){
          if(choicesFor(R())[pk]!==undefined) return;
          pick=b.dataset.k; renderDecide();
        });
      });
      submitBtn.hidden = already!==undefined;
      submitBtn.disabled = !pick;
      submitBtn.textContent = already!==undefined ? 'Locked in' : 'Lock in my choice';
    }

    function render(){
      rebuildNames();
      const ph=state.phase||'idle', r=R(), rc=roleCounts();
      joinBox.hidden = HOST || joined() || !(ph==='lobby'||ph==='open');
      renderDecide(); renderReveal(); renderMe(); renderBoard(); renderGauge(); renderMix(); renderSummary();
      if(HOST){
        startBtn.hidden = !(ph==='idle'||ph==='final');
        if(ph==='final') startBtn.textContent='Start a new game';
        nextBtn.hidden = !(ph==='lobby' || (ph==='reveal' && r<NR()));
        if(!nextBtn.hidden) nextBtn.textContent = ph==='lobby' ? 'Begin round 1 ▸' : 'Begin round '+(r+1)+' ▸';
        endBtn.hidden = ph!=='open';
        if(!endBtn.hidden) endBtn.textContent='End round '+r+' — reveal ▸';
        finishBtn.hidden = !(ph==='reveal'||ph==='open');
        leversBox.hidden = !(ph==='lobby'||ph==='reveal');
        Array.from(leversBox.querySelectorAll('.ins-lever')).forEach(function(b){
          b.classList.toggle('on', b.dataset.insLever==='cov' ? cov()>=INS_COV.on : fine()>=INS_FINE.on);
        });
        const n=Object.keys(players()).length;
        if(ph==='idle') statusEl.textContent='Open the lobby once everyone has the deck open.';
        else if(ph==='lobby') statusEl.textContent=n+' joined — '+rc.p+' plants, '+rc.i+' inspectors. Roles are dealt as students join.';
        else if(ph==='open'){ const d=Object.keys(choicesFor(r)).length;
          statusEl.textContent='Round '+r+' — '+d+' of '+n+' locked in. End the round when ready.'; }
        else if(ph==='reveal') statusEl.textContent = r<NR()
          ? 'Round '+r+' is on every screen. Pull a lever — or deliberately do not — then begin round '+(r+1)+'.'
          : 'Final round revealed. End the game to show the summary.';
        else statusEl.textContent='Game over — the summary is on every screen.';
      } else {
        if(ph==='idle') statusEl.textContent='Waiting for the instructor to open the inspection game…';
        else if(ph==='lobby') statusEl.textContent = joined()
          ? 'You’re in as '+nameOf(pk)+'. Waiting for round 1…' : 'Tap to join — you will be dealt a side.';
        else if(ph==='open') statusEl.textContent = !joined() ? 'Round '+r+' is underway — join below to play.'
          : (choicesFor(r)[pk]!==undefined ? 'Locked in — waiting for the round to close…' : 'Round '+r+' — make your choice.');
        else if(ph==='reveal') statusEl.textContent='Round '+r+' results are in.';
        else statusEl.textContent='Game over.';
      }
    }

    if(HOST){
      function fresh(){
        return {iv:1, phase:'lobby', gameId:Date.now(), rounds:Math.max(2,Math.min(8,parseInt(roundsIn.value,10)||5)),
                round:0, cov:INS_COV.off, fine:INS_FINE.off, players:{}, roles:{}, choices:{}, caught:{}, hist:{}};
      }
      startBtn.addEventListener('click', function(){
        if(state.phase==='final' && !confirm('Start a new game? This clears the board for everyone.')) return;
        backend.setDoc('polls', id, fresh());
      });
      leversBox.addEventListener('click', function(e){
        const b=e.target.closest('.ins-lever'); if(!b) return;
        if(b.dataset.insLever==='cov') backend.mergeDoc('polls', id, {cov: cov()>=INS_COV.on?INS_COV.off:INS_COV.on});
        else backend.mergeDoc('polls', id, {fine: fine()>=INS_FINE.on?INS_FINE.off:INS_FINE.on});
      });
      nextBtn.addEventListener('click', function(){
        const ph=state.phase;
        if(!(ph==='lobby'||ph==='reveal')) return;
        const r=(ph==='lobby')?1:R()+1;
        if(ph==='lobby' && !Object.keys(players()).length && !confirm('Nobody has joined yet. Start anyway?')) return;
        backend.mergeDoc('polls', id, {phase:'open', round:r});
      });
      function score(final){
        const r=R(), ch=choicesFor(r), gid=String(state.gameId||0);
        const mix={comply:0,quiet:0,open:0}, imix={rand:0,big:0,comp:0};
        Object.keys(ch).forEach(function(k){
          const c=ch[k];
          if(roles()[k]==='i'){ if(imix[c]!==undefined) imix[c]++; }
          else if(mix[c]!==undefined) mix[c]++;
        });
        const c=cov(), f=fine(), p=probs(imix, c);
        // deterministic draws, so every open copy of the deck agrees
        const caught={}; let cq=0, co=0;
        const strat=['rand','big','comp'], itot=imix.rand+imix.big+imix.comp;
        const credit={rand:0,big:0,comp:0};
        Object.keys(ch).forEach(function(k){
          if(roles()[k]==='i') return;
          const mv=ch[k]; if(mv!=='quiet'&&mv!=='open') return;
          const pr=(mv==='quiet')?p.q:p.o;
          if(insRnd(gid+':'+r+':'+k+':catch')<pr){
            caught[k]=1; if(mv==='quiet') cq++; else co++;
            // attribute the catch to a strategy drawn from the inspectors' mix
            let u=insRnd(gid+':'+r+':'+k+':who'), acc=0, s=strat[0];
            if(itot){ for(let i=0;i<3;i++){ acc+=imix[strat[i]]/itot; if(u<=acc){ s=strat[i]; break; } } }
            else s=strat[Math.floor(u*3)%3];
            credit[s]++;
          }
        });
        const perInsp={};
        strat.forEach(function(s){ perInsp[s]= imix[s] ? credit[s]/imix[s] : 0; });
        const entry={cov:c, fine:f, mix:mix, imix:imix, pq:p.q, po:p.o, det:p.o*f,
                     caughtQ:cq, caughtO:co, credit:credit, perInsp:perInsp};
        const upd={phase: final?'final':'reveal', hist:{}, caught:{}};
        upd.hist['r'+r]=entry; upd.caught['r'+r]=caught;
        backend.mergeDoc('polls', id, upd);
      }
      endBtn.addEventListener('click', function(){ if(state.phase==='open') score(R()>=NR()); });
      finishBtn.addEventListener('click', function(){
        if(state.phase==='open') score(true);
        else if(state.phase==='reveal') backend.mergeDoc('polls', id, {phase:'final'});
      });
    } else {
      joinBtn.addEventListener('click', function(){
        if(joined() || !(state.phase==='lobby'||state.phase==='open')) return;
        // roles alternate by join order so the two sides stay balanced without
        // the host having to sort anybody: even -> plant, odd -> inspector
        const n=Object.keys(players()).length;
        backend.mergeDocShard('polls', id, {players:{[pk]:Date.now()}, roles:{[pk]:(n%2===0?'p':'i')}});
      });
      submitBtn.addEventListener('click', function(){
        const r=R();
        if(state.phase!=='open' || !joined() || !pick || choicesFor(r)[pk]!==undefined) return;
        const upd={choices:{}}; upd.choices['r'+r]={[pk]:pick};
        backend.mergeDocShard('polls', id, upd);
      });
    }
    backend.subscribeDoc('polls', id, function(d){ state=(d&&d.iv===1)?d:{phase:'idle'}; render(); });
  });

  // ---- wire each live Q&A / open-response feed ------------------------------
  // Doc in 'polls' (sharded): submissions live in the writer's shard as
  //   items:{rid:{text,ts}}; upvotes as up:{rid:increment} in the voter's shard
  //   (deep-merge SUMS them across shards). Feed ranks by votes, then recency.
  qafeeds.forEach(function(sec){
    const id=sec.dataset.qaId;
    const MAXP=Math.max(1, parseInt(sec.dataset.qaMax||'3',10)||3);
    const feed=sec.querySelector('[data-qa-feed]');
    const form=sec.querySelector('[data-qa-form]');
    const input=sec.querySelector('[data-qa-input]');
    const sendBtn=sec.querySelector('[data-qa-send]');
    const totalEl=sec.querySelector('[data-qa-total]');
    const hintEl=sec.querySelector('[data-qa-hint]');
    const resetBtn=sec.querySelector('[data-qa-reset]');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });

    let mine=[], voted=[];
    try{ mine=JSON.parse(localStorage.getItem('qa-mine:'+id)||'[]'); }catch(e){ mine=[]; }
    try{ voted=JSON.parse(localStorage.getItem('qa-voted:'+id)||'[]'); }catch(e){ voted=[]; }
    let state={};

    function postsLeft(){ return Math.max(0, MAXP - mine.filter(r=>(state.items||{})[r]).length); }
    function updateComposer(){
      if(HOST) return;
      const left=postsLeft();
      input.disabled = left===0; sendBtn.disabled = left===0;
      sendBtn.textContent = left===0 ? 'All posted' : 'Post';
      hintEl.textContent = left===0
        ? 'You’ve used your '+MAXP+' posts — keep upvoting the ones you want discussed.'
        : 'Post a response ('+left+' of '+MAXP+' left) — and ▲ upvote the ones you want discussed.';
    }

    function render(){
      const items=state.items||{}, up=state.up||{};
      const rids=Object.keys(items).filter(r=>items[r]&&items[r].text);
      totalEl.textContent=rids.length;
      if(!rids.length){ feed.innerHTML='<div class="qa-empty">Waiting for the first response…</div>'; updateComposer(); return; }
      rids.sort(function(a,b){ return (up[b]||0)-(up[a]||0) || (items[b].ts||0)-(items[a].ts||0); });
      const shown=rids.slice(0,30);
      let hh='';
      shown.forEach(function(r,i){
        const n=up[r]||0, isMine=mine.indexOf(r)>-1, hasVoted=voted.indexOf(r)>-1;
        hh+='<div class="qa-item'+(isMine?' mine':'')+(i===0&&n>0?' top1':'')+'">'
          +'<button class="qa-up'+(hasVoted?' voted':'')+'" type="button" data-rid="'+r+'"'
          +((isMine||hasVoted||HOST)?' disabled':'')
          +' title="'+(isMine?'You can’t upvote your own post':hasVoted?'You upvoted this':'Upvote')+'">'
          +'<span class="arr">▲</span><span class="n">'+n+'</span></button>'
          +'<div class="qa-text"></div>'
          +(isMine?'<span class="qa-tag">you</span>':'')
          +'</div>';
      });
      if(rids.length>shown.length) hh+='<div class="qa-more">…and '+(rids.length-shown.length)+' more</div>';
      feed.innerHTML=hh;
      // set text via textContent (submissions are untrusted free text — never innerHTML)
      Array.from(feed.querySelectorAll('.qa-item')).forEach(function(elItem,i){
        elItem.querySelector('.qa-text').textContent=items[shown[i]].text;
      });
      Array.from(feed.querySelectorAll('.qa-up')).forEach(function(b){
        b.addEventListener('click', function(){
          const r=b.dataset.rid;
          if(HOST || voted.indexOf(r)>-1 || mine.indexOf(r)>-1) return;
          voted.push(r); localStorage.setItem('qa-voted:'+id, JSON.stringify(voted));
          backend.mergeDocShard('polls', id, {up:{[r]:backend.inc(1)}});
          b.classList.add('voted'); b.disabled=true;
        });
      });
      updateComposer();
    }

    if(HOST){
      sec.classList.add('host');
      form.hidden=true;
      hintEl.textContent='Live feed — students post and upvote on their own screens.';
      resetBtn.hidden=false;
      resetBtn.addEventListener('click', function(){
        if(confirm('Clear all responses and votes?')) backend.reset('polls', id);
      });
    } else {
      form.addEventListener('submit', function(ev){
        ev.preventDefault();
        if(postsLeft()===0) return;
        let txt=input.value.replace(/\s+/g,' ').trim();
        if(!txt){ input.focus(); return; }
        if(txt.length>140) txt=txt.slice(0,140);
        const low=' '+txt.toLowerCase().replace(/[^a-z0-9']+/g,' ')+' ';
        if(WC_BAD.some(function(b){ return low.indexOf(' '+b+' ')>-1; })){
          input.value=''; input.placeholder='Let’s keep it classroom-friendly…'; return; }
        const rid='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
        mine.push(rid); localStorage.setItem('qa-mine:'+id, JSON.stringify(mine));
        backend.mergeDocShard('polls', id, {items:{[rid]:{text:txt, ts:Date.now()}}});
        input.value='';
      });
    }
    backend.subscribeDoc('polls', id, function(d){ state=d||{}; render(); });
  });

  // ---- wire each Consensus 2050 Grid (gridmix) ------------------------------
  // Sharded sums in 'polls': counts.s<i> += student's allocation, counts.n += 1.
  // Class average per source = s_i / n. Scene shows TODAY's mix until n>0.
  const GM_SRC=[
    {name:'Solar',       color:'#E9A03B', co2:41,  firm:false},
    {name:'Wind',        color:'#7FB069', co2:11,  firm:false},
    {name:'Hydro',       color:'#4A90B8', co2:24,  firm:true},
    {name:'Nuclear',     color:'#8E7CC3', co2:12,  firm:true},
    {name:'Natural Gas', color:'#C9722B', co2:490, firm:true},
    {name:'Coal',        color:'#6B5B4E', co2:820, firm:true}];
  const GM_TODAY=[7,10,6,19,43,15];   // approx US electricity mix
  gridmixes.forEach(function(sec){
    const id=sec.dataset.gmId;
    const el=s=>sec.querySelector(s);
    const ranges=Array.from(sec.querySelectorAll('.gm-range'));
    const pcts=Array.from(sec.querySelectorAll('[data-gm-pct]'));
    const allocEl=el('[data-gm-alloc]'), remainEl=el('[data-gm-remain]');
    const lockBtn=el('[data-gm-lock]'), statusEl=el('[data-gm-status]');
    const nEl=el('[data-gm-n]'), resetBtn=el('[data-gm-reset]');
    const barLbl=el('[data-gm-barlbl]'), sceneLbl=el('[data-gm-scenelbl]');
    const co2Chip=el('[data-gm-co2]'), firmChip=el('[data-gm-firm]');
    const svg=el('.gm-svg');
    sec.addEventListener('keydown', e=>{ if(navKeys.indexOf(e.key)>-1) e.stopPropagation(); });
    if(HOST) sec.classList.add('host');

    let mine=null; try{ mine=JSON.parse(localStorage.getItem('gm-done:'+id)); }catch(e){ mine=null; }

    function sumR(){ let t=0; ranges.forEach(r=>{ t+=(parseInt(r.value,10)||0); }); return t; }
    function updatePanel(){
      const t=sumR();
      allocEl.textContent=t; remainEl.textContent=Math.max(0,100-t);
      ranges.forEach((r,i)=>{ pcts[i].textContent=(parseInt(r.value,10)||0)+'%'; });
      if(!mine) lockBtn.disabled = (t!==100);
    }
    ranges.forEach(function(r){
      r.addEventListener('input', function(){
        let others=0; ranges.forEach(o=>{ if(o!==r) others+=(parseInt(o.value,10)||0); });
        const maxA=Math.max(0,100-others);
        if((parseInt(r.value,10)||0)>maxA) r.value=maxA;
        updatePanel();
      });
    });
    function lockUI(){
      ranges.forEach((r,i)=>{ if(mine){ r.value=mine[i]; } r.disabled=!!mine; });
      if(mine){ lockBtn.disabled=true; lockBtn.textContent='Locked in ✓'; }
      updatePanel();
    }

    // ---------- the scene ----------
    function setMixScene(mix, n){
      // mix = array of 6 shares summing ~100
      const solar=mix[0], wind=mix[1], hydro=mix[2], nuke=mix[3], gas=mix[4], coal=mix[5];
      // sun grows with solar
      const sun=el('[data-gm-sun]');
      sun.style.transformOrigin='96px 74px';
      sun.style.transform='scale('+(0.75+solar/60)+')';
      // solar farm: up to 21 panels in 3 rows
      const farm=el('[data-gm-solar]');
      const nPan=Math.min(21, Math.round(solar/2.4));
      let ph='';
      for(let i=0;i<nPan;i++){
        const row=Math.floor(i/7), col=i%7;
        const x=36+col*30+row*10, y=316+row*24;
        ph+='<g transform="translate('+x+' '+y+') skewX(-14)">'
          +'<rect width="24" height="15" rx="2" fill="#2f5d8a" stroke="#1d3f61" stroke-width="1.6"/>'
          +'<path d="M8 0 v15 M16 0 v15 M0 7.5 h24" stroke="#7fa8cc" stroke-width="1"/>'
          +'<line x1="12" y1="15" x2="12" y2="21" stroke="#5b6b63" stroke-width="2.4"/></g>';
      }
      farm.innerHTML=ph;
      // turbines: show k of 6
      const turbs=Array.from(sec.querySelectorAll('[data-gm-turb]'));
      const kT=Math.min(6, Math.round(wind/5));
      turbs.forEach((t,i)=>{ t.style.opacity = i<kT ? 1 : .1; });
      // hydro / nuclear / gas / coal presence + intensity
      el('[data-gm-hydro]').style.opacity = hydro>0 ? 1 : .14;
      el('[data-gm-spill]').style.opacity = hydro>2 ? .95 : 0;
      const nk=el('[data-gm-nuke]');
      nk.style.opacity = nuke>0 ? 1 : .14;
      el('[data-gm-steam]').style.opacity = Math.min(1, nuke/18);
      el('[data-gm-gas]').style.opacity = gas>0 ? 1 : .14;
      el('.gm-flame').style.opacity = Math.min(1, .25+gas/40);
      el('[data-gm-coal]').style.opacity = coal>0 ? 1 : .14;
      el('[data-gm-smoke]').style.opacity = Math.min(1, coal/22);
      // haze the sky with fossil share
      const co2=GM_SRC.reduce((a,s,i)=>a+s.co2*mix[i],0)/100;
      el('[data-gm-haze]').setAttribute('opacity', Math.min(.32, co2/2600));
      // bars + chips
      GM_SRC.forEach((s,i)=>{ sec.querySelector('[data-gm-seg="'+i+'"]').style.width=mix[i]+'%';
        sec.querySelector('[data-gm-seg="'+i+'"]').title=s.name+' '+Math.round(mix[i])+'%'; });
      co2Chip.textContent='CO₂: '+Math.round(co2)+' g/kWh';
      co2Chip.className='gm-chip2 '+(co2<120?'co2-good':co2<320?'co2-mid':'co2-bad');
      const firm=mix.reduce((a,v,i)=>a+(GM_SRC[i].firm?v:0),0);
      firmChip.textContent='Firm power: '+Math.round(firm)+'%';
      sceneLbl.textContent = n>0 ? 'CLASS 2050 GRID · '+n+' vote'+(n===1?'':'s') : "TODAY'S GRID";
      barLbl.textContent = n>0 ? 'CLASS 2050' : '2050 (no votes yet)';
    }
    // today's reference bar (static)
    GM_TODAY.forEach((v,i)=>{ const t=sec.querySelector('[data-gm-tseg="'+i+'"]'); t.style.width=v+'%'; t.title=GM_SRC[i].name+' '+v+'%'; });

    function render(counts){
      const n=counts.n||0;
      nEl.textContent=n;
      if(n>0){
        const mix=GM_SRC.map((s,i)=> (counts['s'+i]||0)/n );
        setMixScene(mix, n);
      } else {
        setMixScene(GM_TODAY.slice(), 0);
      }
      if(HOST){ statusEl.textContent = n>0 ? 'The class average updates live as grids come in.'
        : 'Students design their mix on their own screens — the scene shows today’s grid until votes arrive.'; }
      else if(mine){ statusEl.textContent='Your grid is in! The scene shows the CLASS average — watch it shift as more come in.'; }
      else { statusEl.textContent='Slide each source, hit exactly 100%, then lock in. The scene shows the class’s average grid.'; }
    }

    if(HOST){
      resetBtn.hidden=false;
      resetBtn.addEventListener('click', function(){ if(confirm('Reset all submitted grids?')) backend.reset('polls', id); });
    } else {
      lockBtn.addEventListener('click', function(){
        if(mine || sumR()!==100) return;
        mine=ranges.map(r=>parseInt(r.value,10)||0);
        localStorage.setItem('gm-done:'+id, JSON.stringify(mine));
        const upd={counts:{n:backend.inc(1)}};
        mine.forEach((v,i)=>{ if(v>0) upd.counts['s'+i]=backend.inc(v); });
        backend.mergeDocShard('polls', id, upd);
        lockUI();
      });
    }
    lockUI();
    backend.subscribe('polls', id, render);
  });

  // ---- wire each Efficiency Payback Race ------------------------------------
